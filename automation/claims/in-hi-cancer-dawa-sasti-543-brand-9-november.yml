- claim: "17 अक्टूबर, 137 दवाएं, TMR"
  value: "17 अक्टूबर 2026, 137"
  value_note: "원문 17 अक्टूबर, 2026 को ... 137 गैर-अनुसूचित"
  quote: "17 अक्टूबर, 2026 को, एनपीपीए ने अत्यधिक व्यापार मार्जिन को संबोधित करने, कैंसर के इलाज को अधिक किफायती बनाने और कैंसर रोधी दवाओं तक पहुंच में सुधार करने के लिए जनहित में 137 गैर-अनुसूचित कैंसर रोधी दवाओं के व्यापार मार्जिन युक्त्रीकरण (टीएमआर) की घोषणा की"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329745
- claim: "शामिल दवाएं"
  value: "20 से अधिक, डेनोसुमैब, पेगफिलग्रैस्टिम, बेवाकिज़ुमाब"
  value_note: "원문 목록"
  quote: "137 गैर-अनुसूचित कैंसर रोधी दवाओं में 20 से अधिक प्रकार के कैंसर के इलाज में उपयोग की जाने वाली इम्युनोथेरेपी दवाएं, स्तन और प्रोस्टेट कैंसर के रोगियों द्वारा उपयोग की जाने वाली डेनोसुमैब, कैंसर रोगियों में न्यूट्रोपेनिया को रोकने के लिए उपयोग की जाने वाली पेगफिलग्रैस्टिम, और बेवाकिज़ुमाब शामिल हैं, जिसे कोलन, डिम्बग्रंथि और गर्भाशय ग्रीवा के कैंसर के इलाज के लिए अनुमोदित किया गया है।"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329745
