  value_note: "원문 543 ब्रांड / 9 नवंबर, 2026 से प्रभावी"
  quote: "राष्ट्रीय औषधीय मूल्य निर्धारण प्राधिकरण (एनपीपीए) ने कैंसर रोधी 543 ब्रांड की दवाओं की संशोधित अधिकतम खुदरा कीमत (एमआरपी) के साथ एक सूची जारी की है। संशोधित एमआरपी 9 नवंबर, 2026 से प्रभावी होंगी।"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329745
