- claim: "Mascara discard 2-4 months after purchase"
  value: "two to four months, 2, 4"
  value_note: "2~4 = two to four months"
  quote: "Manufacturers usually recommend discarding mascara two to four months after purchase."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Mascara wands exposed to bacteria and fungi"
  value: "mascara wands"
  quote: "Applicators, especially mascara wands, are exposed to bacteria and fungi each time you use them."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Eye-area cosmetics shorter shelf life, eye infections"
  value: "shorter shelf lives"
  quote: "Eye-area cosmetics tend to have shorter shelf lives than other products, which may cause eye infections that can be serious."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Bathroom moisture helps bacteria grow"
  value: "bathroom"
  quote: "Exposure to moisture, such as in a bathroom, may make it easier for bacteria and fungi to grow."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Heat breaks down preservatives"
  value: "heat, hot car"
  quote: "Heat can make preservatives break down and cause bacteria and fungi to grow faster."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Dry mascara: throw away, no water or saliva"
  value: "saliva"
  quote: "If mascara becomes dry, throw it away. Do not add water or, even worse, saliva to moisten it"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Do not share makeup"
  value: "sharing an infection"
  quote: "You may be sharing an infection."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Eye infection steps"
  value: "eye infection"
  quote: "If you have an eye infection, talk with your health care provider, stop using all eye-area cosmetics, and throw away those you were using when the infection occurred."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
