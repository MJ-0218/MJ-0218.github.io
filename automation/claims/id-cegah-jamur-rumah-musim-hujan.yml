- claim: "Kunci mengendalikan jamur = kendalikan kelembapan"
  value: "kelembapan"
  quote: "The key to mold control is moisture control."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Kelembapan di bawah 60%, ideal 30–50%"
  value: "60%, 30–50%"
  value_note: "below 60 percent (ideally between 30 and 50 percent) = di bawah 60%, ideal 30–50%"
  quote: "If possible, keep indoor humidity below 60 percent (ideally between 30 and 50 percent) relative humidity."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Keringkan dalam 24–48 jam"
  value: "24–48 jam"
  value_note: "24-48 hours = 24–48 jam"
  quote: "It is important to dry water-damaged areas and items within 24-48 hours to prevent mold growth."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Kurang dari sekitar 10 kaki persegi bisa dibersihkan sendiri"
  value: "10 kaki persegi, 3 x 3 kaki"
  value_note: "10 square feet = 10 kaki persegi; 3 ft. by 3 ft. = 3 x 3 kaki"
  quote: "If the moldy area is less than about 10 square feet (less than roughly a 3 ft. by 3 ft. patch), in most cases, you can handle the job yourself"
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
