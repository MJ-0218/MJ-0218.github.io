- claim: "43개 단지 2만 5000세대 점검, 354건 적발, 위장전입 334건, 수사의뢰, 처벌"
  value: "43개, 2만 5000세대, 354건, 334건, 10년"
  value_note: "원문 그대로"
  quote: "정부가 서울 등 43개 단지 2만 5000세대 당첨자를 점검해 위장전입 334건을 포함한 부정청약 의심사례 354건을 적발했다. 적발 건은 모두 수사의뢰할 예정이며, 부정청약으로 확정되면 형사처벌과 계약취소, 계약금 몰수, 10년간 청약자격 제한 등의 조치가 이뤄진다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "지난해 상반기 2만 8000호 252건 대비 40.5% 증가"
  value: "2만 8000호, 252건, 40.5%"
  value_note: "원문 그대로"
  quote: "지난해 상반기 점검(2만 8000호, 252건)과 비교하면 점검 대상 세대수는 줄었으나 의심사례 적발건수는 40.5% 증가했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "부양가족 실제 거주 여부 집중 점검"
  value: "부양가족"
  value_note: "원문 그대로"
  quote: "서울 등 43개 단지 2만 5000세대 당첨자를 대상으로 부양가족의 실제 거주 여부 등을 집중 점검해 354건의 부정청약 의심사례를 적발했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "점검 인력·기간 확대, 임신·장애 자격·위조 조사"
  value: "임신, 장애"
  value_note: "원문 그대로"
  quote: "점검 인력과 점검기간을 확대했으며, 임신·장애 등 청약자격의 적절성과 위조여부도 중점적으로 조사했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "유형: 위장전입 334, 위장미혼 18, 자격매매 1, 위장퇴사 1"
  value: "334건, 18건, 1건"
  value_note: "원문 그대로"
  quote: "위장전입이 334건으로 가장 많았으며, 위장미혼 18건, 자격매매 1건, 위장퇴사 1건이었다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "위장전입 정의"
  value: "위장전입"
  value_note: "원문 그대로"
  quote: "위장전입은 해당지역 거주자 또는 무주택세대구성원 자격을 얻거나, 부양가족 점수를 높이기 위해 허위로 전입신고하고 청약하는 행태로"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "위장전입 사례 (분당·여수·경기 광주·서울)"
  value: "분당, 여수, 광주"
  value_note: "원문 그대로"
  quote: "E씨는 부인과 아들 자녀 와 함께 분당소재 아파트에서 거주하면서, 여수에서 거주하는 모친과 경기 광주에서 거주하는 장모를 각각 본인 집으로 위장전입 시킨 후, 서울에서 분양하는 주택에 청약가점제 일반공급으로 당첨됐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "위장미혼 정의"
  value: "위장미혼"
  value_note: "원문 그대로"
  quote: "위장미혼은 유주택자와 결혼하고도 청약자격(무주택자)을 얻기 위해 혼인신고 없이 청약하는 사례다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "자격매매·위장퇴사"
  value: "자격매매, 위장퇴사"
  value_note: "원문 그대로"
  quote: "청약자격 매매 알선자와 공모해 대리로 청약과 계약한 뒤 사례금을 주고받은 자격매매, 저소득자 조건을 만들기 위해 허위로 퇴사한 위장퇴사 사례도 적발했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "처벌: 3년 이하 징역·3000만 원 이하 벌금, 계약취소, 계약금 10% 몰수, 10년 제한"
  value: "3년, 3000만 원, 10%, 10년"
  value_note: "원문 그대로"
  quote: "형사처벌(3년 이하 징역 또는 3000만 원 이하 벌금), 계약취소(주택환수), 계약금(분양가의 10%) 몰수, 청약자격 제한(10년) 등 강력한 조치를 할 예정이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "경찰 특별단속 2151명 송치·16명 구속 (작년 10/17~올해 10/31)"
  value: "10월 17일, 10월 31일, 2151명, 16명"
  value_note: "원문 그대로"
  quote: "경찰청 국가수사본부는 지난해 10월 17일부터 올해 10월 31일까지 3565명을 대상으로 부동산범죄 1·2차 특별단속을 벌여 2151명을 송치하고 16명을 구속했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "3차 특별단속 1일부터 내년 10월 31일까지"
  value: "1일, 11월 1일, 10월 31일"
  value_note: "기사일 11월 10일 기준 '지난 1일' = 11월 1일"
  quote: "특별단속 종료 직후인 지난 1일부터 3차 특별단속에 착수했으며, 내년 10월 31일까지"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
- claim: "10일 발표(부동산 불법행위 대응협의회)"
  value: "10일, 11월 10일"
  value_note: "원문 그대로"
  quote: "국무조정실 부동산감독추진단은 10일 정부서울청사에서 제22차 부동산 불법행위 대응협의회를 열어"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975362"
