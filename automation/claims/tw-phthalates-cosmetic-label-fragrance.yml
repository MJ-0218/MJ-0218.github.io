- claim: "What phthalates are; fragrance solvent"
  value: "plastics, solvents"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Phthalates are chemical compounds developed in the last century that are used to make plastics more durable."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "Solvents and stabilizers in fragrance"
  value: "stabilizers"
  quote: "Phthalates also function as solvents and stabilizers in perfumes and other fragrance preparations."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "Products that may contain"
  value: "nail polishes, hair sprays"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Cosmetics that may contain phthalates include nail polishes, hair sprays, aftershave lotions, cleansers, and shampoos."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "DBP DMP DEP uses"
  value: "DBP, DMP, DEP"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "used as a plasticizer in products such as nail polishes (to reduce cracking by making them less brittle); dimethylphthalate (DMP) , used in hair sprays (to help avoid stiffness by allowing them to form a flexible film on the hair); and diethylphthalate (DEP) , used as a solvent and fixative in fragrances."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "2010 survey: DBP/DMP rare; DEP only common"
  value: "2010"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "According to the FDA's latest survey of cosmetics, conducted in 2010, however, DBP and DMP are used rarely. DEP appears to be the only phthalate still commonly used in cosmetics."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "Fragrance components need not be listed"
  value: "Fragrance"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "However, the regulations do not require the listing of the individual fragrance or flavor, or their specific ingredients. Fragrance or flavor may be listed as such."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "No safety concerns with DEP as used"
  value: "DEP"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Based on currently available safety information, the FDA does not have safety concerns with the use of DEP as currently used in cosmetics and fragrances."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
- claim: "To avoid DEP choose products without Fragrance/Flavor"
  value: "Flavor"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "may wish to choose products that do not include"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/phthalates-cosmetics
