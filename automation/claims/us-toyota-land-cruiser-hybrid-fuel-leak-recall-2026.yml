- claim: "2024–2027 Land Cruiser Hybrid; fuel tube may disconnect and leak"
  value: "2024–2027, 2024-2027"
  value_note: "2024-2027 = 2024–2027"
  quote: "Toyota Motor Engineering & Manufacturing (Toyota) is recalling certain 2024-2027 Toyota Land Cruiser Hybrid vehicles. The fuel tube connection near the fuel tank may disconnect and leak fuel."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=TOYOTA&model=LAND%20CRUISER%20HYBRID&modelYear=2026"
- claim: "Fire risk"
  value: "fire"
  quote: "A fuel leak in the presence of an ignition source can increase the risk of a fire."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=TOYOTA&model=LAND%20CRUISER%20HYBRID&modelYear=2026"
- claim: "Campaign number"
  value: "26V673000"
  quote: "26V673000"
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=TOYOTA&model=LAND%20CRUISER%20HYBRID&modelYear=2026"
- claim: "Remedy free; letters Nov. 29, 2026; Toyota number; recall codes"
  value: "Nov. 29, 2026, 1-800-331-4331, 26TB23, 26TA23"
  value_note: "November 29, 2026 = Nov. 29, 2026"
  quote: "Dealers will inspect the connection and install a supplemental clamp or, as necessary, replace the resin fuel tube and install a supplemental clamp, free of charge. Owner notification letters are expected to be mailed November 29, 2026. Owners may contact Toyota's customer service at 1-800-331-4331. Toyota's numbers for this recall are 26TB23 and 26TA23."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=TOYOTA&model=LAND%20CRUISER%20HYBRID&modelYear=2026"
