- claim: "Yogi Adityanath and Vaishnaw flag off from Varanasi tomorrow (31 Oct)"
  value: "31 October 2026"
  value_note: "원문 'tomorrow', 보도 30 OCT 2026 → 31 October 2026"
  quote: "Uttar Pradesh Chief Minister Shri Yogi Adityanath and Union Minister for Railways Shri Ashwini Vaishnaw will flag off new Vande Bharat Sleeper Express services between Varanasi and New Delhi from Varanasi tomorrow."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Timings both directions"
  value: "20:50, 06:10, 21:40, 07:10, 20:50 → 06:10"
  value_note: "원문 depart Varanasi at 20:50 ... 06:10 / depart New Delhi at 21:40 ... 07:10"
  quote: "The new service will depart Varanasi at 20:50 and arrive in New Delhi at 06:10 the following morning. In the return direction, it will depart New Delhi at 21:40 and reach Varanasi at 07:10 the following day."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Stops"
  value: "Prayagraj, Kanpur Central, Aligarh, Ghaziabad"
  value_note: "원문 Prayagraj, Kanpur Central, Aligarh and Ghaziabad"
  quote: "The service will connect Varanasi, Prayagraj, Kanpur Central, Aligarh and Ghaziabad, before reaching New Delhi."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Six days, not Fri from Varanasi, not Sat from Delhi"
  value: "six days a week"
  quote: "The service will operate six days a week, except on Fridays for the Varanasi-originating service and on Saturdays for the New Delhi-originating service."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "55 / 35 minutes faster than Shiv Ganga Express"
  value: "55 minutes, 35 minutes"
  value_note: "원문 by 55 minutes / by 35 minutes"
  quote: "Compared with the existing Shiv Ganga Express, the Vande Bharat Sleeper Express will reduce journey time from Varanasi to New Delhi by 55 minutes and from New Delhi to Varanasi by 35 minutes"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Howrah-Guwahati January 2026"
  value: "January 2026"
  quote: "Following the introduction of Vande Bharat Sleeper services on the Howrah-Guwahati corridor and the corresponding return journey in January 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Features"
  value: "Type A and C USB"
  quote: "Integrated BRL with 3-PIN charging socket & switch Type A and C USB charging ports PAPIS based driver / guard / passenger communication system Shower with hot water in First AC Wi-Fi Router with Access Point Network"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Safety features"
  value: "TCAS"
  quote: "Fire barrier doors at end wall Train Collision Avoidance System (TCAS) Disaster management light Smoke/Fire Detection System (FDS) CCTVs for safety and passenger surveillance Passenger Alarm Emergency push button"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Toilets, special berths, luggage"
  value: "vacuum"
  quote: "Ergonomically designed odour free toilets with vacuum evacuation Special berths and toilets for differently-abled Modern passenger amenities with spacious luggage room"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
