- claim: Worker pay; phone usage, history of accepting offers
  value: phone usage
  quote: "For rideshare and delivery services, the FTC said it will examine how those companies determine worker pay. Offers that drivers received may depend on opaque formulas, possibly involving data such as phone usage or a driver's history of accepting offers previously."
  source: https://finance.yahoo.com/economy/policy/articles/ftc-seeking-information-walmart-jetblue-181126977.html
- claim: January 2025 FTC finding location/browser history
  value: January 2025
  quote: "Details like a person’s precise location or browser history can be frequently used to target individual consumers with different prices for the same goods and services,” the FTC found in January 2025."
  source: https://www.theguardian.com/us-news/2026/oct/29/delta-uber-ftc-pricing
