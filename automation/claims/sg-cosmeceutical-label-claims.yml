- claim: "Drug, cosmetic or both"
  value: "drug, a cosmetic or both"
  quote: "A product can be a drug, a cosmetic or both"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/cosmeceutical
- claim: "Drug definition"
  value: "structure or function"
  quote: "The FD&C Act defines drugs as those products that cure, treat, mitigate or prevent disease or that affect the structure or function of the human body, if a product makes such claims it will be regulated as a drug."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/cosmeceutical
- claim: "Cosmetic definition, not approved"
  value: "beautify"
  quote: "Cosmetics are intended to beautify, promote attractiveness, alter appearance or cleanse; they are not approved by FDA for sale nor are they intended to effect structure or function of the body."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/cosmeceutical
- claim: "Cosmeceutical used to suggest drug-like benefits"
  value: "cosmeceutical"
  quote: "ucts that have medicinal or drug-like benefits"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/cosmeceutical
