- claim: "Recall announced Oct. 21, 2026; subpotent/superpotent"
  value: "Oct. 21, 2026"
  value_note: "October 21, 2026"
  quote: "Wedgewood Pharmacy LLC (\"Wedgewood\") is recalling certain compounded veterinary medications within expiry at the provider/customer level due to inconsistencies in the reliability of certain analytical testing data generated by their laboratory, potentially resulting in subpotent and/or superpotent products."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/wedgewood-pharmacy-issues-recall-certain-compounded-veterinary-medications-within-expiry-due
- claim: "Shipped Feb. 18 – Oct. 6, 2026"
  value: "Feb. 18, 2026, Oct. 6, 2026, Feb. 18 – Oct. 6, 2026"
  value_note: "February 18, 2026 and October 6, 2026"
  quote: "The affected products were shipped between February 18, 2026 and October 6, 2026 to veterinary practices, pharmacies, and other customers nationwide in the U.S."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/wedgewood-pharmacy-issues-recall-certain-compounded-veterinary-medications-within-expiry-due
- claim: "98 complaints, 7 serious"
  value: "98 complaints, 7"
  quote: "To date, Wedgewood has received 98 complaints, of which 7 are serious."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/wedgewood-pharmacy-issues-recall-certain-compounded-veterinary-medications-within-expiry-due
- claim: "Recall line and hours"
  value: "866-562-5931, 8 a.m. to 9 p.m., 9 a.m. to 5 p.m."
  value_note: "8am – 9pm ET, Saturday 9am to 5pm ET"
  quote: "contact Wedgewood’s recall services by phone at 866-562-5931 Monday through Friday 8am – 9pm ET and Saturday 9am to 5pm ET"
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/wedgewood-pharmacy-issues-recall-certain-compounded-veterinary-medications-within-expiry-due
- claim: "FDA reporting 1-888-FDA-VETS"
