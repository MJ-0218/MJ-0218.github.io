- claim: "Within 2 days fridge 40F"
  value: "2 days, 40°F"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If seafood will be used within 2 days after purchase, store it in a clean refrigerator at a temperature of 40°F or below."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Otherwise freeze wrapped"
  value: "freezer"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Otherwise, wrap it tightly in plastic, foil, or moisture-proof paper and store it in the freezer."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Thaw in fridge overnight or cold water"
  value: "overnight, cold water"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Thaw frozen seafood gradually by placing it in the refrigerator overnight. If you have to thaw seafood quickly, either seal it in a plastic bag and immerse it in cold water"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Wash hands 20 sec"
  value: "20 seconds"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wash your hands for at least 20 seconds with soap and warm water after handling any raw food."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Wash boards with soap hot water"
  value: "cutting boards"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wash cutting boards, dishes, utensils, and counter tops with soap and hot water between the preparation of raw foods"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Cook 145F"
  value: "145°F"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Most seafood should be cooked to an internal temperature of 145°F."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Doneness signs"
  value: "opaque, shells open"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Shrimp, Scallops, Crab, and Lobster: The flesh becomes firm, pearly, and opaque Clams, Mussels, and Oysters: The shells open during cooking — throw out ones that don’t open"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "2 hours / 1 hour above 90F"
  value: "2 hours, 1 hour, 90°F"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Never leave seafood or other perishable food out of the refrigerator for more than 2 hours or for more than 1 hour when temperatures are above 90°F."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
