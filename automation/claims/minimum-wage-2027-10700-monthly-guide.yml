  quote: "노·사가 최종제시안으로 1만 730원(근로자위원, 2026년 대비 4.0% 인상), 1만 700원(사용자위원, 2026년 대비 3.7% 인상)을 제출했다. 이 안에 대해 재적위원 27명 중 27명이 참여해 투표한 결과, 사용자위원(안)으로 의결됐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148968169"
