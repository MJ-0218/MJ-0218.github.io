- claim: "2027–28 FAFSA now available; announced Sept. 23, 2026"
  value: "2027–28, 2027-28, Sept. 23, 2026, September 23, 2026"
  quote: "The 2027–28 Free Application for Federal Student Aid (FAFSA ® ) form is now available."
  source: "https://financialaidtoolkit.ed.gov/tk/announcement-detail.jsp?id=fafsa-updates"
  quote2: "September 23, 2026"
  source2: "https://financialaidtoolkit.ed.gov/tk/announcement-detail.jsp?id=fafsa-updates"
  value_note: "announcement dated September 23, 2026 on the toolkit page"
- claim: "Covers school between July 1, 2027 and June 30, 2028"
  value: "July 1, 2027, June 30, 2028"
  quote: "Students can complete the form to apply for financial aid for attending college or career/trade school between July 1, 2027, and June 30, 2028."
  source: "https://financialaidtoolkit.ed.gov/tk/announcement-detail.jsp?id=fafsa-updates"
- claim: "Early testing submitters don't need to resubmit"
  value: "early testing"
  quote: "If your students successfully submitted their FAFSA form for the 2027–28 academic year during the early testing period, they don't need to resubmit it."
  source: "https://financialaidtoolkit.ed.gov/tk/announcement-detail.jsp?id=fafsa-updates"
- claim: "Most processed immediately; some 1–3 days; Submission Summary; sent to schools"
  value: "one to three days, 1–3 days, FAFSA Submission Summary"
  quote: "Most FAFSA forms are processed immediately. Some can take one to three days. Once a student's form is processed, they can review their FAFSA Submission Summary. Their FAFSA information will also be sent to their selected schools."
  source: "https://financialaidtoolkit.ed.gov/tk/announcement-detail.jsp?id=fafsa-updates"
