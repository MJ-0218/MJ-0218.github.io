- claim: 2026 DST period
  value: "Nov. 1, November 1, 2 a.m., March 8, Nov. 1, 2026, November 1, 2026, 2026"
  quote: During 2026 , daylight saving time is in effect from March 8 at 2 a.m. (local time) to November 1 at 2 a.m. (local time).
  value_note: Nov. 1 abbreviation
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Rule — ends first Sunday of November
  value: first Sunday of November, 2 a.m., 1 a.m., extra hour
  quote: ends at 2:00 a.m. on the first Sunday of November (at 2 a.m. the local time becomes 1 a.m. and that hour is repeated, so there is an extra hour in that day)
  value_note: paraphrased
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Rule — begins second Sunday of March
  value: second Sunday of March, 3 a.m.
  quote: begins at 2:00 a.m. on the second Sunday of March (at 2 a.m. the local time time skips ahead to 3 a.m. so there is one less hour in that day)
  value_note: paraphrased
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Next start date
  value: "March 14, 2027, 2027"
  derived: second Sunday of March 2027 (March 1, 2027 is a Monday; Sundays are March 7 and 14)
- claim: Where DST is not observed
  value: Hawaii, American Samoa, Guam, Puerto Rico, the Virgin Islands, Arizona, Navajo
  quote: DST is not observed in Hawaii, American Samoa, Guam, Puerto Rico, the Virgin Islands and the state of Arizona (with the exception of the Navajo Indian Reservation, which does observe DST)
  value_note: list
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Who regulates DST
  value: U.S. Department of Transportation
  quote: Daylight saving time and time zones are regulated by the U. S. Department of Transportation, not by NIST.
  value_note: spacing
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Clock setting tip
  value: disable the automatic DST function
  quote: if you live in an area where DST is not observed (Arizona, for example), you need to disable the automatic DST function on your clock.
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Rules changed in 2007
  value: "2007, more than 20 years"
  quote: The rules for DST changed in 2007 for the first time in more than 20 years.
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: 1918 introduction
  value: "1918"
  quote: DST was formally introduced in the United States in 1918.
  source: https://www.nist.gov/pml/time-and-frequency-division/popular-links/daylight-saving-time-dst
- claim: Local news confirms Sunday Nov 1 fall back
  value: Sunday, November 1, extra hour of sleep
  quote: on Sunday, November 1, at 2 a.m., clocks will fall back, allowing residents an extra hour of sleep.
  value_note: wording from the article
  source: https://www.hometownstation.com/santa-clarita-news/community-news/get-ready-for-clocks-to-fall-back-beginning-november-614798
- claim: Days until change
  value: 13 days, 2 weeks
  derived: Oct 19 to Nov 1, 2026 = 13 days
