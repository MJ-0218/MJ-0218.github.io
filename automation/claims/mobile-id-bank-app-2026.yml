- claim: 10월 14일부터 4개 은행 앱, 기존 6개 사업자
  value: 10월 14일, 14일, 6개, 4곳
  value_note: "오는 14일부터 (기사 2026.10.13) = 10월 14일; 4개 은행 = 4곳"
  quote: "오는 14일부터 기존 삼성전자, 네이버 등 6개 사업자의 앱에 이어 기업, 신한, 우리, 하나은행 앱에서도 모바일신분증 발급받아 이용할 수 있게 된다"
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973386
- claim: 13일 발표, 4개 사업자 개방
  value: 13일, 4개, 4곳
  value_note: "4개 사업자 = 4곳"
  quote: "기업은행, 신한은행, 우리은행, 하나은행 등 4개 사업자에 모바일신분증 서비스를 새로 개방했다고 13일 밝혔다"
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973386
- claim: IC 신분증 태그 / 지정 발급 기관 / 삼성 안심인증
  value: IC 신분증
  quote: "IC 신분증을 소지한 사람은 스마트폰에 신분증을 태그하는 것만으로도 손쉽게 모바일신분증을 발급받을 수 있다"
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973386
  quote2: "기존에 모바일신분증을 발급받은 이력이 있는 삼성 단말기 이용자는 별도의 실물 IC 신분증 태그나 지정 발급 기관 방문 없이 간단한 안심인증 절차만으로 기존 신분증을 즉시 불러올 수 있다"
  source2: https://www.korea.kr/news/policyNewsView.do?newsId=148973386
