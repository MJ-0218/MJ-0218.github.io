- claim: "ทาซ้ำอย่างน้อยทุก 2 ชั่วโมง"
  value: "2 ชั่วโมง"
  value_note: "every two hours = ทุก 2 ชั่วโมง"
  quote: "Reapply sunscreen at least every two hours, and more often if you're sweating or swimming."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "ทาก่อนออกแดด 15 นาที"
  value: "15 นาที"
  value_note: "15 minutes = 15 นาที"
  quote: "Apply 15 minutes before sun exposure."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "กันน้ำ 40 หรือ 80 นาที"
  value: "40 นาที, 80 นาที"
  value_note: "40 minutes or 80 minutes = 40 นาที หรือ 80 นาที"
  quote: "Products labeled as water resistant are also required to state on their labels whether the sunscreen remains effective for 40 minutes or 80 minutes when swimming or sweating."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "SPF 15 ขึ้นไป; SPF ไม่เกี่ยวกับเวลา (15 เท่า)"
  value: "SPF 15, 15 เท่า"
  value_note: "15 times longer = นานขึ้น 15 เท่า"
  quote: "Use broad spectrum sunscreens with sun protection factor (SPF) values of 15 or higher regularly and as directed."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
