  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "5급·외교관 원서 3월 4일~8일, 7급 원서 7월 12일~16일"
  value: "3월 4일, 8일, 7월 12일, 16일"
  value_note: "원문 그대로"
  quote: "5급 공채 및 외교관후보자 시험을 준비하는 수험생은 '심화' 접수와 별도로 3월 4일부터 8일까지, 7급 공채 수험생은 '기본' 접수와 별도로 7월 12일부터 16일까지 각각 해당 채용시험 원서를 내야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "영어·한국사 대체 성적 인정: 5급 3월 8일, 7급 7월 16일까지 발표분"
  value: "3월 8일, 7월 16일"
  value_note: "원문 그대로"
  quote: "5급 공채 및 외교관 후보자 수험생은 3월 8일까지, 7급 공채 수험생은 7월 16일까지 발표된 대체 시험 성적으로 해당 과목을 대체할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "9급 필기 3월 27일"
