- claim: "11월 5일 인사처 2027년도 PSAT 시험계획·공채 일정 공개"
  value: "5일, 11월 5일, 2027년"
  value_note: "원문 그대로"
  quote: "인사혁신처는 '2027년도 공직적격성평가 시험계획'과 '국가공무원 공개경쟁채용시험 일정'을 국가공무원채용시스템 등을 통해 5일 공개했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "심화 2월 27일, 기본 7월 10일, 수수료 없음"
  value: "2월 27일, 7월 10일"
  value_note: "원문 그대로"
  quote: "공직적격성평가 '심화'는 2월 27일, '기본'은 7월 10일 각각 시행되며 원서는 별도 응시 수수료 없이 국가채용시스템을 통해 접수할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "5급·외교관 1차는 심화, 7급 1차는 기본 성적으로 대체"
  value: "5급, 7급"
  value_note: "원문 그대로"
  quote: "5급 및 외교관후보자 1차 시험은 적격성평가 '심화' 성적으로, 7급 1차 시험은 '기본' 성적으로 대체된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "차등 배점 상·하 각 15%"
