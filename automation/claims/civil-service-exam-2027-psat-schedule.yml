  quote: "상·하 난이도 각 15% 범위에서 문항별 점수에 차이를 두는 차등 배점을 도입한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975150"
- claim: "심화 3.5·2.5·1.5점, 기본 5·4·3점"
  value: "3.5, 2.5, 1.5점, 5, 4, 3점"
