- claim: "Permanent makeup is a tattoo; needle inserts ink"
  value: "permanent makeup"
  quote: "Permanent makeup is a type of tattoo. A needle inserts colored ink into your skin to look like eyeliner, lip liner, eyebrows, or other makeup."
  source: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
- claim: "No color additives approved for injection; some pigments industrial grade"
  value: "none are approved for injection"
  quote: "Although a number of color additives are approved for use in cosmetics, none are approved for injection into the skin."
  source: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
  quote2: "Some are industrial grade colors that are suitable for printers' ink or automobile paint."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
- claim: "Health risks list"
  value: "MRI complications"
  quote: "Infections Allergic reactions Granulomas Keloid formation Increased chance of sunburn, redness, or scarring Swelling and burning MRI complications Removal problems"
  source: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
  quote2: "Tattoos can cause adverse effects, and some can be irreversible."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
- claim: "Parlor practice regulated locally; inks injected into dermis, pathogens"
  value: "local jurisdictions"
  quote: "The actual practice of tattooing, including tattoo parlor practices and safety, is generally regulated by local jurisdictions."
  source: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
  quote2: "they could potentially introduce harmful pathogens directly into the body"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup
- claim: "More than 50 pigments"
  value: "50"
  quote: "More than 50 different pigments and shades are in use, and the list continues to grow."
  source: https://www.fda.gov/cosmetics/cosmetic-products/tattoos-temporary-tattoos-permanent-makeup

