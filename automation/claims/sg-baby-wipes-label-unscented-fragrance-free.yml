- claim: "Unscented may contain masking fragrance"
  value: "unscented, masking"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Typically, the word “unscented” on a cosmetic label means that the product doesn’t have a noticeable scent. But it may actually contain “masking” fragrance ingredients"
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Fragrance free no added fragrance"
  value: "fragrance free"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "cosmetics labeled as “fragrance free” should not contain any added fragrance ingredients."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Materials"
  value: "polyester, cotton, wood pulp, rayon"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Cleansing wipes are made of materials such as polyester, polypropylene, cotton, wood pulp, or rayon fibers formed into sheets."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Preservatives"
  value: "preservatives"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "They may contain other ingredients, such as preservatives to prevent the growth of bacteria and molds."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Cleansing wipes regulated as cosmetics"
  value: "baby care, makeup removal"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wipes intended for cleansing or moisturizing the skin, such as those for baby care, hand washing, makeup removal, washing the body when bathing is not practical, or feminine or other personal cleansing, are regulated as cosmetics."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Therapeutic wipes are drugs"
  value: "killing germs, acne, diaper rash"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wipes intended for a therapeutic purpose, such as killing germs on the skin, or treating acne, diaper rash, or other skin conditions, are drugs under the law."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Surface/insect repellent wipes EPA"
  value: "surfaces, insect repellents"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wipes intended to control germs on inanimate surfaces (disinfect or sanitize) and wipes containing insect repellents are regulated by the Environmental Protection Agency ."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Check ingredient list if sensitive"
  value: "ingredients"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If you have sensitive skin or certain allergies, check the list of ingredients on the label before using wipes."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Parents reacted to baby wipes"
  value: "baby wipes"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "some parents have suffered reactions to baby wipes that didn’t bother their babies."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
