  value: unknown, over 80%
  quote: "“The root cause is unknown, however in certain high-voltage batteries within the affected vehicle population, certain charging profiles combined with a state of charge over 80% may trigger thermal propagation within the high-voltage battery,”"
  source: https://www.thedrive.com/news/vw-will-remotely-cap-id-4-charging-at-80-amid-battery-fire-recall
  quote2: "The reason for the temporary fix, according to the NHTSA documents, is that Volkswagen still isn’t entirely sure why the batteries are catching fire."
  source2: https://www.caranddriver.com/news/a74194610/volkswagen-remotely-limiting-charging-id4-recall/
