- claim: "Tes kulit setiap kali; jangan cat alis/bulu mata"
  value: "setiap kali"
  quote: "Do a patch test on your skin every time before dyeing your hair. Keep hair dyes away from your eyes, and do not dye your eyebrows or eyelashes. This can hurt your eyes and may even cause blindness."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "Tunggu 14 hari; 3 hari jangan garuk kulit kepala"
  value: "14 hari, 3 hari"
  value_note: "14 days = 14 hari; three days = 3 hari"
  quote: "Wait at least 14 days after bleaching, relaxing, or perming your hair before using dye."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "Do not scratch or brush your scalp three days before using hair dyes."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "PPD dan black henna"
  value: "PPD"
  quote: "temporary tattoos marketed as “black henna” contain PPD and may increase your risk of allergy to hair dyes"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
