- claim: "5.9 million units"
  value: "5.9 million"
  quote: "5.9 million"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Hazard: carafe breaks if damaged incl. metal spoon"
  value: "metal spoon"
  quote: "The carafe can unexpectedly break during use if the glass carafe is damaged or cracked, including by use of a metal spoon to stir the coffee, posing a risk of serious burn injuries."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "70 reports, 48 burns"
  value: "70, 48"
  value_note: "원문 70 reports ... 48 reports of burns"
  quote: "Bodum USA has identified 70 reports of carafes breaking during use, including 48 reports of burns to consumers"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Models, 8-cup and 12-cup"
  value: "8-cup, 12-cup"
  value_note: "원문 8-cup and 12-cup"
  quote: "This recall involves Bodum 8-cup and 12-cup Bistro, Brazil, Caffettiera, Chambord, Crema, Java, Jesper, and Kenya model French Press coffee makers with replaceable glass carafes."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Name on frame/lid, engraved on carafe"
  value: "engraved"
  quote: "The Bodum name appears on the frame and inner lid of most models, and is engraved, along with product warnings, on the glass carafes."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Sold 1974 through Oct 2026, $15-$65"
  value: "1974, October 2026, $15, $65"
  value_note: "원문 from 1974 through October 2026 for about $15 to $65"
  quote: "Target, Walmart, and coffee and home goods stores nationwide and online at Bodum.com, Amazon.com, Target.com, Walmart.com and other online retailers from 1974 through October 2026 for about $15 to $65."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Remedy: stop metal spoons, plastic spoon + label"
  value: "plastic"
  quote: "Consumers should stop using metal spoons or utensils to stir coffee in the glass carafe immediately and contact Bodum to receive a plastic Bodum stirring spoon and warning label."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Label: don't use cracked carafes"
  value: "cracked"
  quote: "The label reminds consumers not to use cracked or damaged carafes"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Contact phone/email/web"
  value: "888-879-8213, Bodum3302@sedgwick.com"
  value_note: "원문 toll-free at 888-879-8213 / email at Bodum3302@sedgwick.com"
  quote: "Bodum USA toll-free at 888-879-8213 from 8 a.m. to 5 p.m. ET Monday through Friday, email at Bodum3302@sedgwick.com, or online at www.bodumfrenchpressrecall.expertinquiry.com"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
- claim: "Recall date Oct 29 2026"
  value: "Oct. 29, 2026"
  value_note: "API RecallDate 2026-10-29"
  quote: "2026-10-29"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=French%20Press"
