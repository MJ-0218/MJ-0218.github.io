- claim: "Sunscreen first, insect repellent second"
  value: "sunscreen first"
  quote: "If you are using sunscreen, apply sunscreen first and insect repellent second."
  source: https://www.cdc.gov/mosquitoes/prevention/index.html
- claim: "Do not use OLE or PMD on children under 3 years old"
  value: "3 years old"
  quote: "Do not use products containing OLE or PMD on children under 3 years old."
  source: https://www.cdc.gov/mosquitoes/prevention/index.html
- claim: "Broad spectrum SPF 15+, reapply at least every 2 hours"
  value: "SPF 15, 2 hours"
  value_note: "every two hours = every 2 hours"
  quote: "Use broad spectrum sunscreens with sun protection factor (SPF) values of 15 or higher regularly and as directed. Reapply sunscreen at least every two hours, and more often if you're sweating or swimming."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Water resistant: 40 or 80 minutes"
  value: "40 or 80 minutes"
  value_note: "40 minutes or 80 minutes"
  quote: "Products labeled as water resistant are also required to state on their labels whether the sunscreen remains effective for 40 minutes or 80 minutes when swimming or sweating."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
