- claim: "11월 9일~12월 6일 수급관리, 640억 원, 최대 50%"
  value: "11월 9일, 12월 6일, 640억 원, 50%"
  value_note: "원문 숫자 그대로"
  quote: "정부가 11월 9일부터 12월 6일까지 김장재료 공급을 관리하고, 농수산물 할인에 역대 최대 규모인 640억 원을 투입해 최대 50% 할인한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "3일 발표"
  value: "3일, 11월 3일, 2026"
  value_note: "기사 2026.11.03 '3일 밝혔다'"
  quote: "'2026 김장재료 수급안정대책'을 추진한다고 3일 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "직접 담그는 비율 58.6%, 5.6%p↓, 4인 23.4포기"
  value: "58.6%, 5.6%포인트, 23.4포기, 23.5포기, 4인"
  value_note: "원문 숫자 그대로"
  quote: "한국농촌경제연구원에 따르면 올해 가정에서 김치를 직접 담그는 비율은 58.6%로 전년보다 5.6%포인트 낮아졌다. 4인 가구 기준 김장 규모는 23.4포기로 전년의 23.5포기와 비슷하다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "가을배추 121만4000톤 +18.5%, 가을무 37만2000톤 +11.1%"
  value: "121만 4000톤, 37만 2000톤, 18.5%, 11.1%"
  value_note: "원문 숫자 그대로"
  quote: "올해 김장용 가을배추 생산량은 121만 4000톤, 가을무는 37만 2000톤으로 전망된다. 전년보다 각각 18.5%, 11.1% 늘었다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "마트 김장재료·수육용 돼지고기 최대 40%, 10월 29일~12월 2일, 440억"
  value: "440억 원, 40%, 10월 29일, 12월 2일"
  value_note: "원문 숫자 그대로"
  quote: "농산물에는 440억 원을 투입해 대형·중소형마트 등에서 김장재료 전 품목과 수육용 돼지고기를 최대 40% 할인한다. 할인 행사는 10월 29일부터 12월 2일까지다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "농할상품권 200억 원 20% 선할인"
  value: "200억 원, 20%"
  value_note: "원문 숫자 그대로"
  quote: "전통시장 등에서 사용할 수 있는 농할상품권은 200억 원 규모로 발행해 20% 선할인 판매한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "농할상품권 구매 기간·한도"
  value: "11월 2일, 8일, 11월 9일, 15일, 10만 원"
  value_note: "원문 '고령층이 11월 2일부터 8일까지, 전체 소비자가 11월 9일부터 15일까지', '최대 10만 원'"
  quote: "구매 기간은 고령층이 11월 2일부터 8일까지, 전체 소비자가 11월 9일부터 15일까지며 할인 한도는 최대 10만 원이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "수산대전 김장 특별전 10월 28일~11월 29일, 200억, 최대 50%"
  value: "10월 28일, 11월 29일, 200억 원, 50%"
  value_note: "원문 숫자 그대로"
  quote: "수산물은 '대한민국 수산대전_김장 특별전'을 10월 28일부터 11월 29일까지 열고 200억 원을 투입한다. 천일염·새우젓·멸치액젓·굴과 대중성 어종 등을 최대 50% 할인한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "원산지 단속 10월 27일~12월 5일"
  value: "10월 27일, 12월 5일"
  value_note: "원문 그대로"
  quote: "수입김치와 양념채소 등의 원산지 거짓표시를 10월 27일부터 12월 5일까지 단속한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974868"
- claim: "잔류농약 800건"
  value: "800건, 10월 12일, 11월 30일"
