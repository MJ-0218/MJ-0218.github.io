- claim: "Flag off tomorrow = 31 Oct by Yogi and Vaishnaw"
  value: "31 अक्टूबर 2026"
  value_note: "원문 tomorrow (30 OCT 2026 보도) → 31 October 2026"
  quote: "Uttar Pradesh Chief Minister Shri Yogi Adityanath and Union Minister for Railways Shri Ashwini Vaishnaw will flag off new Vande Bharat Sleeper Express services between Varanasi and New Delhi from Varanasi tomorrow."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Timings"
  value: "20:50, 06:10, 21:40, 07:10, रात 8:50 → सुबह 6:10, रात 9:40, सुबह 7:10"
  value_note: "원문 20:50 / 06:10 / 21:40 / 07:10 (카드는 12시간제 힌디 표기)"
  quote: "The new service will depart Varanasi at 20:50 and arrive in New Delhi at 06:10 the following morning. In the return direction, it will depart New Delhi at 21:40 and reach Varanasi at 07:10 the following day."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Stops"
  value: "Prayagraj"
  value_note: "본문 प्रयागराज, कानपुर सेंट्रल, अलीगढ़, गाज़ियाबाद"
  quote: "The service will connect Varanasi, Prayagraj, Kanpur Central, Aligarh and Ghaziabad, before reaching New Delhi."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Six days, Fri/Sat off"
  value: "six days"
  value_note: "본문 हफ्ते में छह दिन / शुक्रवार / शनिवार"
  quote: "The service will operate six days a week, except on Fridays for the Varanasi-originating service and on Saturdays for the New Delhi-originating service."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "55/35 minutes"
  value: "55, 35"
  value_note: "원문 by 55 minutes / by 35 minutes"
  quote: "Compared with the existing Shiv Ganga Express, the Vande Bharat Sleeper Express will reduce journey time from Varanasi to New Delhi by 55 minutes and from New Delhi to Varanasi by 35 minutes"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Features"
  value: "Type A and C USB"
  quote: "Type A and C USB charging ports PAPIS based driver / guard / passenger communication system Shower with hot water in First AC Wi-Fi Router with Access Point Network"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "Toilets, special berths, luggage, CCTV"
  value: "vacuum"
  quote: "Ergonomically designed odour free toilets with vacuum evacuation Special berths and toilets for differently-abled Modern passenger amenities with spacious luggage room"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
- claim: "CCTV, alarm, fire detection"
  value: "CCTV"
  quote: "Smoke/Fire Detection System (FDS) CCTVs for safety and passenger surveillance Passenger Alarm Emergency push button"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330492
