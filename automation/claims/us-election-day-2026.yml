- claim: Election Day date
  value: Tuesday, Nov. 3, 2026, Nov. 3, November 3, 2026
  quote: "General Election - November 3, 2026"
  source: https://www.sos.ca.gov/elections/upcoming-elections
  quote2: "ahead of the Tuesday, November 3rd Election Day"
  source2: "https://news.delaware.gov/2026/10/19/voting-alert-10-day-early-voting-period-for-the-2026-general-election-starts-thurs-october-22nd/"
  value_note: Month abbreviated (AP style); weekday from Delaware and Florida notices
- claim: Election Day is a Tuesday (Florida)
  value: Tuesday, November 3, 2026
  quote: "Florida’s upcoming General Election on Tuesday, November 3, 2026"
  source: "https://dos.fl.gov/communications/press-releases/2026/secretary-of-state-cord-byrd-reminds-floridians-of-early-voting-options-1/"
- claim: State voter ID rules
  value: state, photo ID, driver's license, state ID, passport
  value_note: paraphrased from the quote
  quote: "Each state sets its own voter ID rules. And most require voters to bring identification to vote in person."
  source: https://www.usa.gov/voter-id
- claim: Photo ID examples
  value: Driver's license, State ID, Passport
  quote: "Your state may require you to show a photo ID like a: Driver's license State ID Passport"
  source: https://www.usa.gov/voter-id
- claim: Voter registration card not required
  value: not required
  quote: "If you are a registered voter and have a voter registration card, you are not required to bring it with you when you vote."
  source: https://www.usa.gov/voter-id
- claim: Provisional ballot
  value: provisional ballot, a few days
  value_note: paraphrased from the quote
  quote: "You may have to return to show an acceptable form of ID within a few days, or the ballot will not count."
  source: https://www.usa.gov/voter-id
- claim: Name/address mismatch
  value: name or address
  quote: "This can happen if the name or address on your ID does not match the name or address on your voter registration."
  source: https://www.usa.gov/voter-id
- claim: First-time voters ID rule
  value: first-time voters, utility bill, bank statement, government check, paycheck
  value_note: paraphrased from the quote
  quote: "According to federal law, first-time voters must show identification when they vote on Election Day if: They did not register in person, and They did not show ID when they registered"
  source: https://www.usa.gov/voter-id
- claim: First-time voter ID types
  value: Current utility bill, Bank statement, Government check, Paycheck
  quote: "Current and valid photo identification Current utility bill Bank statement Government check Paycheck A government-issued document that shows your name and address"
  source: https://www.usa.gov/voter-id
- claim: No online voting
  value: online
  quote: "No. In federal elections in the U.S., you cannot vote online."
  source: https://www.usa.gov/election-day
- claim: Early voting in most states, usually no excuse
  value: most states, no excuse
  value_note: paraphrased from the quote
  quote: "Most states let you vote in person during a designated early voting period."
  source: https://www.usa.gov/early-voting
  quote2: "In most states, you do not need an excuse to vote early."
  source2: https://www.usa.gov/early-voting
- claim: Delaware early voting
  value: Oct. 22, 10-day, Delaware
  quote: "Early Voting for the 2026 General Election starts this Thursday, October 22, 2026."
  source: "https://news.delaware.gov/2026/10/19/voting-alert-10-day-early-voting-period-for-the-2026-general-election-starts-thurs-october-22nd/"
  value_note: Shown as an example state
- claim: Delaware assigned polling place on Election Day
  value: assigned polling place
  quote: "voters may vote at any early voting site for their county of residence. On Election Day, November 3, 2026, voters must vote at their assigned polling place."
  value_note: paraphrased
  source: "https://news.delaware.gov/2026/10/19/voting-alert-10-day-early-voting-period-for-the-2026-general-election-starts-thurs-october-22nd/"
- claim: Florida three options
  value: vote-by-mail, early voting, Election Day
  value_note: paraphrased from the quote
  quote: "Registered Florida voters have three options to exercise their right to vote: vote-by-mail, early voting, and voting at the polls on Election Day"
  source: "https://dos.fl.gov/communications/press-releases/2026/secretary-of-state-cord-byrd-reminds-floridians-of-early-voting-options-1/"
