- claim: "Seminggu sekali kosongkan, sikat, balik, tutup atau buang wadah berisi air"
  value: "seminggu sekali"
  value_note: "Once a week = seminggu sekali"
  quote: "Once a week, empty and scrub, turn over, cover, or throw out items that hold water, such as tires, buckets, toys, pools, birdbaths, flowerpot saucers, or trash containers."
  source: https://www.cdc.gov/mosquitoes/prevention/index.html
- claim: "Sunscreen dulu, losion antinyamuk kemudian; OLE/PMD tidak untuk anak di bawah 3 tahun"
  value: "3 tahun"
  value_note: "3 years old = 3 tahun"
  quote: "Do not use products containing OLE or PMD on children under 3 years old."
  source: https://www.cdc.gov/mosquitoes/prevention/index.html
  quote2: "If you are using sunscreen, apply sunscreen first and insect repellent second."
  source2: https://www.cdc.gov/mosquitoes/prevention/index.html
- claim: "Bahan aktif / 有效成分: DEET, picaridin, IR3535, OLE, PMD"
  value: "IR3535, 3535"
  quote: "DEET Picaridin (known as KBR 3023 and icaridin outside the United States) IR3535 Oil of lemon eucalyptus (OLE)"
  source: https://www.cdc.gov/mosquitoes/prevention/index.html
