- claim: "Start at age 73; account types"
  value: "age 73, SIMPLE IRA, SEP IRA, 73"
  value_note: "원문 IRA, SIMPLE IRA, SEP IRA ... age 73"
  quote: "You generally have to start taking withdrawals from your IRA, SIMPLE IRA, SEP IRA, or retirement plan account when you reach age 73."
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "Roth not required while alive"
  value: "Roth IRAs, 401(k), 403(b)"
  value_note: "원문 Roth IRAs / Designated Roth accounts in a 401(k) or 403(b)"
  quote: "You’re not required to take withdrawals from Roth IRAs , or from Designated Roth accounts in a 401(k) or 403(b) plan while the account owner is alive. However, beneficiaries of Roth IRAs or Designated Roth accounts are subject to the required minimum distribution rules."
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "Each year; withdraw more; taxable"
  value: "each year, more than the minimum"
  value_note: "원문 문장 요약"
  quote: "Your RMD is the minimum amount you must withdraw from your account each year. You can withdraw more than the minimum required amount. Your withdrawals will be included in your taxable income"
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "Subsequent RMDs by December 31"
  value: "December 31, Dec. 31"
  value_note: "원문 December 31"
  quote: "For each year after your required beginning date, you must withdraw your RMD by December 31."
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "First RMD April 1 for IRAs; plans later of 73 or retire"
  value: "April 1"
  quote: "April 1 of the year following the calendar year in which you reach age 73. 401(k), profit-sharing, 403(b), or other defined contribution plan Generally, April 1 following the later of the calendar year in which you: reach age 73, or retire"
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "5% owner; profit-sharing"
  value: "5%"
  quote: "can delay taking their RMDs until the year they retire, unless they're a 5% owner of the business sponsoring the plan."
  source: https://www.irs.gov/retirement-plans/retirement-plan-and-ira-required-minimum-distributions-faqs
- claim: "Plan may require start even if employed"
  value: "age 73"
  quote: "A retirement plan document may require you to begin receiving distributions after you reach age 73, even if you’re still employed."
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "Turn 73 in 2024 example: April 1 2025 and Dec 31 2025 (two in one year)"
  value: "April 1, 2025, December 31, 2025"
  value_note: "원문 by April 1, 2025 / by December 31, 2025"
  quote: "If you reach age 73 in 2024: Your first RMD is due by April 1, 2025, based on your account balance on December 31, 2023, and Your second RMD is due by December 31, 2025"
  source: https://www.irs.gov/retirement-plans/retirement-plan-and-ira-required-minimum-distributions-faqs
- claim: "Applied to 2026: Dec 31 2026, April 1 2027, Dec 31 2027, two"
  value: "Dec. 31, 2026, April 1, 2027, Dec. 31, 2027, 2026, 2027, two"
  derived: "IRS 규칙(첫 RMD는 73세 된 해의 다음 해 4월 1일, 이후 매년 12월 31일)과 IRS 예시(2024년 73세 → 2025.4.1, 2025.12.31)를 2026년에 적용"
- claim: "Calculation prior Dec 31 balance / life expectancy, Pub 590-B"
  value: "590-B, Dec. 31"
  value_note: "원문 prior December 31 balance / Publication 590-B"
  quote: "a RMD is calculated for each account by dividing the prior December 31 balance of that IRA or retirement plan account by a life expectancy factor that the IRS publishes in Tables in Publication 590-B"
  source: https://www.irs.gov/retirement-plans/retirement-plan-and-ira-required-minimum-distributions-faqs
- claim: "Separate calc, withdraw total from one or more IRAs"
  value: "one or more"
  quote: "An IRA owner must calculate the RMD separately for each IRA they own but can withdraw the total amount from one or more of the IRAs."
  source: https://www.irs.gov/retirement-plans/retirement-plan-and-ira-required-minimum-distributions-faqs
- claim: "IRA RMD doesn't affect plan RMD"
  value: "IRA, plan"
  value_note: "원문 예시 문장"
  quote: "RMD from their IRA doesn’t affect the RMD due from the retirement plan."
  source: https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-required-minimum-distributions-rmds
- claim: "25% excise, 10% within 2 years, Form 5329"
  value: "25%, 10%, two years, 5329"
  value_note: "원문 25%, 10% ... within two years ... Form 5329"
  quote: "the amount not withdrawn may be subject to an excise tax of 25%, 10% if the RMD is timely corrected within two years. The account owner should file Form 5329"
  source: https://www.irs.gov/retirement-plans/retirement-plan-and-ira-required-minimum-distributions-faqs
