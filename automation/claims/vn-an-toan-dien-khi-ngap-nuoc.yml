  source2: https://voh.com.vn/kinh-te/nganh-dien-tphcm-khuyen-cao-su-dung-dien-an-toan-trong-mua-mua-bao-487926.html
  quote2: "Khi ngập nước, hãy cắt điện toàn bộ nhà để đề phòng nước ngập các ổ điện, rò điện gây nguy hiểm tính mạng"
- claim: "Chỉ thao tác khi tay khô, chỗ đứng khô ráo (Phó TGĐ EVNHCMC)"
