- claim: "Khi ngập nước, cắt điện toàn bộ nhà / ngắt CB tổng trước khi nước tràn vào"
  value: "ngắt CB tổng"
  quote: "Trường hợp không thể tách riêng an toàn thì ngắt CB tổng trước khi nước tràn vào"
