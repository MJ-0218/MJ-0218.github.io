- claim: "10월 26일 서울본부세관 개통식"
  value: "10월 26일"
  value_note: "26일 = 10월 26일 (기사 2026.10.26)"
  quote: "관세청은 26일 서울본부세관에서 안전하고 신속한 해외직구 통관 환경을 조성하기 위해 '전자상거래 전용 통관플랫폼 개통식'을 열었다고 전했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974313"
- claim: "8월 28일 시범운영"
  value: "8월 28일"
  quote: "지난 8월 28일부터 시범운영을 거쳐 이번에 정식 개통됐다"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974313"
- claim: "일회용 인증번호, 전용 포털"
  value: "ecos.customs.go.kr"
  quote: "개인통관고유부호 도용을 원천 차단하기 위해 '일회용 인증번호 제도'를 도입한다. 전자상거래 전용 포털(https://ecos.customs.go.kr/)도 열려 부호 관리와 관세 납부 등 해외직구 관련 서비스를 한 곳에서 이용할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974313"
- claim: "선택과 집중, 고위험 엑스레이"
  value: "엑스레이"
  quote: "거래정보가 충분하거나 신뢰할 수 있는 업체의 물품은 신속히 통관된다. 통관플랫폼을 거치지 않은 고위험 물품은 엑스레이(X-ray) 판독과 검사를 강화하는"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974313"
- claim: "전자상거래업자 등록, 전용 신고서식"
  value: "등록 제도"
  quote: "전자상거래업자 등록 제도를 도입하고, 쇼핑몰이 제출한 거래정보로 해외직구 물품의 위험관리를 강화한다. 전자상거래 물품의 특성을 반영한 '전자상거래 전용 신고서식'도 새로 만든다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974313"
