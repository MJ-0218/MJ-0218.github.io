  quote: "앞으로는 추후 제출*이 가능해져 중간에 온라인 신청을 포기하지 않고 신청을 완료할 수 있게 되었다."
  source: "https://www.dg1news.com/news/articleView.html?idxno=25041"
  quote2: "이제는 ‘추후 제출’을 선택하면 우선 신청을 마칠 수 있다. 서류는 준비되는 대로 온라인이나 방문으로 내면 된다."
