- claim: "배우자 모바일(문자) 동의"
  value: "문자"
  quote: "모바일 동의 절차를 신설하여 배우자에게 문자 메시지로 동의 절차를 진행할 수 있는 누리집 주소가 전송되고 언제든 바로 배우자가 동의를 할 수 있게 되었다."
