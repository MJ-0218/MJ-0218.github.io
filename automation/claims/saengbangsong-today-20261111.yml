- claim: "11월 11일 생방송 투데이 이유 있는 맛플리 — 마포구 MANDOO BAR"
  value: "11일, 11월 11일, MANDOO BAR, 마포구, 홍대"
  value_note: "위키트리(상호·마포구) + bnt(마포구 홍대 식당)"
  quote: "'이유 있는 맛플리 - MZ 감각으로 재해석한 할머니표 만두 편'에서는 서울 마포구에 위치한 'MANDOO BAR'를 소개한다."
  source: "https://www.wikitree.co.kr/articles/1173850"
  quote2: "서울 마포구 홍대에 위치한 식당에서는 익숙한 만두를 새로운 방식으로 즐기는 이색 만두를 만나본다."
  source2: "https://www.bntnews.co.kr/article/view/bnt202611110260"
  secondary_ok: true
