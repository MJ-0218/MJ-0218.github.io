- claim: "Read labels; ventilation"
  value: "ventilation"
  quote: "Consumers should read labels of nail products carefully and follow any warnings."
  source: https://www.fda.gov/cosmetics/cosmetic-products/nail-care-products
  quote2: "Make sure to have good ventilation when you use nail products."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/nail-care-products
- claim: "Flammable; eyes; infections and allergic reactions"
  value: "curling iron"
  quote: "Some can easily catch fire if exposed to the flame of the pilot light of a stove, a lit cigarette, or other heat source, such as the heating element of a curling iron."
  source: https://www.fda.gov/cosmetics/cosmetic-products/nail-care-products
  quote2: "Infections and allergic reactions can occur with some nail products."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/nail-care-products
