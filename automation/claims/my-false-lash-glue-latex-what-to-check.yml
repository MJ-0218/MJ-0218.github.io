- claim: "Products commonly containing latex"
  value: "eyelash adhesives, body paints"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Avoiding all products that commonly contain natural rubber latex ingredients (body paints, theatrical cosmetics, hair bonding adhesives, and eyelash adhesives)"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/latex-cosmetics
- claim: "No latex warning required; ingredient list required"
  value: "list of ingredients"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Although cosmetic products are not required to include a latex allergy warning, the FDA does require that the labels of cosmetics include a list of ingredients"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/latex-cosmetics
- claim: "Latex ingredient names"
  value: "Natural Rubber Latex, Adhesive Latex"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Natural Rubber Latex Natural Latex Rubber Rubber Latex Natural Latex Latex Rubber Natural Centrifuged Latex Natural Liquid Latex Aqueous Latex Adhesive Latex"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/latex-cosmetics
- claim: "Ingredients can change; check every time"
  value: "any time"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Manufacturers can change their products' ingredients at any time, so it's a good idea to check the ingredient list every time you buy the product"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/latex-cosmetics
- claim: "Reaction: stop and contact healthcare professional"
  value: "healthcare professional"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "stop using the product and contact your healthcare professional"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/latex-cosmetics
