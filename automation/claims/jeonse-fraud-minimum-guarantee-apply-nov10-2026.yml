- claim: "13일부터 최소보장제 시행"
  value: "13일, 11월 13일"
  value_note: "기사일 11월 9일 기준 13일 = 11월 13일"
  quote: "국토교통부가 13일부터 전세사기피해자의 최소한의 피해회복을 지원하는 '최소보장제'를 시행한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "최소지원금과 선지급-후정산으로 구성"
  value: "최소지원금, 선지급-후정산"
  value_note: "원문 그대로"
  quote: "'최소지원금'과 신탁사기 등 무권계약 피해자에 대한 '선지급-후정산' 제도로 구성된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "LH 통해 10일부터 온라인 신청"
  value: "10일, 11월 10일"
  value_note: "기사일 11월 9일 기준 10일 = 11월 10일"
  quote: "한국토지주택공사(LH)를 통해 10일부터 최소지원금 및 선지급금 온라인 신청을 받는다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "회복금이 1/3 미달 시 부족분 현금 지원"
  value: "3분의 1, 1/3"
  value_note: "원문 그대로"
  quote: "그 부족분을 현금으로 지원해 최소한 보증금의 3분의 1을 회복할 수 있도록 하는 제도다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "대상: 보증금 5억원 이하 임차인 포함"
  value: "5억 원, 5억"
  value_note: "원문 그대로"
  quote: "보증금이 5억 원 이하이고 임대인의 보증금반환채무 미이행 의도가 확인되면서, 전입신고·확정일자 등을 갖추어 피해자 등으로 인정된 임차인"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "산정: 보증금 1/3 - 피해회복금"
  value: "3분의 1"
  value_note: "원문 그대로"
  quote: "최소지원금 산정은 피해자의 임차보증금의 3분의 1에 해당하는 금액에서 피해회복금을 차감한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "피해회복금 구성"
  value: "피해회복금"
  value_note: "원문 그대로"
  quote: "피해회복금은 경매 배당액, 임대인 등으로부터 회수·변제받은 금액, 경매차익 지원액 및 임대료 재정지원액으로 구성된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "선지급: 처분 완료 전 1/3 먼저 지급"
  value: "3분의 1"
  value_note: "원문 그대로"
  quote: "피해주택의 처분이 완료되기 전이라도 임차보증금의 3분의 1을 먼저 지급하는 제도다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "무권계약피해자 정의"
  value: "무권계약"
  value_note: "원문 그대로"
  quote: "무권계약피해자란 적법한 임대권한이 없는 자와 임대차계약을 체결한 피해자를 말하며, 신탁사기 등이 이에 해당한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "선지급금 차감"
  value: "차감"
  value_note: "원문 그대로"
  quote: "임차보증금반환채권을 통해 변제받은 금액과 선지급 전까지의 임대료 재정지원액 등이 있는 경우 이를 차감하여 산정한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "신청 시점"
  value: "경·공매"
  value_note: "원문 그대로"
  quote: "최소지원금은 LH가 피해주택을 매입할 경우에는 경매차익 산정 완료 후 신청이 가능하며, 그 외의 경우는 피해주택의 경·공매가 완료된 이후 신청 가능하다. 선지급금은 피해주택의 경·공매 등 종료 이전에 신청할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "온라인 10일, 현장 13일, 콜센터 1600-1004"
  value: "10일, 13일, 1600-1004, apply.lh.or.kr"
  value_note: "원문 그대로"
  quote: "LH 청약플러스(www.apply.lh.or.kr) 를 통한 온라인 신청(10일 이후) 및 LH 지역본부 현장 신청(13일 이후)이 가능하며, 자세한 사항은 LH 청약플러스 공고문 및 LH 콜센터(1600-1004)를 통해 확인할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
- claim: "90일 이내 통지(30일 연장), 30일 내 이의신청"
  value: "90일, 30일"
  value_note: "원문 그대로"
  quote: "LH는 신청일로부터 90일 이내(보완 필요시 30일 연장 가능) 지급 여부를 결정해 신청인에게 통지할 계획이며, 지급결정에 이의가 있는 경우에는 결정 통지를 받은 날부터 30일 이내 LH에 이의신청을 할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975298"
