- claim: "Patch test every time; wait 14 days; no scratching 3 days; don't dye brows/lashes"
  value: "14 days, three days"
  quote: "Do a patch test on your skin every time before dyeing your hair. Keep hair dyes away from your eyes, and do not dye your eyebrows or eyelashes. This can hurt your eyes and may even cause blindness."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "Wait at least 14 days after bleaching, relaxing, or perming your hair before using dye."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "Don't scratch scalp three days before"
  value: "three days"
  quote: "Do not scratch or brush your scalp three days before using hair dyes."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "PPD linked to allergic reactions; black henna contains PPD"
  value: "PPD"
  quote: "One hair dye ingredient, paraphenylenediamine , or “PPD,” has been implicated more prominently in leading to allergic reactions."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "temporary tattoos marketed as “black henna” contain PPD and may increase your risk of allergy to hair dyes"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
