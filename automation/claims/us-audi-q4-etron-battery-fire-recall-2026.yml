- claim: "Scope and defect"
  value: "2024-2025, 2024–2025, Q4 e-tron, Q4 Sportback e-tron"
  quote: "is recalling certain 2024-2025 Q4 E-Tron and Q4 Sportback E-Tron vehicles. The high voltage battery may fail and cause a fire."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=AUDI&model=Q4%20E-TRON&modelYear=2025"
- claim: "Consequence"
  value: "fire"
  quote: "A vehicle fire increases the risk of injury."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=AUDI&model=Q4%20E-TRON&modelYear=2025"
- claim: "Charge to 80% until repaired; remedy under development"
  value: "80%, 80 percent"
  quote: "Owners are advised to only charge their vehicles to a maximum of 80% capacity until the repair has been completed. The remedy is currently under development."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=AUDI&model=Q4%20E-TRON&modelYear=2025"
- claim: "Interim letters, contact, recall number, VIN searchable"
  value: "Dec. 18, 2026, December 18, 2026, 1-800-253-2834, 93SK, Oct. 23, 2026, October 23, 2026, 26V698000"
  quote: "Interim letters notifying owners of the safety risk are expected to be mailed December 18, 2026. Additional letters will be sent once the remedy is available. Owners may contact Audi customer service at 1-800-253-2834. Audi's number for this recall is 93SK. Vehicle Identification Numbers (VINs) involved in this recall became searchable on NHTSA.gov on October 23, 2026."
  value_note: "Dec./Oct. abbreviations; campaign number 26V698000 from NHTSACampaignNumber field"
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=AUDI&model=Q4%20E-TRON&modelYear=2025"
- claim: "Report received Oct. 21, 2026"
  value: "Oct. 21, 2026, 21/10/2026"
  quote: "21/10/2026"
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=AUDI&model=Q4%20E-TRON&modelYear=2025"
