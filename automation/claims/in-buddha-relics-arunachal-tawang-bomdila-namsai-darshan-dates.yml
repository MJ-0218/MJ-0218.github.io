- claim: "Exposition 31 Oct to 21 Nov 2026 in Arunachal"
  value: "31 October to 21 November 2026"
  quote: "is organising an exposition of the Holy Relics of Shakyamuni Buddha in Arunachal Pradesh from 31 October to 21 November 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Three centres Tawang, Bomdila, Namsai"
  value: "Tawang, Bomdila and Namsai"
  quote: "The exposition will cover three important centres of Buddhist faith and heritage—Tawang, Bomdila and Namsai"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Schedule table and card dates"
  value: "31 Oct, 1–7 Nov, 8–13 Nov, 14–20 Nov, 21 Nov, 31 Oct – 21 Nov"
  value_note: "원문 표: 31 October 2026 / 1–7 November 2026 Tawang Monastery / 8–13 November 2026 TGL Monastery (Lower Gompa), Bomdila / 14–20 November 2026 Golden Pagoda, Namsai / 21 November 2026 Namsai–Tezu–New Delhi"
  quote: "1–7 November 2026 Tawang Monastery Public darshan and exposition 8–13 November 2026 TGL Monastery (Lower Gompa), Bomdila Public darshan and exposition 14–20 November 2026 Golden Pagoda, Namsai Public darshan and exposition 21 November 2026 Namsai–Tezu–New Delhi"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Tawang inauguration 10:00-11:30 AM on 31 Oct"
  value: "10:00 AM to 11:30 AM on 31 October"
  value_note: "원문 between 10:00 AM and 11:30 AM on 31 October 2026"
  quote: "scheduled between 10:00 AM and 11:30 AM on 31 October 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Minister Shekhawat at inaugural ceremony"
  value: "Gajendra Singh Shekhawat"
  quote: "Union Minister of Culture and Tourism, Shri Gajendra Singh Shekhawat, is scheduled to participate in the inaugural ceremony"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "1 Nov further inaugural with CM Pema Khandu; Lhabab Düchen"
  value: "1 November"
  value_note: "원문 1 November 2026"
  quote: "A further inaugural function, together with the opening of the associated exposition and exhibition, is scheduled for 1 November 2026 , with the Chief Minister of Arunachal Pradesh, Shri Pema Khandu, as the Chief Guest. The occasion coincides with the observance of Lhabab Düchen"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Lhabab Düchen meaning"
  value: "descent"
  quote: "commemorating the Buddha's descent from the heavenly realm"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Bomdila 8 Nov 3-4 PM"
  value: "8 November, 3:00 PM to 4:00 PM"
  value_note: "원문 On 8 November ... between 3:00 PM and 4:00 PM"
  quote: "where the inaugural ceremony is scheduled between 3:00 PM and 4:00 PM"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Namsai 14 Nov 11-12 noon"
  value: "11:00 AM to 12 noon on 14 November"
  value_note: "원문 On 14 November ... between 11:00 AM and 12:00 noon"
  quote: "where the installation and inaugural ceremony are scheduled between 11:00 AM and 12:00 noon"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Timings subject to change"
  value: "weather"
  quote: "The timings and movement arrangements will remain subject to operational, weather and security considerations."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Piprahwa origin"
  value: "Piprahwa"
  quote: "originate from Piprahwa in present-day Siddharthnagar district, Uttar Pradesh , an archaeological site associated with ancient Kapilavastu and the Shakya tradition"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "ASI 1971-1977"
  value: "1971 and 1977"
  quote: "the Archaeological Survey of India conducted further excavations between 1971 and 1977"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "22 relics, 20 National Museum, two Kolkata"
  value: "22"
  quote: "making a total of 22 sacred relics recovered during these excavations. Of these, 20 are preserved at the National Museum, New Delhi, and two at the Indian Museum, Kolkata."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Exhibition Unearthing the Sacred Piprahwa at three towns"
  value: "Unearthing the Sacred Piprahwa"
  quote: "the International Buddhist Confederation will organise an exhibition titled “Unearthing the Sacred Piprahwa: The Story of the Holy Buddha Relics and Their Discovery” at Tawang, Bomdila and Namsai"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
- claim: "Conference 2 Nov Kalawangpo"
  value: "2 November"
  value_note: "원문 2 November 2026"
  quote: "at the Kalawangpo Convention Hall, Tawang, on 2 November 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330300
