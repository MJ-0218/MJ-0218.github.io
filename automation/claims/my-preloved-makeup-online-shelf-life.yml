- claim: "Flea market / resold online products may be expired, used, diluted, counterfeit"
  value: "re-sold over the Internet"
  quote: "Be wary of products offered for sale in flea markets or re-sold over the Internet. Some may be past their shelf life, already used, diluted, or tampered with in other ways."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "May be counterfeit"
  value: "counterfeit"
  quote: "They may even be counterfeit"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Heat breaks down preservatives"
  value: "heat, hot car"
  quote: "Heat can make preservatives break down and cause bacteria and fungi to grow faster."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Emulsions can separate; texture/smell changes"
  value: "separate, smell"
  quote: "Temperature changes and exposure to sunlight and air can cause changes in color and texture and may cause the products to smell."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Sunscreens are drugs; drugs need expiration dates"
  value: "SPF, expiration dates"
  quote: "are required to have expiration dates printed on the labels"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Eye-area cosmetics shorter shelf life, eye infections"
  value: "shorter shelf lives"
  quote: "Eye-area cosmetics tend to have shorter shelf lives than other products, which may cause eye infections that can be serious."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Mascara discard 2-4 months after purchase"
  value: "two to four months, 2, 4"
  value_note: "2~4 = two to four months"
  quote: "Manufacturers usually recommend discarding mascara two to four months after purchase."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
