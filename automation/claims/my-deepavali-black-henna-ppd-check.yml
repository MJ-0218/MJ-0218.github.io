- claim: "Black henna contains PPD; may increase hair dye allergy risk"
  value: "black henna"
  quote: "temporary tattoos marketed as “black henna” contain PPD and may increase your risk of allergy to hair dyes"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "Approved henna is from Lawsonia plant"
  value: "Lawsonia"
  quote: "Color additives approved for use on hair include henna (from the Lawsonia plant)"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "PPD linked prominently to allergic reactions; cross-sensitization"
  value: "allergic reactions"
  quote: "has been implicated more prominently in leading to allergic reactions"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "This is called “cross-sensitization.”"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "Hair dyes not for skin; misuse by tattoo artists"
  value: "staining your skin"
  quote: "Hair dyes are not meant to be used for staining your skin."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "Temporary tattoo artists who use coal-tar hair dyes to color people’s skin are misusing these products"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
- claim: "Check ingredients such as PPD; tell healthcare provider"
  value: "PPD"
  quote: "Read the ingredient statement to make certain that ingredients that may have caused a problem for you in the past, such as p-phenylenediamine (PPD) are not present."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
  quote2: "If you have a problem, tell your healthcare provider."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/hair-dyes
