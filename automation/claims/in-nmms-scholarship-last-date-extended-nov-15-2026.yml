- claim: "Extended till November 15, 2026; NSP"
  value: "15 November 2026, 2026-27, 15 Nov 2026"
  value_note: "원문 till November 15, 2026 / academic year 2026-27"
  quote: "The Union Ministry of Education extended the last date for submission of applications under the National Means-cum-Merit Scholarship Scheme (NMMSS) for the academic year 2026-27 till November 15, 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "Revised schedule"
  value: "30 November 2026, 15 December 2026, 30 November, 15 December, 30 Nov"
  value_note: "원문 November 30, 2026 / December 15, 2026"
  quote: "Submission of Application November 15, 2026 Institute Nodal Officer (L1) Verification November 30, 2026 District Nodal Officer (L2) Verification December 15, 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "NSP open since June 1; OTR"
  value: "1 June 2026"
  value_note: "원문 since June 1, 2026"
  quote: "The National Scholarship Portal (NSP) has been open for student applications since June 1, 2026. Students are required to complete their One-Time Registration (OTR) on the portal before applying for the Scholarship."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "Applications as of 30.10.2026"
  value: "90,483, 1,99,531, 30 October 2026"
  value_note: "원문 As on 30.10.2026"
  quote: "As on 30.10.2026, 90,483 fresh and 1,99,531 renewal applications had been submitted."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "One lakh, Class IX, continued X-XII"
  value: "one lakh, Class IX, Classes X to XII"
  quote: "The scheme provides one lakh fresh scholarships every year to eligible Class IX students who qualify in the selection examination conducted by the respective State/UT Governments. The scholarship is subsequently continued from Classes X to XII through renewal, subject to the prescribed academic requirements."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "₹12,000 per annum DBT; school types"
  value: "₹12,000"
  quote: "Eligible students studying in state government and government-aided schools and also schools managed by local self governments, receive ₹12,000 per annum, which is transferred directly to their bank accounts through DBT."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "55% Class VII, 5 pt relaxation, ₹3.50 lakh"
  value: "55%, Class VII, 5 percentage points, ₹3.50 lakh"
  value_note: "원문 55 per cent / 5-percentage point / ₹3.50 lakh"
  quote: "students must have secured at least 55 per cent marks or equivalent grade in Class VII, with a 5-percentage point relaxation for SC/ST students. The parental income of the applicant should not exceed ₹3.50 lakh per annum."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
- claim: "Release date 31 Oct 2026"
  value: "31 Oct 2026"
  quote: "31 OCT 2026 5:57PM by PIB Delhi"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330936
