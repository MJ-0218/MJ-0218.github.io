- claim: "Oct. 22, 2026 recall for undeclared sesame"
  value: "Oct. 22, 2026"
  value_note: "October 22, 2026"
  quote: "October 22, 2026 - WinCo Foods of Boise, ID is recalling the following WinCo Foods Brand Hoagie Rolls due to undeclared sesame."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/winco-foods-llc-issues-allergy-alert-undeclared-sesame-hoagie-rolls
- claim: "UPC, weight, Best By range"
  value: "2-70552-00649-2, 16 oz, 454 g, 9/10/2026, 11/3/2026, Sept. 10, Nov. 3, 2026"
  value_note: "Best By Dates of 9/10/2026 – 11/3/2026 = Sept. 10 to Nov. 3, 2026; 16oz(1LB) 454g"
  quote: "WinCo Foods Hoagie Rolls with UPC 2-70552-00649-2, with a net weight of 16oz(1LB) 454g, with Best By Dates of 9/10/2026 – 11/3/2026."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/winco-foods-llc-issues-allergy-alert-undeclared-sesame-hoagie-rolls
- claim: "States (7)"
  value: "7 Western states, CA, ID, MT, NV, OR, UT, WA"
  value_note: "CA, ID, MT, NV, OR, UT, and WA = 7개 주"
  quote: "The recalled product was distributed to WinCo Foods retail stores in CA, ID, MT, NV, OR, UT, and WA."
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/winco-foods-llc-issues-allergy-alert-undeclared-sesame-hoagie-rolls
- claim: "Customer service number"
  value: "1-800-824-1706"
  quote: "contact the WinCo Foods Customer Service Desk at 1-800-824-1706"
  source: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts/winco-foods-llc-issues-allergy-alert-undeclared-sesame-hoagie-rolls
