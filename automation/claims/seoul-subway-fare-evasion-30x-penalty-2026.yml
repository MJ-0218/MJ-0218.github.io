  value_note: "두 기사 같은 수치"
  quote: "유형별로는 우대권 부정 사용 단속액이 전체의 76.7%를 차지해 가장 많았다. 이어 무표미신고 15%, 할인권 부정 사용 8.3% 등 순이었다."
  source: "https://www.yna.co.kr/view/AKR20261104073000004"
  quote2: "올해 단속액의 76.7%가 노인, 장애인 등에게 주는 우대용 교통카드를 남이 쓴 경우였다. 표 없이 타고 신고하지 않은 경우가 15%, 청소년 할인권 등을 부정하게 쓴 경우가 8.3%였다."
  source2: "https://www.hankyung.com/article/202611044653i"
  secondary_ok: true
