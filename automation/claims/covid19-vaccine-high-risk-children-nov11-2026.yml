- claim: "11월 11일~내년 4월 30일, 고위험군 6개월~11세 코로나19 국가예방접종"
  value: "11일, 11월 11일, 4월 30일, 6개월, 11세"
  value_note: "원문 '이달 11일부터 내년 4월 30일까지'"
  quote: "이달 11일부터 내년 4월 30일까지 면역저하자와 감염취약시설 입원·입소자 등 고위험군 소아·영유아(6개월~11세)를 대상으로 코로나19 국가예방접종을 시행한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "소아·영유아용 모더나 XFG 백신, 10월 28일 긴급 도입"
  value: "모더나 XFG, 10월 28일"
  value_note: "원문 그대로"
  quote: "이번 접종에는 식품의약품안전처가 10월 28일 긴급 도입한 소아·영유아용 모더나 XFG 백신을 사용한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "12세 미만 허가 백신이 없어 도입, 12세 미만 고위험군 접종 가능"
  value: "12세"
  value_note: "원문 '12세 미만'"
  quote: "12세 미만 대상의 국내 허가·승인된 백신이 없는 점을 고려해 고위험군 보호를 위해 도입한 백신으로, 12세 미만 고위험군이 접종할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "대상: 면역저하자, 요양병원·요양시설·정신건강증진시설·장애인 및 노숙인 생활시설 입원·입소자"
  value: "면역저하자, 요양병원, 정신건강증진시설"
  value_note: "원문 그대로"
  quote: "접종 대상은 면역저하자와 요양병원·요양시설·정신건강증진시설·장애인 및 노숙인 생활시설 입원·입소자다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "의료기관 찾기: 예방접종도우미 누리집"
  value: "nip.kdca.go.kr, 위탁의료기관 찾기"
  value_note: "원문 그대로"
  quote: "접종 의료기관은 예방접종도우미 누리집(nip.kdca.go.kr)의 '예방접종관리'에서 '위탁의료기관 찾기'를 선택해 확인할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "기초접종 미완료 시 1~2회, 완료 시 매년 1회, 면역저하자 매년 2회"
  value: "1~2회, 1회, 2회"
  value_note: "원문 두 문장"
  quote: "기초접종을 마친 경우에는 매년 1회 접종하며, 면역저하자는 매년 2회 접종한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "기초접종 1~2회"
  value: "1~2회"
  value_note: "원문 그대로"
  quote: "기초접종을 완료하지 않은 고위험군 소아·영유아는 기초접종을 1~2회 완료해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "진단서·소견서·시설 입소 확인서 지참, 의사 판단 시 서류 없이 가능"
  value: "진단서, 소견서, 시설 입소 확인서"
  value_note: "원문 두 문장"
  quote: "접종 기관을 방문할 때는 진단서·소견서·시설 입소 확인서 등 접종 대상임을 확인할 수 있는 서류를 지참해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "접종 후 20~30분 관찰"
  value: "20~30분"
  value_note: "원문 그대로"
  quote: "접종 후에는 기관에 20~30분간 머물며 이상 반응을 관찰하고, 귀가 후 충분히 휴식해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
- claim: "65세 이상 약 391만 명 참여, 접종률 34.2% (11월 4일 오후 6시 기준)"
  value: "391만 명, 34.2%, 11월 4일, 오후 6시, 65세"
  value_note: "원문 숫자 그대로"
  quote: "질병청은 11월 4일 오후 6시 기준 2026~2027절기 65세 이상 코로나19 예방접종에는 약 391만 명이 참여했으며, 65세 이상 인구의 접종률은 34.2%라고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975113"
