- claim: "오늘(11월 12일)부터 최대 6병, 초과 시 3개월 복용량"
  value: "6병, 3개월, 11월 12일, 12일"
  value_note: "기사일 11월 12일 기준 '오늘' = 11월 12일 (정책브리핑 실시간 인기 수집 11/12)"
  quote: "오늘부터 해외에서 입국 시 국내외에서 정상적으로 처방·구매한 자가 치료용 의약품을 최대 6병까지 국내에 휴대 반입할 수 있다. 6병을 초과하는 경우에는 의약품 용법상 3개월 복용량까지 반입이 허용된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "식약처·관세청 협의"
  value: "관세청"
  value_note: "원문 그대로"
  quote: "식품의약품안전처는 관세청과 협의해 자가 치료용 의약품의 개인 휴대 반입을 허용한다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "통관 보류 사례"
  value: "통관"
  value_note: "원문 그대로"
  quote: "입국 시 세관에서 통관이 보류되는 사례가 발생해 국민 불편이 지속적으로 제기돼 왔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "정식 허가 의약품 조건"
  value: "정식 허가"
  value_note: "원문 그대로"
  quote: "해당 국가의 정상 의료체계에 따라 의약품 규제기관으로부터 정식 허가받은 의약품을 처방·구매한 경우 개인 휴대 반입을 허용하기로 했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "GLP-1 비만치료제 12개"
  value: "12개, 1주, 1회, 1개, GLP-1"
  value_note: "원문 그대로"
  quote: "1주에 1회, 1개를 자가 주사하는 GLP-1 계열 비만치료제는 3개월 복용량인 12개까지 반입할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "출국 후 재입국·외국인·유학생"
  value: "외국인, 유학생"
  value_note: "원문 그대로"
  quote: "국내 환자가 복용 중인 의약품을 가지고 출국했다가 다시 입국하는 경우는 물론, 외국인·유학생 등이 해외에서 복용하던 의약품을 국내에 가져오는 경우에도 휴대 반입이 가능해진다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
- claim: "해외여행 중 처방·구매 적용"
  value: "해외여행"
  value_note: "원문 그대로"
  quote: "해외여행 중 정상적으로 처방·구매한 의약품을 국내에 휴대 반입하는 경우에도 적용된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975557"
