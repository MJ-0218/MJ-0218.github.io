- claim: 개정 의료법 시행일
  value: 12월 24일, 2026년 12월 24일
  quote: 보건복지부는 오는 12월 24일 시행되는 개정 '의료법'에 맞춰
  value_note: 기사(2026.10.19) 기준 올해 12월 24일
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 시행규칙 입법예고 기간
  value: 10월 19일, 11월 9일
  quote: 일부개정령안을 10월 19일부터 11월 9일까지 입법예고한다고 밝혔다
  value_note: 원문 기간을 시작·끝으로 나눠 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 일반 비대면진료 대상
  value: 6개월 이내, 같은 증상, 같은 의료기관
  quote: 일반 비대면진료는 해당 의료기관에서 6개월 이내 같은 증상으로 대면진료를 받은 이력이 있는 환자를 대상으로 한다
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
  source2: https://www.korea.kr/briefing/pressReleaseView.do?newsId=156785554
  quote2: 6개월 내 같은 증상은 같은 의료기관에서 비대면진료
- claim: 초진 비대면진료 — 같은 시·도
  value: 같은 시·도, 주민등록상 주소지, 실거주지
  quote: 환자의 주민등록상 주소지와 의료기관 소재지가 같은 시·도에 있는 경우 초진 비대면진료가 가능하다. 비대면진료지원시스템에 실거주지를 등록한 환자는 실거주지를 기준으로 한다
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 다른 시·도 예외 대상
  value: 희귀질환자, 제1형 당뇨병 환자, 등록장애인, 장기요양수급자
  quote: 희귀질환자, 제1형 당뇨병 환자, 등록장애인, 장기요양수급자 등 법령에서 정한 환자는 다른 시·도에 있는 의료기관에서도 초진 비대면진료를 받을 수 있다
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 의원급 원칙
  value: 의원급, 병원급
  quote: 비대면진료는 의원급 의료기관에서 실시하는 것이 원칙이다
  value_note: 예외적으로 병원급 가능
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 초진 처방일수
  value: 7일 이내, 7일, 30일, 한 차례
  quote: 초진 비대면진료의 의약품 처방일수는 원칙적으로 7일 이내다. 다만 해당 질환의 진료·처방 이력이 확인되고 의료인이 기존 치료를 계속할 필요가 있다고 판단하면 한 차례에 한해 30일 이내로 처방할 수 있다
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 처방 금지 의약품
  value: 마약·향정신성의약품, 오·남용 우려 의약품, 비만치료제
  quote: 비대면진료에서는 마약·향정신성의약품, 오·남용 우려 의약품, 비만치료제 처방을 원칙적으로 금지한다
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 진료 방식
  value: 화상통신 원칙, 음성통신
  quote: 진료는 화상통신을 원칙으로 하되, 일정한 경우 음성통신을 허용하는 등
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 의료기관 비율 제한
  value: 30% 이내, 30%, 500건
  quote: 의료기관의 비대면진료 건수는 반기별 전체 진료 건수의 30% 이내로 제한한다. 의료인별 반기 월평균 비대면진료 건수는 의사 500건
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
- claim: 의견 제출
  value: 11월 9일, 국민참여입법센터
  quote: 시행규칙과 행정처분 규칙 개정안에 대한 의견은 11월 9일까지 복지부 의료정보정책과(의약품 인도 관련 의견은 약무정책과) 또는 국민참여입법센터를 이용할 수 있다
  value_note: 원문 문구를 줄여 씀
  source: https://www.korea.kr/news/policyNewsView.do?newsId=148973762
