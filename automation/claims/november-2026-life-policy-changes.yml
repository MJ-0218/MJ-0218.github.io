  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
- claim: "탄소중립포인트 14종→16종, 연간 최대 7만 원"
  value: "14종, 16종, 7만 원"
  value_note: "원문 숫자 그대로"
  quote: "탄소중립포인트제 대상도 기존 14종에서 16종으로 늘어난다. 연간 최대 7만 원의 인센티브를 적립받을 수 있는 탄소중립포인트 실천항목에 무탄소 택시 이용과 다회용 택배상자 사용이 추가돼"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
- claim: "추가 2종: 전기·수소 택시, 다회용 택배상자"
  value: "2종"
  quote: "탄소중립포인트제에 인센티브 항목이 2종 추가된다. 무탄소(전기·수소) 택시를 이용하거나 다회용 택배상자 사용 시에도 포인트를 받을 수 있게 된 것이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
- claim: "AI 위조상품 감정 11월부터"
  value: "11월"
  quote: "지식재산처는 11월부터 AI를 활용한 위조상품 감정지원 시스템을 구축한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
- claim: "디지털 중기예보 11월 12일, 5km, 3시간·6시간"
  value: "11월 12일, 5km, 3시간, 6시간, 6~8일, 9~11일"
  value_note: "원문 '+6~8일 예보는 3시간 단위, +9~11일 예보는 6시간 단위'"
  quote: "기상청은 11월 12일부터 디지털 중기예보 서비스를 전면 시행한다. 강수 유무 중심 단정예보에서 강수 가능성 정보를 제공하고, 특별·광역시도 단위 예보를 5km 격자 단위 상세 예보로 바꾸며, +6~8일 예보는 3시간 단위, +9~11일 예보는 6시간 단위로 세분화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
- claim: "난카이 해곡 경도 136도"
  value: "136도"
  quote: "기존 일본 규슈 지역에 더해 난카이 해곡(경도 136도까지)도 서비스 지역에 포함하기로 한 것이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974701"
