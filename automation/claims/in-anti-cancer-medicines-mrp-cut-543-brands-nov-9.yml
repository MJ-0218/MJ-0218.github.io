- claim: "TMR Oct 17, 137 drugs"
  value: "October 17, 2026, 137"
  value_note: "원문 On October 17, 2026 ... 137 non-scheduled"
  quote: "On October 17, 2026, NPPA had announced Trade Margin Rationalisation (TMR) of 137 non-scheduled anti-cancer drugs in public interest to address excessive trade margins, make cancer treatment more affordable"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329698
- claim: "Covered drug types"
  value: "over 20 types, Denosumab, Pegfilgrastim, Bevacizumab"
  value_note: "원문 over 20 types of cancer, Denosumab, Pegfilgrastim, Bevacizumab"
  quote: "The 137 non-scheduled anti-cancer drugs include immunotherapy medicines used in the treatment of over 20 types of cancer , Denosumab used by breast and prostate cancer patients , Pegfilgrastim used to prevent neutropenia in cancer patients, and Bevacizumab, which is approved for the treatment of colon, ovarian and cervical cancers."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329698
