- claim: "3만5846명→3만8446명, 2600명 증가, 정부예산안 기준"
  value: "3만8446명, 3만5846명, 2600명, 3만5846명 → 3만8446명"
  value_note: "원문 3만 5846명에서 2600명 늘어난 3만 8446명 (띄어쓰기 붙임)"
  quote: "2027년 장애인일자리 지원 규모는 정부예산안 기준으로 올해 3만 5846명에서 2600명 늘어난 3만 8446명으로 확대된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "유형별 증가 700/1300/600"
  value: "700명, 1300명, 600명"
  value_note: "원문 일반형일자리 700명, 복지형일자리 1300명, 특화형일자리 600명"
  quote: "일자리 유형별로는 일반형일자리 700명, 복지형일자리 1300명, 특화형일자리 600명이 각각 늘어난다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "대상 18세 이상 미취업 등록장애인, 2007년부터"
  value: "18세, 2007년"
  value_note: "원문 18세 이상 / 2007년부터"
  quote: "장애인일자리 사업은 취업에 어려움을 겪는 18세 이상 미취업 등록장애인에게 공공일자리를 제공하는 사업이다. 장애인의 사회참여 촉진과 직업경험 제공, 소득보장 지원을 위해 2007년부터 시행하고 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "편의시설 모니터링 신설 500명"
  value: "500명"
  quote: "특화형일자리에는 기존 시각장애인안마사 파견과 발달장애인요양보호사 보조 직무에 더해 '장애인 편의시설 모니터링' 직무가 신설된다. 이를 통해 500명에게 일자리를 제공한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "복지형 식물코디네이터·진로지도 멘토, 총 52개"
  value: "52개"
  quote: "복지형일자리에는 '식물코디네이터'와 '진로지도 멘토' 직무를 새롭게 도입해 총 52개 직무를 운영한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "11~12월 모집, 심사·면접, 2027.1.1~12.31"
  value: "11~12월, 2027년 1월 1일, 12월 31일, 2027.1.1~12.31"
  value_note: "원문 올해 11~12월 / 2027년 1월 1일부터 12월 31일까지"
  quote: "참여자 모집은 올해 11~12월 지방정부별로 실시한다. 소득수준과 장애 정도, 참여경력 등을 고려한 심사와 면접을 거쳐 참여자를 선발하며, 사업 참여 기간은 2027년 1월 1일부터 12월 31일까지다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "공고·문의 시군구청"
  value: "시·군·구청"
  quote: "지역별 모집 시기가 다를 수 있으므로 구체적인 일정과 신청 방법은 거주지 시·군·구청에 문의하면 된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
- claim: "29일 사업설명회, 문의처"
  value: "29일, 10월 29일, 044-202-3328"
  value_note: "원문 29일 (기사 2026.10.30) / 문의: 보건복지부 장애인자립기반과(044-202-3328)"
  quote: "보건복지부와 한국장애인개발원은 29일 서울 용산구 피스앤파크컨벤션에서 '2027년 장애인일자리 사업설명회'를 열고"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
  quote2: "문의: 보건복지부 장애인자립기반과(044-202-3328)"
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974621"
