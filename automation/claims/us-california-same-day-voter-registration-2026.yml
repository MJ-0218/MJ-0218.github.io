- claim: Online/mail registration deadline Oct. 19
  value: Oct. 19, Monday
  quote: "Monday, Oct. 19, marked the deadline to register to vote online or by mail in California."
  source: https://www.cbsnews.com/sacramento/news/california-voter-registration-deadline-passes-what-to-know/
  quote2: "Today is the deadline to register to vote and receive a Vote-by-Mail ballot for the Nov. 3 General Election."
  source2: https://www.theeastsiderla.com/news/good-to-know-deadline-today-register-to-vote-get-mail-in-ballot/article_7a73d227-317b-4be0-b637-4f1fc8e5f800.html
  value_note: Eastsider article dated Oct 19, 2026
  secondary_ok: true
- claim: General Election date
  value: Nov. 3, 2026
  quote: "General Election - November 3, 2026"
  source: https://www.sos.ca.gov/elections/upcoming-elections
  value_note: November written as Nov.
- claim: What Same Day Voter Registration is
  value: Conditional Voter Registration, safety net
  quote: "Same Day Voter Registration, known as Conditional Voter Registration in state law, is a safety net for Californians who miss the deadline to register to vote or update their voter registration information for an election."
  value_note: terms taken from the quote
  source: https://www.sos.ca.gov/elections/voter-registration/same-day-reg
- claim: 14-day window and where
  value: 14 days, county elections office, polling place, vote center
  quote: "Eligible citizens who need to register or re-register to vote within 14 days of an election can complete this process to register and vote at their county elections office, polling place, or vote center."
  value_note: terms taken from the quote
  source: https://www.sos.ca.gov/elections/voter-registration/same-day-reg
- claim: Ballot counted after verification
  value: verification
  quote: "Their ballots will be processed and counted once the county elections office has completed the voter registration verification process."
  value_note: terms taken from the quote
  source: https://www.sos.ca.gov/elections/voter-registration/same-day-reg
- claim: Early voting locations site
  value: caearlyvoting.sos.ca.gov
  quote: "Visit caearlyvoting.sos.ca.gov for a list of early voting locations where you can complete the Same Day Voter Registration Process."
  value_note: terms taken from the quote
  source: https://www.sos.ca.gov/elections/voter-registration/same-day-reg
- claim: Military, overseas, disabilities
  value: military, overseas, disabilities
  quote: "If you are a military or overseas voter or a voter with disabilities, contact your county elections office to learn about the conditional voter registration and voting options that are available to you."
  value_note: terms taken from the quote
  source: https://www.sos.ca.gov/elections/voter-registration/same-day-reg
