- claim: "Parabens are preservatives against bacteria and mold"
  value: "preservatives"
  quote: "Parabens are a family of related chemicals that are commonly used as preservatives in cosmetic products. Preservatives may be used in cosmetics to prevent the growth of harmful bacteria and mold, in order to protect both the products and consumers."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
- claim: "Common parabens names"
  value: "methylparaben"
  quote: "The parabens used most commonly in cosmetics are methylparaben, propylparaben, butylparaben, and ethylparaben."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
  quote2: "parabens are often used in combination with other types of preservatives to better protect against a broad range of microorganisms"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
- claim: "Products that may contain parabens; deodorants"
  value: "makeup, moisturizers"
  quote: "Cosmetics that may contain parabens include makeup, moisturizers, hair care products, and shaving products, among others. Many major brands of deodorants do not currently contain parabens, although some may."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
- claim: "Ingredient list required; parabens easy to identify"
  value: "list of ingredients"
  quote: "Cosmetics sold to consumers in stores or online must have a list of ingredients, each listed by its common or usual name."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
  quote2: "Parabens are usually easy to identify by their name"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
- claim: "FDA no info showing health effect; reviewing; safer alternatives question"
  value: "parabens"
  quote: "At this time, we do not have information showing that parabens as they are used in cosmetics have an effect on human health."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
  quote2: "If we stop using parabens to protect cosmetics and consumers from harmful bacteria, are there safer alternatives for preservatives?"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/parabens-cosmetics
