- claim: Before May 1997 and dual recipients
  value: May 1997, 3rd, 1st
  quote: "People who began receiving Social Security before May 1997 generally receive their payment on the third day of the month. People who receive both Social Security and Supplemental Security Income generally receive their Social Security payment on the third and their SSI payment on the first."
  source: https://www.usatoday.com/story/money/2026/10/19/social-security-payment-schedule-october-21-2026/92271253007/
  quote2: "These recipients are generally paid on the third of the month, while people receiving both Social Security and SSI usually receive their SSI on the first of the month and their Social Security on the third."
  source2: https://www.newsweek.com/social-security-payments-up-to-5181-coming-this-week-who-gets-paid-12586734
  value_note: third/first written as 3rd/1st
  secondary_ok: true
