- claim: "Only unbroken skin"
  value: "unbroken, intact skin"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Use wipes only on unbroken, intact skin."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Only intended use, follow label"
  value: "directions"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Use wipes only for their intended use, following all directions on the label."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Let skin dry"
  value: "dry thoroughly"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Make sure to let skin dry thoroughly after using wipes."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Keep containers closed"
  value: "tightly closed"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Keep containers tightly closed to keep wipes from drying out."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Discard used immediately"
  value: "discard"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Discard used wipes immediately to prevent cross contamination, and as directed on the label."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Some not flushable"
  value: "flushable"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Some, but not all, are labeled as flushable."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Hot car: dry out, preservatives break down"
  value: "hot or cold car, preservatives"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If they are exposed to temperature extremes, such as in a hot or cold car, they may dry out, or the temperature extremes can cause changes in the ingredients. For example, the preservatives that protect against bacteria and mold may break down and not be able to do their job."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Rash: stop, see provider"
  value: "rash, stop"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If you observe a rash, such as raised red bumps, either smooth or crusty, redness, irritation, or burning of the skin in the area(s) where wipes contact the skin, stop using the wipes and contact your healthcare provider right away."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Off color/bad smell report"
  value: "off color, bad smell"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Even if all you notice is an “off” color or a bad smell, FDA wants to know."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
- claim: "Recalls for bacteria/mold"
  value: "recalls"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "there have been recalls of some wipes that were contaminated with bacteria or mold."
  source: https://www.fda.gov/cosmetics/cosmetic-products/disposable-wipes
