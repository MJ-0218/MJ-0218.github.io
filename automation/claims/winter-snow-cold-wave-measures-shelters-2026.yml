- claim: "재난문자 227개 시·군·구 확대, 한파쉼터 6만 6000여 곳"
  value: "227개, 6만 6000"
  value_note: "원문 그대로"
  quote: "올겨울 대설 재난문자 발송 대상이 전국 227개 시·군·구로 확대되고 한파쉼터는 6만 6000여 곳으로 늘어난다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "이달 15일~내년 3월 15일 대책기간, 관심 단계"
  value: "15일, 11월 15일, 3월 15일"
  value_note: "기사일 11월 11일 기준 '이달 15일' = 11월 15일"
  quote: "정부는 이달 15일부터 내년 3월 15일까지 '겨울철 자연재난 대책기간'을 운영하고, 대설·한파 위기경보 '관심' 단계를 발령해 범정부 대응에 나선다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "기상청 전망"
  value: "평년"
  value_note: "원문 그대로"
  quote: "기상청은 올겨울 기온이 평년과 비슷하거나 높고 강수량은 평년과 비슷하거나 많을 것으로 전망했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "기온 변동성·많은 눈 가능성"
  value: "많은 눈"
  value_note: "원문 그대로"
  quote: "기온 변동성이 크고, 지역에 따라 많은 눈이 내릴 가능성이 있어"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "24시간 상황관리"
  value: "24시간"
  value_note: "원문 그대로"
  quote: "정부와 지방정부는 대책기간 동안 24시간 상황관리체계를 유지하고"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "재난문자 시범 101곳 → 227개"
  value: "101곳, 227개"
  value_note: "원문 그대로"
  quote: "재난문자 발송 대상은 기존 시범운영 지역 101곳에서 전국 227개 시·군·구로 확대한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "취약지역 9240곳, 479곳 증가"
  value: "9240곳, 479곳"
  value_note: "원문 그대로"
  quote: "겨울철 5대 재해우려지역 9240곳을 집중 관리한다. 지난해보다 479곳 늘어난 규모다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "제설제 119만 톤(126%), 장비 5만여 대"
  value: "119만 톤, 126%, 5만여 대"
  value_note: "원문 그대로"
  quote: "지난해 사용량 94만 6천 톤의 126% 수준인 제설제 119만 톤을 비축하고, 제설장비 5만여 대를 확보한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "1~2시간 전 살포, 오후 11시~오전 8시 순찰, 내비·전광판"
  value: "1~2시간, 11시, 8시, 오후 11시, 오전 8시"
  value_note: "원문 그대로"
  quote: "강설 예보 시에는 1~2시간 전에 제설제를 미리 살포하고, 도로살얼음에 대비해 야간 취약시간인 오후 11시부터 다음 날 오전 8시까지 순찰을 강화한다. 도로살얼음 위험정보는 내비게이션 앱과 도로전광표지판으로 실시간 제공한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "대중교통·내 집 앞 눈 치우기"
  value: "눈 치우기"
  value_note: "원문 그대로"
  quote: "대중교통 이용과 내 집·점포 앞 눈 치우기 등 국민 참여를 유도한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "안전신문고 12월 1일~2027년 3월 15일"
  value: "12월 1일, 2027년 3월 15일, 2027년"
  value_note: "원문 그대로"
  quote: "12월 1일부터 2027년 3월 15일까지 안전신문고에서 '겨울철 위험요소 집중신고 기간'을 운영한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "제설 미흡·제설함 불량 신고"
  value: "제설함"
  value_note: "원문 그대로"
  quote: "제설이 미흡하거나 제설함 관리가 불량한 사례 등 생활 주변 위험요인을 신고받아 개선할 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "생활지원사 3만 7천여 명 안부·방한용품"
  value: "3만 7천"
  value_note: "원문 그대로"
  quote: "생활지원사 3만 7천여 명이 고령층과 독거노인의 안부를 전화나 방문으로 확인하고 담요·양말 등 방한용품을 지원한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "한파쉼터 5만 3천 → 6만 6천, 금융기관·우체국 협약"
  value: "5만 3천, 6만 6천"
  value_note: "원문 그대로"
  quote: "한파쉼터는 금융기관·우체국 등과 협약해 지난해 5만 3천여 곳에서 올해 6만 6천여 곳으로 확대한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "응급대피소 342곳, 응급잠자리 217곳"
  value: "342곳, 217곳"
  value_note: "원문 그대로"
  quote: "24시간 운영 가능한 응급대피소 342곳과 쪽방주민·노숙인을 위한 응급잠자리 217곳도 운영한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "한파 저감시설 4만 6천여 곳"
  value: "4만 6천"
  value_note: "원문 그대로"
  quote: "버스정류장과 보행로 주변에는 온열의자·방풍시설 등 한파 저감시설 4만 6천여 곳을 운영한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "수도·계량기 보온 홍보"
  value: "계량기"
  value_note: "원문 그대로"
  quote: "정부는 수도·계량기 보온조치를 홍보하고 동파 시 긴급복구와 비상급수 체계를 가동한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
- claim: "한파특보 재난문자·TV 자막, 이머전시 레디 앱"
  value: "이머전시 레디"
  value_note: "원문 그대로"
  quote: "한파특보 발표 시 재난문자와 TV 자막방송으로 기상특보와 한랭질환 예방수칙을 알린다. 온라인 매체 이용이 어려운 어르신에게는 대면 홍보를 병행하고, 외국인에게는 '이머전시 레디(Emergency Ready)' 앱으로"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975490"
