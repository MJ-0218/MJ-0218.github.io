- claim: "세대원·동거인 표시, 계모·계부 표기 방지"
  value: "세대원, 동거인"
  value_note: "원문 '세대원' / '동거인' (따옴표)"
  quote: "주민등록 등·초본을 발급할 때 세대주 본인과 배우자가 아닌 가족은 '세대원', 그 외 사람은 '동거인'으로 표시한다. '배우자의 자녀', '계모', '계부' 등의 표기로 가족관계가 드러나는 것을 막기 위한 조치다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974451"
- claim: "일반 발급 안내, 상세 가능"
  value: "일반, 상세"
  value_note: "원문 '일반' / '상세' (따옴표)"
  quote: "제출기관의 별도 요구가 없으면 '일반'으로 발급받도록 안내하며, 필요한 경우 기존처럼 가족관계를 자세히 표시하는 '상세' 등·초본도 발급받을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974451"
- claim: "외국인 한글·로마자 성명"
  value: "로마자"
  quote: "주민등록표 등본에는 외국인의 한글 성명과 로마자 성명을 함께 표기할 수 있다. 그동안 가족관계등록 서류에는 한글 이름, 주민등록표 등본에는 로마자 이름만 표기돼 동일인임을 입증하기 어려웠던 불편을 줄이기 위한 것이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974451"
- claim: "전입신고 서류 간소화"
