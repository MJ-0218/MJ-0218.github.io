- claim: 예산안 미반영과 검토안 내용
  value: 35세 미만, 생애 1회, 생애 한 번, 이직 전 임금의 60%, 60%, 월 최대 100만 원, 100만 원, 2027년, 19일
  quote: "19일 고용노동부에 따르면 35세 미만 청년이 일정 기간 근무 후 자발적으로 이직할 경우 생애 1회 구직급여를 지급하는 방안이 2027년도 예산안에 반영되지 않았다. 검토안에는 이직 전 임금의 60%, 월 최대 100만원 수준을 지급하는 내용이 담겨 있었다"
  source: https://www.sedaily.com/article/20103070
  quote2: "35세 미만 청년이 일정 기간 근무한 뒤 자발적으로 이직할 경우 생애 한 차례 구직급여를 지급하는 방안이 2027년도 예산안에 반영되지 않았다. 검토안에는 이직 전 임금의 60%를 지급하되 월 최대 100만원 수준으로 제한하는 내용이 담겼다"
