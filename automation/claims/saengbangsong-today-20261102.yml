- claim: 대식가 — 마포구 해정집 페퍼로니 갑오징어볶음
  value: 해정집, 마포구, 페퍼로니 갑오징어볶음
  value_note: "톱스타뉴스 서교동(합정역~상수역) 페퍼로니갑오징어볶음·뚝배기불스지·순대곱창볶음·뼈해장국 — 메뉴 일치"
  quote: "이날 '대식가' 코너에서는 서울 마포구에 위치한 '해정집'이 소개됐다. 이곳에서 눈길을 끈 메뉴는 쫄깃한 갑오징어에 페퍼로니를 더한 매콤 퓨전 볶음인 '페퍼로니 갑오징어볶음'이다."
  source: "https://www.wikitree.co.kr/articles/1171186"
  quote2: "서울 마포구 서교동, 합정역과 상수역 사이에 위치한 페퍼로니갑오징어볶음 맛집은 인기 레스토랑이다."
