- claim: 수원 다시 봄 다이닝 뇨끼·화분 샐러드
  value: 다시 봄 다이닝, 수원, 뇨끼, 화분 샐러드
  value_note: "톱스타뉴스 수원 영통구 신동(신동카페거리) 뇨끼·화분샐러드·꽃게로제파스타·잠봉옥수수치즈듬뿍피자 — 메뉴 일치"
  quote: "경기 수원에 위치한 '다시 봄 다이닝'도 소개됐다. 이곳은 양식 메뉴를 선보인다. 잠봉 매운 크림 뇨끼부터 트러플 크림 뇨끼, 꽃게 로제 파스타, 대하 로제 파스타, 라구 치즈 듬뿍 피자, 잠봉 옥수수 치즈 듬뿍 피자 등을 판매한다. 특히 화분을 형상화한 화분 샐러드 등도 판매한다."
  source: "https://www.wikitree.co.kr/articles/1171186"
  quote2: "수원 영통구 신동, 신동카페거리 일대에 위치한 비프웰링턴 맛집은 많은 이들의 사랑을 받는 레스토랑이다. 이날 방송을 통해서는 화끈한 개성을 가진 뇨끼와 독특한 비주얼의 화분샐러드 등을 조명해 시청자의 침샘을 자극했다."
  source2: "https://www.topstarnews.net/news/articleView.html?idxno=16266359"
  secondary_ok: true
