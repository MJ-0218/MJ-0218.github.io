- claim: "기존 19개 지역 등록교육센터, 2028년부터 만성질환 통합관리센터로 개편"
  value: "19개, 2028년"
  value_note: "원문 그대로"
  quote: "기존 19개 지역의 '고혈압·당뇨병 등록교육센터'가 전환 준비 기간을 거쳐 2028년부터 '만성질환 통합관리센터'로 개편된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "신규 지역 2027년 7월부터 운영"
  value: "2027년 7월, 7월"
  value_note: "원문 그대로"
  quote: "신규 지역에서는 2027년 7월부터 센터를 운영한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "2027년은 전환 준비 기간, 명칭·교육·상담·알림 유지"
  value: "2027년"
  value_note: "원문 그대로"
  quote: "이 기간 센터 명칭은 기존대로 사용하고 교육·상담, 알림 등 관리 기능도 유지한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "기존 등록환자 의료비 지원은 건강생활실천지원금 방식으로 전환"
  value: "건강생활실천지원금"
  value_note: "원문 그대로"
  quote: "기존 등록환자의 의료비 지원은 앞서 발표한 대로 건강생활실천지원금 방식으로 전환한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "신규 지역은 2027년 상반기 공모로 선정"
  value: "2027년 상반기, 상반기"
  value_note: "원문 그대로"
  quote: "신규 사업 지역은 기존 센터의 전환 준비와 별도로 2027년 상반기 공모를 통해 선정한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "30세 이상 → 전 연령, 이상지질혈증 등으로 확대"
  value: "30세, 이상지질혈증"
  value_note: "원문 그대로"
  quote: "질병청은 기존 19개 지역에서 30세 이상을 대상으로 제공하던 건강서비스를 전 연령과 더 많은 지역으로 단계적으로 확대하고, 고혈압·당뇨병에서 이상지질혈증 등으로 관리 질환도 넓혀갈 방침이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
- claim: "11월 5일 이행 방안 발표(9월 30일 확대 방향 후속)"
  value: "5일, 11월 5일, 9월 30일"
  value_note: "원문 그대로"
  quote: "질병관리청은 지난 9월 30일 발표한 '만성질환 관리 전국 확대 방향'에 따라 기존 센터의 전환 방식과 환자 안내 등 이행 방안을 5일 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975202"
