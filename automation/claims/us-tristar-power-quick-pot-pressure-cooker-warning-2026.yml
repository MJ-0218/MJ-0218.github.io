- claim: "Warning date and units"
  value: "Oct. 15, 2026, 393,000"
  value_note: "October 15, 2026; About 393,000"
  quote: "Product Safety Warning Date: October 15, 2026 Units: About 393,000"
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
- claim: "Model, stop using, lid opens while pressurized"
  value: "Y6D-36"
  quote: "warning consumers to stop using the 6-quart Power Quick Pot pressure cookers, model Y6D-36, immediately because they pose a risk of serious injury from burn hazard. The pressure cooker’s lid can open while pressurized, causing hot contents to be expelled unexpectedly."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
- claim: "Dispose, don't sell; importer refused"
  value: "refused"
  quote: "CPSC urges consumers to stop using the pressure cookers immediately and dispose of them. Do not sell or give away these hazardous products. The importer, Tristar Products, Inc., of Altamonte Springs, Florida, has refused to recall these products or offer a remedy to consumers."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
- claim: "Description and label"
  value: "black pressure lid"
  quote: "The stainless-steel pressure cookers have a black pressure lid, button controls and a digital temperature and function display. “Power Quick Pot” is printed on the front and the model number appears on a label on the back of the unit."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
- claim: "24 reports of serious burns"
  value: "24"
  quote: "CPSC has obtained 24 reports of the pressure cookers expelling hot contents unexpectedly, resulting in serious burn injuries."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
- claim: "Sold at, dates, price"
  value: "July 2018, November 2023, $44, $160"
  quote: "Sold At: Walmart.com, Amazon.com, Ebay.com and other retailers nationwide from about July 2018 to November 2023 for between $44 and $160."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Immediately-Stop-Using-Tristar-Products-6-Quart-Power-Quick-Pot-Pressure-Cookers-Due-to-Risk-of-Serious-Injury-from-Burn-Hazard
