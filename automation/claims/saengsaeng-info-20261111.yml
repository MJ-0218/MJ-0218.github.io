- claim: "소꼬리찜 = 양념에 조려 부드럽게"
  value: "소꼬리찜"
  value_note: "위키트리 + bnt"
  quote: "국물에 중점을 둔 도가니탕과 달리 소꼬리찜은 부드럽게 익힌 고기와 양념의 조합을 즐기는 음식이다."
  source: "https://www.wikitree.co.kr/articles/1173775"
  quote2: "소꼬리찜은 소꼬리를 양념에 조린 뒤 부드럽게 익혀내는 방식으로 완성된다."
