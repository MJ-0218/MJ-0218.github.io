  value_note: "위키트리 + bnt"
  quote: "도가니탕은 소의 무릎 관절 부위에 있는 연골과 힘줄 등을 푹 고아 만드는 전통 음식이다."
  source: "https://www.wikitree.co.kr/articles/1173775"
  quote2: "도가니탕은 소의 도가니를 오랜 시간 끓여 깊은 국물을 완성하는 음식이다. 쫀득한 식감의 건더기와 담백한 국물이 어우러져"
  source2: "https://www.bntnews.co.kr/article/view/bnt202611110259"
