- claim: "Store testers more likely contaminated; use fresh applicator"
  value: "testers, cotton swab"
  quote: "at cosmetic counters in stores are even more likely to become contaminated than the same products in your home"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Use new unused applicator to test"
  value: "cotton swab"
  quote: "apply it with a new, unused applicator, such as a fresh cotton swab"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Dipping fingers adds microorganisms"
  value: "fingers"
  quote: "Dipping fingers into a product adds microorganisms, such as bacteria and fungi (mold and yeast), which need to be controlled, for example, by preservatives."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Eye-area cosmetics shorter shelf life, eye infections"
  value: "shorter shelf lives"
  quote: "Eye-area cosmetics tend to have shorter shelf lives than other products, which may cause eye infections that can be serious."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Do not share makeup"
  value: "sharing an infection"
  quote: "You may be sharing an infection."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
- claim: "Heat breaks down preservatives"
  value: "heat, hot car"
  quote: "Heat can make preservatives break down and cause bacteria and fungi to grow faster."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling/shelf-life-and-expiration-dating-cosmetics
