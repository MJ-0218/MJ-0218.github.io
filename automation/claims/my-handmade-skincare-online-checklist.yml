- claim: "Home manufacture not illegal; responsibility for environment"
  value: "home"
  quote: "It’s not against the law to manufacture cosmetics in your home. Keep in mind, however, that it’s your responsibility to manufacture products in an environment that will not cause them to become adulterated."
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
- claim: "Not required sterile; microbial contamination hazard"
  value: "microbial contamination"
  quote: "Cosmetics are not required to be sterile, but microbial contamination can pose a health hazard"
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
- claim: "Natural undefined, organic no FDA rules, no guarantee safe"
  value: "natural"
  quote: "FDA has not defined the term “natural” and has not established a regulatory definition for this term in cosmetic labeling. FDA also does not have regulations for the term \"organic\" for cosmetics."
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
  quote2: "choosing ingredients from sources you consider “organic” or “natural” is no guarantee that they are safe"
  source2: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
- claim: "Ingredient names, no 'natural' in statement"
  value: "common or usual names"
  quote: "Don’t use terms such as “natural” as part of an ingredient statement, because ingredients must be listed by their common or usual names, without additional description."
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
- claim: "PO box or website not adequate; name and place of business"
  value: "P.O. box"
  quote: "A post office box or website address is not adequate for this labeling requirement. The FD&C Act requires cosmetic labels to identify the name and place of business of the manufacturer, packer, or distributor."
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
- claim: "Packaging lead-coated lipstick"
  value: "lead"
  quote: "The composition of its container may make the contents \"injurious to health,\" such as a lipstick packaged in a container with lead coating."
  source: https://www.fda.gov/cosmetics/resources-industry-cosmetics/small-businesses-homemade-cosmetics-fact-sheet
