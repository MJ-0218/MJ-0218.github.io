- claim: "단계 일정 2028 100인 이상, 2029 10~99인, 2030 10인 미만, 연내 국회 통과 전제"
  value: "2028년, 2029년, 2030년, 100인 이상, 10~99인, 10인 미만, 2028 → 2030"
  value_note: "원문 2028년 100인 이상 사업장을 시작으로 2029년 10~99인, 2030년 10인 미만"
  quote: "관련 법 개정안이 연내 국회를 통과하면 2028년 100인 이상 사업장을 시작으로 2029년 10~99인, 2030년 10인 미만 사업장까지 확대한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "1년 준비기간, 3단계"
  value: "1년, 3단계"
  value_note: "원문 1년 동안의 준비기간 / 3단계로 나누어"
  quote: "연내 근로자퇴직급여보장법 개정안이 통과되면 1년 동안의 준비기간을 두고 2028년엔 100인 이상 사업장부터, 2029년 10~99인 사업장, 2030년 10인 미만 사업장까지 3단계로 나누어 모든 사업장의 퇴직급여 사외적립을 의무화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "시행 이후 근속기간부터"
  value: "계속근로기간"
  value_note: "본문 '근속기간'"
  quote: "사외적립 의무는 각 단계 시행 시점 이후 발생하는 계속근로기간부터 적용한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "퇴직금 체불 41.1%(8229억 원)"
  value: "41.1%, 8229억 원"
  quote: "지난해 기준 임금체불액 중 퇴직금이 차지하는 비중은 41.1%(8229억 원)인데"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "10월 29일 발표, 당정협의"
  value: "29일, 10월 29일, 2026.10.29"
  value_note: "원문 29일 (기사 날짜 2026.10.29)"
  quote: "정부는 29일 기후에너지환경노동위원회 당정협의를 거쳐 이 같은 내용의 '퇴직연금 기능강화 방안'을 발표했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "매칭 60억, 융자 62억, 수수료 특례"
  value: "60억 원, 62억 원"
  value_note: "원문 매칭지원(60억 원) / 융자비용 보전 사업(62억 원)"
  quote: "내년 정부안에 자율적 우선 도입 사업장에 대한 적립금 매칭지원(60억 원), 경영자금 융자비용 보전 사업(62억 원)을 신규 편성했다. 영세 사업장 대상 수수료 특례 적용, 사용자의 규약신고 의무도 간소화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "담보대출, 비교정보 의무화"
  value: "담보 대출상품"
  quote: "중도인출 대신 활용할 수 있는 담보 대출상품 출시를 위한 제도개선과 함께 다양한 연금상품을 출시하고, 기대수익·수령액 등 연금-일시금 비교정보 사전제공을 의무화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "일시금 의사 없으면 자동 연금"
  value: "자동으로 연금"
  quote: "퇴직급여 수령단계에서도 일시금 수령의사를 제시하지 않을 경우 자동으로 연금으로 지급하게 해 연금수령 유인을 높인다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "중퇴기금 2028년 1월 300인, 자동가입·탈퇴 선택권"
  value: "2028년 1월, 300인"
  quote: "중소기업퇴직연금기금(중퇴기금) 가입대상을 2028년 1월 300인까지 확대하고, 퇴직급여 사외적립 의무화 이후 미도입 사업장에 대해 자동가입제도를 도입하되, 일정 기간 내 탈퇴할 수 있는 선택권을 보장한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "IRP 위험자산 한도 70% 단계 완화, 디폴트옵션 퇴출"
  value: "70%"
  quote: "현재 70%인 개인형퇴직연금제도(IRP)의 위험자산 투자 한도를 단계적으로 완화하고, 확정급여형·개인형퇴직연금제도·중퇴기금의 투자가능상품을 확대한다. 디폴트옵션(사전지정운용제도) 상품 평가로 질 낮은 상품을 퇴출하는"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
- claim: "개정안 11월 중, 12월 본회의"
  value: "11월, 12월"
  value_note: "원문 11월 중 마련 / 12월 국회 본회의"
  quote: "'근로자퇴직급여 보장법' 개정안을 11월 중 마련하고, 연내 국회 본회의 통과를 추진한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
  quote2: "개정 법안이 12월 국회 본회의에서 통과될 수 있게 입법 추진에 총력을 기울이고"
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974546"
