- claim: "₹1,09,019 crore on 31 Oct, in addition to monthly; second additional"
  value: "₹1,09,019 crore, 31 October 2026, second, ₹1,09,019 cr, 31 Oct 2026"
  value_note: "원문 Rs. 1,09,019 crore on 31 st October 2026 / second additional instalment"
  quote: "The Union Government has released additional instalment of tax devolution to State Governments amounting to Rs. 1,09,019 crore on 31 st October 2026, which is in addition to the regular monthly devolution. This is the second additional instalment in this financial year."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330997
- claim: "Purpose festive season, capital spending"
  value: "festive season"
  quote: "This release is in view of the upcoming festive season and to enable States to accelerate capital spending, and also to finance their development/ welfare related expenditure."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330997
