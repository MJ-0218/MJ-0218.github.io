  quote: "직계비속의 소득요건 폐지로 교육비 세액공제 대상이 더 확대됐고요, 고향사랑기부금 세액공제는 10만원 초과에서 20만원 이하 기부금에 40% 세액공제율이 적용됩니다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974766"
