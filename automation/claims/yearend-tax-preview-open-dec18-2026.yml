  quote: "당해연도 예상 소득과 지출을 바탕으로 내년 1월 연말정산 예상세액을 계산하고, 나에게 맞는 절세 정보를 얻을 수 있는데요, 이용 기간은 오는 12월 18일까지로, 홈택스의 연말정산 미리보기에서 보실 수 있습니다."
