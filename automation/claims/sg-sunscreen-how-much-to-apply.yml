- claim: "At least 1 ounce (shot glass) to cover body"
  value: "1 ounce"
  value_note: "one ounce = 1 ounce"
  quote: "An average-sized adult or child needs at least one ounce of sunscreen (about the amount it takes to fill a shot glass) to evenly cover the body from head to toe."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Apply 15 minutes before sun exposure"
  value: "15 minutes"
  quote: "Apply 15 minutes before sun exposure."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Broad spectrum SPF 15 or higher"
  value: "SPF 15"
  quote: "Use broad spectrum sunscreens with sun protection factor (SPF) values of 15 or higher regularly and as directed."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Spray sunscreens never directly on face; closer to equator more solar exposure"
  value: "spray"
  quote: "For example, spray sunscreens should never be applied directly to your face."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
  quote2: "someone who is closer to the equator may experience greater solar exposure than someone who is farther from the equator"
  source2: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
