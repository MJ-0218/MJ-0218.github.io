- claim: "LH 내년 분양계획에 포함 예정"
  value: "연내"
  quote: "연내 발표 예정인 LH의 내년도 분양계획에는 내년 부담 가능한 공공분양주택으로 분양할 단지도 포함될 예정이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
