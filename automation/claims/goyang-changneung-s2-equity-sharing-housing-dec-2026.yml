- claim: "12월 고양창릉 S-2블록 1057세대 중 284세대 지분적립형, 4일 발표"
  value: "12월, S-2블록, 1057세대, 284세대, 4일, 11월 4일"
  value_note: "기사 2026.11.04 '4일 밝혔다' / 원문 숫자 그대로"
  quote: "국토교통부는 오는 12월 경기 고양창릉 S-2블록 1057세대 가운데 284세대를 지분적립형으로 공급하고, 앞으로 한국토지주택공사(LH) 공공분양주택에 지분적립형과 이익공유형Ⅱ 등 '부담 가능한 공공분양주택'을 단계적으로 확대한다고 4일 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "25% 입주, 20년에 걸쳐 나머지 취득"
  value: "25%, 20년"
  value_note: "원문 '분양가의 25%만 내고 ... 20년에 걸쳐'"
  quote: "분양가의 25%만 내고 입주한 뒤 나머지 지분을 20년에 걸쳐 나눠 취득하는 '지분적립형' 공공분양주택이 처음 공급된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "4년마다 5회 15%씩, 미취득 지분 임대료 전세 시세 90%"
  value: "4년, 5회, 15%, 90%"
  value_note: "원문 숫자 그대로"
  quote: "지분적립형의 수분양자는 최초 입주 때까지 25%의 지분만 취득한 뒤 4년마다 5회에 걸쳐 15%씩 잔여 지분을 취득하고, 미취득 지분에 대해서는 주변 전세 시세의 90% 수준으로 사업자에게 임대료를 납부한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "최대 1년 유예"
  value: "1년"
  quote: "수분양자의 경제적 여건 등을 고려해 최대 1년 동안 취득을 유예할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "수도권 평균 5억1000만원(55㎡) 기준 초기 1억2800만원, 이익공유형Ⅱ 1억5300만원(30%)"
  value: "5억 1000만 원, 55㎡, 1억 2800만 원, 1억 5300만 원, 30%"
  value_note: "원문 숫자 그대로"
  quote: "현재 수도권 평균 공공분양주택 분양가격 5억 1000만 원(전용면적 55㎡ 기준)을 기준으로 지분적립형은 초기 지분 취득 비용 1억 2800만 원(분양가의 25%), 이익공유형 Ⅱ는 대출을 제외한 초기 필요 자금 1억 5300만 원(분양가의 30%)으로 분양받을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "LTV 40% 검토 시 7700만원"
  value: "40%, 7700만 원"
  value_note: "원문 '도입을 검토하고 있는' — 확정 아님"
  quote: "도입을 검토하고 있는 주택담보인정비율(LTV) 40%를 적용하면 초기 필요 자금은 7700만 원으로 줄어든다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "예시: 전세 4억 가정 시 임대료 보증금 2억7000만원 또는 월 79만원"
  value: "4억 원, 2억 7000만 원, 79만 원"
  value_note: "원문 문답 예시 그대로"
  quote: "예를 들어 주변 전세 시세가 4억 원이라고 가정하면 미취득 지분에 대한 초기 임대료는 보증금 100% 기준 2억 7000만 원, 월세 100% 기준 월 79만 원입니다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "이익공유형Ⅱ 70%(한도 5억) 의무 융자, 디딤돌보다 1%p 낮게, 우대 0.5%p, 하한 1.2%"
  value: "70%, 5억 원, 1%p, 0.5%p, 1.2%"
  value_note: "원문 숫자 그대로"
  quote: "이익공유형 Ⅱ는 분양가의 70%(한도 5억 원)를 주택도시기금에서 저리로 의무 융자받게 하고"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "금리 디딤돌보다 1%p 낮게, 우대 0.5%p"
  value: "1%p, 0.5%p"
  value_note: "원문 그대로"
  quote: "금리는 대출 실행 시점의 디딤돌 대출 기본금리보다 1%p 낮게 설정하고, 우대금리도 최대 0.5%p까지 지원한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
- claim: "이익공유형Ⅱ 법적 근거 없음, 법령 개정 추진"
  value: "공공주택 특별법"
  quote: "이익공유형 Ⅱ의 경우는 아직 법적인 근거가 없어 이를 도입하기 위한 공공주택 특별법령 개정을 신속히 추진해 나갈 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975005"
