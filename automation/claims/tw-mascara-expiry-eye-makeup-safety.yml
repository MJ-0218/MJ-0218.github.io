- claim: "睫毛膏購買後 2 到 4 個月丟棄"
  value: "2 到 4 個月, 2～4 個月"
  value_note: "two to four months = 2 到 4 個月"
  quote: "Manufacturers usually recommend discarding mascara two to four months after purchase."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "不要放在超過華氏 85 度"
  value: "華氏 85 度"
  value_note: "85 degrees F = 華氏 85 度"
  quote: "Don't store cosmetics at temperatures above 85 degrees F."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "華氏 85 度 ≈ 攝氏 29 度"
