- claim: "Wajib tanggal kedaluwarsa kecuali stabil minimal 3 tahun"
  value: "3 tahun"
  value_note: "three years = 3 tahun"
  quote: "FDA regulations require all nonprescription drugs to have an expiration date unless the manufacturer’s stability testing has shown that the product will remain stable for at least three years."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Tanpa tanggal → kedaluwarsa 3 tahun setelah beli; lupa umur → buang"
  value: "3 tahun setelah dibeli"
  value_note: "three years after purchase"
  quote: "That means a sunscreen product that doesn’t have an expiration date should be considered expired three years after purchase"
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
  quote2: "If you do not know how old your sunscreen is, discard it."
  source2: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "SPF 15 atau lebih"
  value: "SPF 15"
  quote: "Use broad spectrum sunscreens with sun protection factor (SPF) values of 15 or higher regularly and as directed."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
