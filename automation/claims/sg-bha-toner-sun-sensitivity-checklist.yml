- claim: "Most common BHA salicylic acid"
  value: "salicylic acid"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Currently, the BHA most commonly used in cosmetics is salicylic acid."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "BHA label names"
  value: "salicylic acid, tropic acid"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "BHA ingredients may be listed as - salicylic acid (or related substances, such as salicylate, sodium salicylate, and willow extract) * beta hydroxybutanoic acid tropic acid trethocanic acid"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "Patch test"
  value: "small area"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Test any product that contains a BHA on a small area of skin before applying it to a large area."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "Follow instructions"
  value: "recommended applications"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Follow the use instructions on the label. Do not exceed the recommended applications."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "Irritation stop and consult"
  value: "prolonged stinging"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If you use cosmetics with BHAs and experience skin irritation or prolonged stinging, stop using the product and consult your physician."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "Avoid infants children"
  value: "infants and children"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Avoid using BHA-containing products on infants and children."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "Use sun protection"
  value: "sun protection"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Use sun protection if you use a BHA product."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
- claim: "CIR safe as used; daily sun protection"
  value: "daily use of sun protection"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "\"safe as used when formulated to avoid irritation and when formulated to avoid increased sun sensitivity.\" CIR added that \"when sun sensitivity would be expected, directions for use [should] include the daily use of sun protection.\""
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/beta-hydroxy-acids
