- claim: "Wage ceiling 15000→25000; last revised Sept 2014 6500→15000; approved Sept 2026"
  value: "₹15,000, ₹25,000, September 2014, ₹6,500, September 2026, ₹15,000 → ₹25,000"
  value_note: "원문 September 2014, from ₹6,500 to ₹15,000 / In September 2026 ... ₹25,000 per month was approved"
  quote: "The wage ceiling for mandatory EPFO coverage was last revised in September 2014, from ₹6,500 to ₹15,000 per month. In September 2026, a further increase to ₹25,000 per month was approved."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "Expected 51 lakh additional; subject to statutory provisions"
  value: "51 lakh"
  quote: "The revision is expected to extend mandatory coverage to over 51 lakh additional employees."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
  quote2: "The revised ceiling broadens the pool of employees eligible for mandatory coverage, subject to applicable statutory provisions."
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "Three pillars"
  value: "provident fund"
  quote: "EPFO social security architecture includes provident fund savings, pension benefits and insurance protection."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "EPS benefits"
  value: "superannuation"
  quote: "The EPS 2026 provides monthly pension benefits to eligible members on superannuation, retirement or disability."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "13 provisions into three categories"
  value: "13, three"
  value_note: "원문 13 provisions ... three categories"
  quote: "EPFO has consolidated 13 provisions governing partial withdrawals into three categories : Essential Needs, Housing Needs and Special Circumstances. Essential Needs cover expenses related to illness, education and marriage."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "10 education, 5 marriage, earlier combined 3"
  value: "10, 5, 3"
  value_note: "원문 up to 10 withdrawals for education and 5 for marriage / combined limit of 3"
  quote: "allowing up to 10 withdrawals for education and 5 for marriage . Earlier, both purposes shared a combined limit of 3 partial withdrawals."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "75% balance; 12 months"
  value: "75%, 12 months"
  value_note: "원문 up to 75% of their PF balance / standardised at 12 months"
  quote: "permits eligible members to withdraw up to 75% of their PF balance. This includes employee and employer contributions, subject to applicable conditions. The minimum service requirement has been standardised at 12 months."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "Auto-settlement ₹5 lakh"
  value: "₹5 lakh"
  quote: "EPFO increased the auto-settlement limit for eligible advance claims to ₹5 lakh."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "No cheque leaf / passbook upload"
  value: "cheque-leaf"
  quote: "EPFO removed the requirement to upload cheque-leaf images or attested bank passbooks for eligible online claims."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "VISHWAS 2026 online employer portal"
  value: "VISHWAS"
  value_note: "원문 소제목 VISHWAS, 2026 아래 문장"
  quote: "The scheme facilitates one-time settlement of eligible disputes involving damages or penalties under the EPF & Miscellaneous Provisions Act, 1952, and the Code on Social Security, 2020."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
  quote2: "Applications are submitted online through the EPFO Employer Portal."
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
- claim: "AMNESTY 2026 open until 28 December 2026"
  value: "28 December 2026"
  quote: "The scheme is open until 28 December 2026."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330727
