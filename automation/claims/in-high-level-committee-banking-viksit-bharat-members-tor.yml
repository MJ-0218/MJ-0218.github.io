- claim: "Committee constituted; purpose"
  value: "Viksit Bharat, 2047"
  quote: "The Government of India has constituted a High Level Committee on Banking for Viksit Bharat to undertake a review of India’s banking sector and recommend structural, institutional, regulatory and legislative reforms necessary to make it globally competitive, financially inclusive, and resilient for Viksit Bharat, 2047."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "Announced in Budget speech 2026-27"
  value: "2026-27"
  quote: "Union Minister of Finance and Corporate Affairs, Smt. Nirmala Sitharaman during her Budget speech 2026-27 had announced setting up of the Committee."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "Chair and members"
  value: "Suresh N. Patel"
  quote: "Shri Suresh N. Patel, former Central Vigilance Commissioner will be the Chairman of the Committee. Besides, three distinguished experts- Shri Shirish Chandra Murmu (Deputy Governor, Reserve Bank of India), Smt. Padmaja Chunduru (Former MD & CEO, Indian Bank) and Shri N S Vishwanathan (Former Deputy Governor, Reserve Bank of India) will be the members of the Committee."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "Member Secretary; tenure six months"
  value: "six months, 6 months"
  value_note: "원문 six months (카드 6 months)"
  quote: "The Joint Secretary (Banking), Department of Financial Services will be the Member Secretary of the Committee. The tenure of the Committee shall be six months."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "ToR practices, prudential norms"
  value: "prudential norms"
  quote: "Assess the present banking practices and prudential norms, identifying global best practices, and adapt them suitably for the Indian banking system, while also providing a roadmap for creating globally competitive banks."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "ToR RRB, co-op"
  value: "Regional Rural Banks"
  quote: "Review the existing regulatory and legal frameworks for banks, including Regional Rural Banks and Cooperative Banks, and suggest reforms to bring in efficiency and enable ease of doing banking for Viksit Bharat."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "ToR capital DFI NBFC"
  value: "Non-Banking Financial Companies"
  quote: "Undertake assessment of the long-term capital requirements for banks, including Development Financial Institutions and Non-Banking Financial Companies, with recommendations on funding sources and enabling mechanisms to support credit growth."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "ToR cost of capital; AI cyber; talent"
  value: "cyber risks"
  quote: "Prepare a roadmap for AI and digital innovation in banking institutions, while providing for safeguards against cyber risks. Further, to suggest a strategy for talent acquisition and capacity building to ensure a future-ready workforce for the banking sector."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
  quote2: "Examine differences in cost of capital for business, and suggest policy options to boost private investment for sustainable growth."
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
- claim: "ToR PSL, Lead Bank"
  value: "Priority Sector Lending"
  quote: "Review the Priority Sector Lending framework and Lead Bank Scheme to assess their relevance, effectiveness, and coordination in promoting inclusive, balanced, and data-driven credit delivery"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330598
