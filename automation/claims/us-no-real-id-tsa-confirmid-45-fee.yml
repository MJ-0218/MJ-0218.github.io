- claim: "Since May 2025 REAL ID required for domestic flights"
  value: "May 2025"
  quote: "Starting May 2025, U.S. travelers must be REAL ID compliant to board domestic flights and access certain federal facilities."
  source: https://www.tsa.gov/real-id
- claim: "Adults 18+ must show ID; list may change"
  value: "18 and older"
  quote: "Adult passengers 18 and older must show valid identification at the airport checkpoint in order to travel. The list of acceptable IDs is subject to change without notice."
  source: https://www.tsa.gov/travel/security-screening/identification
- claim: "Feb. 1, 2026 $45 ConfirmID"
  value: "Feb. 1, 2026, $45"
  value_note: "February 1, 2026 = Feb. 1, 2026"
  quote: "Starting February 1, 2026, if you are unable to provide the required acceptable form of ID at a TSA checkpoint, you will have the option to pay a $45 fee to use TSA ConfirmID."
  source: https://www.tsa.gov/travel/security-screening/identification
- claim: "Expired ID up to two years"
  value: "two years"
  quote: "TSA currently accepts expired ID up to two years after expiration, for the above listed forms of identification."
  source: https://www.tsa.gov/travel/security-screening/identification
- claim: "Children under 18 no ID"
  value: "under 18"
  quote: "TSA does not require children under 18 to provide identification when traveling within the United States."
  source: https://www.tsa.gov/travel/security-screening/identification
- claim: "Acceptable ID list items"
  value: "passport card, Global Entry"
  quote: "U.S. passport U.S. passport card DHS trusted traveler cards (Global Entry, NEXUS, SENTRI, FAST) U.S. Department of Defense ID, including IDs issued to dependents Permanent resident card"
  source: https://www.tsa.gov/travel/security-screening/identification
