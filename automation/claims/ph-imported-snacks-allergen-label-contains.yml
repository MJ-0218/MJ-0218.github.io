- claim: "FALCPA 8 major allergens"
  value: "milk, eggs, fish, shellfish, tree nuts, peanuts, wheat, soybeans"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "identified eight foods as major food allergens: milk, eggs, fish, Crustacean shellfish, tree nuts, peanuts, wheat, and soybeans."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Sesame 9th, Jan 1 2023"
  value: "sesame, 9th, January 1, 2023"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "declaring sesame as the 9th major food allergen recognized by the United States. The change was effective on January 1, 2023."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "In parentheses"
  value: "lecithin (soy), flour (wheat), whey (milk)"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "In parentheses following the name of the ingredient in the ingredient list. Examples: “lecithin (soy),” “flour (wheat),” and “whey (milk)”"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Contains statement"
  value: "Contains Wheat, Milk, and Soy"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Immediately after or next to the list of ingredients in a “contains” statement. Example: “Contains Wheat, Milk, and Soy.”"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Common name already identifies"
  value: "buttermilk, milk"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "This requirement is met if the common or usual name of an ingredient (e.g., buttermilk) that is a major food allergen already identifies that allergen’s food source name (i.e., milk)."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Some products may not list sesame"
  value: "sesame"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "you still may find food products for sale that don’t list sesame as an allergen on the label."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
