- claim: "Decorative lenses are medical devices; prescription details"
  value: "medical devices"
  quote: "Did you know that these decorative contact lenses are actually medical devices?"
  source: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
  quote2: "The prescription should include the brand name, correct lens measurements and expiration date."
  source2: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
- claim: "Where not to buy; infection signs"
  value: "street vendor"
  quote: "Never buy contact lenses from a street vendor, a beauty supply store, flea market, novelty store or Halloween store, or from unknown online distributors as they may be contaminated and/or counterfeit and therefore not safe to use."
  source: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
  quote2: "Redness, pain and discharge from the eyes are signs of an eye infection."
  source2: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
