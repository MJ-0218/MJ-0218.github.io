- claim: "10월 30일부터 8개 휴게소 입점업체 공개 모집"
  value: "10월 30일, 8개, 8곳"
  value_note: "원문 10월 30일부터 전국 8개 휴게소"
  quote: "10월 30일부터 전국 8개 휴게소의 직계약 시범사업에 참여할 입점업체를 공개 모집한다고 30일 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "직계약 정의, 수수료 33%→8~9%"
  value: "33%, 8~9%"
  value_note: "원문 33% 수준 / 8~9%(관리비 별도)"
  quote: "직계약은 중간 운영업체를 거치지 않고 도로공사가 직접 입점업체와 계약하는 방식으로, 기존 33% 수준이던 수수료를 8~9%(관리비 별도) 수준으로 대폭 낮춰 입점업체의 부담을 줄인다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "혜택: 2000원 이하 커피, 1+1, 통신사"
  value: "2000원"
  quote: "맛있고 품질 좋은 음식, 2000원 이하 커피, 편의점 1+1 할인행사, 통신사 할인·적립 등 다양한 가격·서비스 혜택을 선보일 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "대상 8곳, 10개 사업자"
  value: "10개, 10곳"
  value_note: "원문 10개 사업자"
  quote: "대상은 여주, 군위, 장유, 대천(상·하행), 월출산, 합천호(상·하행) 등 8개 휴게소로 식당·간식매장, 카페, 편의점을 운영할 10개 사업자를 모집한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "12월 초 선정, 내년 설 연휴"
  value: "12월 초, 설 연휴"
  value_note: "원문 12월 초 마무리 / 내년 설 연휴부터"
  quote: "사업자 선정은 12월 초 마무리하고, 시설개선과 영업준비를 거쳐 내년 설 연휴부터 달라진 휴게소 서비스를 선보일 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "여주 상생매장"
  value: "여주"
  quote: "이용객이 많은 여주 휴게소에는 지역 맛집과 청년창업 매장 등 상생매장을 별도 유치하여"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "입찰기준 ebid"
  value: "ebid.ex.co.kr"
  quote: "세부 입찰기준은 한국도로공사 전자조달 시스템( https://ebid.ex.co.kr/ )에서 확인할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
- claim: "퇴직자 단체 참여 금지, 감점, 3년 이내"
  value: "3년"
  quote: "퇴직자 단체가 설립한 법인에는 입찰 감점을 적용하고, 공고일 기준 최근 3년 이내 퇴직자 및 현직자의 이해관계자는 입찰 참가를 제한할 예정이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
  quote2: "이번 공개 모집에 한국도로공사 퇴직자 단체의 신규 휴게소 사업 참여는 금지한다."
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974638"
