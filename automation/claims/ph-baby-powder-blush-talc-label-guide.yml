- claim: "Potential for contamination; select mining sites, test ore"
  value: "potential"
  quote: "There is the potential for contamination of talc with asbestos and therefore, it is important to select talc mining sites carefully and take steps to test the ore sufficiently."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/talc
- claim: "FDA continued testing"
  value: "continued"
