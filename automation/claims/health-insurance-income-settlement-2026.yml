- claim: 추가 납부·환급 추산
  value: 394만 세대, 3조2911억 원, 232만 세대, 1조8014억 원
  quote: "소득이 늘어 보험료를 더 내야 하는 세대는 394만세대로 집계됐다. 이들이 추가로 낼 보험료는 3조2911억원으로 추산됐다. 반대로 소득이 줄어 보험료를 돌려받는 세대는 232만세대, 환급액은 1조8014억원으로 예상됐다"
  source: https://m.segye.com/view/20261020506484
  quote2: "보험료를 추가로 납부해야 하는 지역가입자는 394만 세대에 이를 것으로 전망된다. 금액도 3조3천억 원 가깝다. 반대로 232만 세대는 소득이 줄어 모두 1조8천억 원 이상을 돌려받을 것으로 보인다"
  source2: https://www.ekoreanews.co.kr/news/articleView.html?idxno=88725
  value_note: 정확한 금액은 세계일보, 이코리아는 반올림 표기로 일치
  secondary_ok: true
