- claim: 업무보고와 직권 정산 방식
  value: 20일, 국민건강보험공단, 국회 보건복지위원회, 주요 업무추진 현황, 국세청, 연 1회, 직권 정산
  quote: "20일 국민건강보험공단의 국회 보건복지위원회 국정감사 업무보고 자료 ‘주요 업무추진 현황’에 따르면 건강보험 당국은 보험료 부담의 공정성과 형평성을 높이기 위해 ‘전 국민 소득정산 제도’ 도입을 추진하고 있다. 국세청에서 전년도 확정 소득 자료를 넘겨받아 연 1회 행정기관이 직접 소득을 확인해 보험료를 정산하는 방식이다"
  source: https://m.segye.com/view/20261020506484
  quote2: "건강보험공단이 국세청으로부터 지역가입자의 종합소득세 신고 등으로 확정된 전년도 소득 자료를 넘겨받아 연 1회 정산하게 된다"
  source2: https://www.ekoreanews.co.kr/news/articleView.html?idxno=88725
  value_note: 원문 문구를 줄여 씀
  secondary_ok: true
