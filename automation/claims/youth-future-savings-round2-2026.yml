- claim: 가입심사와 사전심사·이의신청 일정
  value: 10월 19일, 11월 13일, 10월 30일, 11월 2일, 11월 2일 ~ 5일, 5일, 잠정
  quote: "신청자에 대한 가입심사는 이날부터 다음달 13일까지 진행된다. 금융위는 심사결과 확정 전에 신청자가 본인이 선택한 유형과 심사결과를 비교·확인할 수 있도록 오는 30일부터 다음달 2일까지(잠정) 사전심사 결과를 안내하고, 다음달 2~5일(잠정) 이의신청 기회도 부여할 예정이다"
  source: https://www.newspim.com/news/view/20261019001102
  quote2: "금융위는 심사 결과를 확정하기 전인 오는 30일부터 다음 달 2일까지 사전심사 결과를 안내해 신청자가 본인이 고른 유형과 심사 결과를 비교할 수 있도록 할 계획이다. 이의신청은 다음 달 2~5일 받는다. 두 일정 모두 잠정이다"
  source2: https://www.raonnews.com/news/article.html?no=62005
  value_note: 10월 19일 기사의 이날·다음달을 날짜로 풀어 씀
  secondary_ok: true
