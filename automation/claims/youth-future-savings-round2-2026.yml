- claim: 청년도약계좌 갈아타기 순서와 미완료 시
  value: 특별중도해지, 2개월
  quote: "계좌개설 기간 내 특별중도해지를 완료하지 않으면 청년미래적금에 납입할 수 없고 청년도약계좌는 그대로 유지된다. 이 경우 납입이 중지된 청년미래적금 계좌는 반드시 해지해야 하며, 해지 시점 기준 2개월 후부터 재신청이 가능하다"
  value_note: 원문 수치·문구를 줄여 씀
  source: https://www.newspim.com/news/view/20261019001102
  quote2: "계좌개설 기간 안에 특별중도해지를 마치지 못하면 청년미래적금 계좌에는 납입할 수 없고 청년도약계좌는 그대로 유지된다. 이 경우 납입이 중지된 청년미래적금 계좌는 반드시 해지해야 하며 해지 시점으로부터 2개월이 지나야 다시 신청할 수 있다"
  source2: https://www.raonnews.com/news/article.html?no=62005
  secondary_ok: true
