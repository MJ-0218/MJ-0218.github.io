- claim: 2차 신청 기간과 신청자 수, 누적
  value: 68만8000명, 10월 7일, 16일, 234만3000명, 281만9000명, 19일
  quote: "금융위원회는 지난 7일부터 16일까지 진행된 청년미래적금 2차 가입신청 기간에 총 68만8000명이 가입을 신청했다고 19일 밝혔다. 1차 가입기간 신청자 234만3000명과 합산하면 303만명이며, 중복을 제외한 누적 신청자는 281만9000명이다"
  source: https://www.newspim.com/news/view/20261019001102
  quote2: "1차 신청자 234만3000명과 합산하면 281만9000명(중복제외)이 신청했다"
  source2: https://www.mt.co.kr/index.php/amp/finance/2026/10/19/2026101914321344316
  value_note: 7일은 10월 7일(기사 작성 10월 19일)
  secondary_ok: true
