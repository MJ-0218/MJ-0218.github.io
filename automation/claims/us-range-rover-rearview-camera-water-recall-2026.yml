- claim: "Recall scope and defect"
  value: "2022-2026, 2022–2026"
  quote: "Land Rover) is recalling certain 2022-2026 Land Rover Range Rover vehicles. Water may not be able to drain away from the rearview camera due to insufficient drain holes, which may result in damage to the rearview camera."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LAND%20ROVER&model=RANGE%20ROVER&modelYear=2024"
- claim: "Consequence"
  value: "crash"
  quote: "A rearview camera image that does not display can reduce the driver's view behind the vehicle, increasing the risk of a crash."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LAND%20ROVER&model=RANGE%20ROVER&modelYear=2024"
- claim: "Remedy free; drain holes; inspect replace"
  value: "free of charge"
  quote: "Dealers will drill additional drain holes in the underside of the tailgate trim. Additionally, dealers will inspect and replace the rearview camera as necessary. Repairs will be performed free of charge."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LAND%20ROVER&model=RANGE%20ROVER&modelYear=2024"
- claim: "Letters Dec 11; contact; recall number"
  value: "Dec. 11, 2026, 800-637-6837, D171"
  value_note: "December 11, 2026"
  quote: "Interim letters notifying owners of the safety risk are expected to be mailed December 11, 2026. Additional letters will be sent once the final remedy is available. Owners may contact Land Rover's customer service at 800-637-6837. Land Rover's number for this recall is D171."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LAND%20ROVER&model=RANGE%20ROVER&modelYear=2024"
- claim: "Campaign number"
  value: "26V678000"
  quote: "\"NHTSACampaignNumber\":\"26V678000\""
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LAND%20ROVER&model=RANGE%20ROVER&modelYear=2024"
