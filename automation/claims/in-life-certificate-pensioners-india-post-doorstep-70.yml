- claim: "DoP + IPPB, DLC via Jeevan Pramaan, Goa from Nov 1 2026"
  value: "November 1, 2026"
  quote: "The Department of Posts, Goa Division, in collaboration with India Post Payments Bank (IPPB), will facilitate the submission of Digital Life Certificates (DLC) through the Jeevan Pramaan service across Goa from November 1, 2026."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "Covers Central, Goa State, EPFO pensioners"
  value: "EPFO"
  quote: "The facility will benefit Central Government, Goa State Government and EPFO pensioners"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "Nationwide DLC 5.0 campaign; post office; doorstep via postmen and GDS"
  value: "5.0"
  quote: "As part of the nationwide Digital Life Certificate 5.0 Campaign, pensioners can visit their nearest post office to complete the process. Those who are unable to travel, including pensioners living in remote areas, can avail themselves of the doorstep service through postmen and Gramin Dak Sevaks."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "Aadhaar biometric fingerprint/face; SMS; PDA"
  value: "fingerprint, face, SMS"
  value_note: "원문 fingerprints or face authentication / SMS confirmation"
  quote: "The Digital Life Certificate is generated through Aadhaar-based biometric authentication using fingerprints or face authentication. Once the verification is completed successfully, the certificate is generated digitally, and an SMS confirmation is sent to the pensioner. The certificate is then made available to the concerned Pension Disbursing Authority"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "₹70 incl. GST; no extra charge"
  value: "₹70, 70"
  quote: "The doorstep facility is available at a nominal charge of ₹70, inclusive of GST, per successfully generated certificate. No additional doorstep delivery charge is applicable."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "Booking options and Goa numbers"
  value: "9218302131, 9218302130"
  quote: "Post Info App: Register a request through the official Post Info mobile application. Phone booking: Contact India Post Payments Bank at the following numbers: North Goa: 9218302131 South Goa: 9218302130"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
- claim: "Documents to keep ready"
  value: "Aadhaar, mobile, PPO, bank"
  value_note: "원문 Aadhaar number, registered mobile number, PPO number or Pension ID, bank account details"
  quote: "Pensioners should keep their Aadhaar number, registered mobile number, Pension Payment Order (PPO) number or Pension ID, and bank account details ready while requesting the service."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329626
