- claim: "FDA does not approve cosmetics"
  value: "cosmetics"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The FDA doesn’t approve cosmetics. Cosmetics must be safe for their intended use and properly labeled."
  source: https://www.fda.gov/consumers/consumer-updates/it-really-fda-approved
- claim: "Exception color additives"
  value: "color additives, coal-tar hair dyes"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "There’s one exception: color additives (other than coal-tar hair dyes), which need to be approved by the FDA for their use."
  source: https://www.fda.gov/consumers/consumer-updates/it-really-fda-approved
- claim: "FDA does not approve supplements"
  value: "dietary supplements"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "By statute, the FDA does not approve dietary supplements for safety and effectiveness."
  source: https://www.fda.gov/consumers/consumer-updates/it-really-fda-approved
- claim: "Logo misuse"
  value: "logo, official government use"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The misuse of the FDA’s logo may violate federal law. The FDA’s logo is for official government use only."
  source: https://www.fda.gov/consumers/consumer-updates/it-really-fda-approved
- claim: "Logo not endorsement"
  value: "endorses"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The FDA’s logo should not be used to misrepresent the agency or to suggest that the FDA endorses any private organization, product, or service."
  source: https://www.fda.gov/consumers/consumer-updates/it-really-fda-approved
