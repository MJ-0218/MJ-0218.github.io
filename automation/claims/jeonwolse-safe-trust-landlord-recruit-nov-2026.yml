- claim: "11월 4일 첫 임대인 모집"
  value: "4일, 11월 4일"
  value_note: "원문 그대로"
  quote: "국토교통부와 주택도시보증공사는 4일 월세 물건을 전세로 전환해 임차인에게 공급하는 전월세 안심신탁 사업의 첫 임대인을 모집한다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "임대인·HUG·임차인 3자 계약"
  value: "3자"
  value_note: "원문 그대로"
  quote: "전월세 안심신탁 사업은 '임대인 - HUG - 임차인' 3자 간 계약을 체결하는 방식이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "주임법 적용, 증액 제한 5%"
  value: "5%"
  value_note: "원문 그대로"
  quote: "계약갱신청구권 및 임대료 증액 제한(5%), 대항력 등을 적용해 임차인의 안정적인 거주를 보장한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "약정 수익률 세전 연 4.35%"
  value: "4.35%, 연 4.35%"
  value_note: "원문 그대로"
  quote: "임대인은 모집 공고문에 따른 약정 수익률(이번 공고는 세전 연 4.35%)을 계약 기간에 HUG로부터 월세 형태로 달마다 지급받게 되므로"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "계약금 10%, 입주 때 90%"
  value: "10%, 90%"
  value_note: "원문 그대로"
  quote: "임차인은 계약금으로 예치금의 10%, 입주 때 나머지 90%를 나누어 HUG 전용 계좌에 납입한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "소득·자산 자격 제한 없음"
  value: "소득, 자산"
  value_note: "원문 그대로"
  quote: "임대인·임차인에 대해서는 소득·자산 등 신청 자격을 제한하지 않으나"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "주택가격 20억 원 이하, 선순위 부채비율 80% 이하"
  value: "20억 원, 80%"
  value_note: "원문 그대로"
  quote: "주택가격이 20억 원 이하여야 하고, 기존에 있던 선순위 부채비율이 주택가격의 80% 이하여야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "소득세·법인세 50% 감면, 농특세(20%) 비과세"
  value: "50%, 20%"
  value_note: "원문 그대로"
  quote: "소득세·법인세 50% 감면과 감면 세액에 대해 부과되는 농어촌특별세(세율 20%) 비과세 혜택을 지원한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "세제 혜택은 법 개정 필요 — 2028년 5월 신고 전까지 개정 계획"
  value: "2027년, 2028년 5월"
  value_note: "원문 그대로"
  quote: "2027년 발생한 임대소득은 2028년 5월에 신고됨을 감안하여, 신고기간 전까지 관련 법 개정을 완료할 계획입니다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "공실 시 최대 2개월 치 월 수익"
  value: "2개월"
  value_note: "원문 그대로"
  quote: "HUG가 최대 2개월 치 월 수익을 지급해 임대인은 연체·공실 리스크 없이 임대 운영을 할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "임차인 전용 전세대출, 버팀목 대출 연내 절차 완료 예정"
  value: "버팀목, 연내"
  value_note: "원문 그대로"
  quote: "소득·자산 등 요건 충족 대 주택기금의 버팀목 대출도 이용할 수 있게 연내 모든 절차를 완료할 예정이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "신청: 안심전세포털·HUG 지사 상시"
  value: "khug.or.kr/jeonse, 상시"
  value_note: "원문 그대로"
  quote: "안심전세포털(khug.or.kr/jeonse)과 전국 HUG 지사에서 사업 참여를 신청할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "내년 1월부터 순차 입주"
  value: "1월, 내년 1월"
  value_note: "원문 그대로"
  quote: "내년 1월부터 순차적으로 입주할 수 있으며"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "압류·경매에도 예치금 100% 반환"
  value: "100%"
  value_note: "원문 그대로"
  quote: "주택 압류, 경매 등이 발생해도 HUG가 100% 반환 가능합니다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
- claim: "공인중개사 중개로 체결"
  value: "공인중개사"
  value_note: "원문 그대로"
  quote: "법무법인 입회 하에 공인중개사의 중개를 통해 체결합니다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974991"
