- claim: "Áp dụng từ 15h ngày 22/10, liên Bộ Công Thương - Tài chính"
  value: "15h, 22/10"
  value_note: "Chiều 22/10 ... áp dụng từ 15h cùng ngày = từ 15h ngày 22/10"
  quote: "Chiều 22/10, liên Bộ Công Thương, Bộ Tài chính quyết định điều chỉnh giá bán lẻ xăng dầu, áp dụng từ 15h cùng ngày"
  source: https://dantri.com.vn/kinh-doanh/gia-xang-giam-manh-co-loai-giam-gan-2000-donglit-20261022142613733.htm
