- claim: "Unscented may contain fragrance to mask smell"
  value: "unscented"
  quote: "Even some products labeled “unscented” may contain fragrance ingredients. This is because the manufacturer may add just enough fragrance to mask the unpleasant smell of other ingredients"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Retail cosmetics need ingredient list; fragrance as Fragrance/Flavor; trade secrets"
  value: "Fragrance"
  quote: "fragrance and flavor ingredients can be listed simply as “Fragrance” or “Flavor.”"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "it must have a list of ingredients"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Fragrance in shampoos etc."
  value: "shampoos"
  quote: "Fragrance ingredients are also commonly used in other products, such as shampoos, shower gels, shaving creams, and body lotions."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Allergic for some; choose fragrance free; contact manufacturer"
  value: "fragrance free"
  quote: "you may want to choose products that are fragrance free, and check the ingredient list carefully"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "Some individuals may be allergic or sensitive to certain ingredients in cosmetics, food, or other products, even if those ingredients are safe for most people."
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
