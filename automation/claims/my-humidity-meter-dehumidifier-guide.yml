- claim: "Indoor humidity below 60%, ideally 30–50%"
  value: "60%, 30 and 50 percent, 30–50%"
  value_note: "60 percent = 60%; between 30 and 50 percent = 30–50%"
  quote: "If possible, keep indoor humidity below 60 percent (ideally between 30 and 50 percent) relative humidity."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Humidity meter is small and inexpensive, sold at hardware stores"
  value: "humidity meter"
  quote: "Relative humidity can be measured with a moisture or humidity meter, a small, inexpensive ($10-$50) instrument available at many hardware stores."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Key to mould control is moisture control"
  value: "moisture control"
  quote: "The key to mold control is moisture control."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Dry within 24–48 hours"
  value: "24–48 hours"
  value_note: "24-48 hours = 24–48 hours"
  quote: "It is important to dry water-damaged areas and items within 24-48 hours to prevent mold growth."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
- claim: "Use air conditioners and/or dehumidifiers when needed; fans/windows when showering and cooking"
  value: "air conditioners, dehumidifiers"
  quote: "Use air conditioners and/or de-humidifiers when needed.  Run the bathroom fan or open the window when showering."
  source: https://www.epa.gov/mold/brief-guide-mold-moisture-and-your-home
