- claim: "Applied to body to make attractive = cosmetic; perfume cologne aftershave"
  value: "Perfume Cologne Aftershave"
  quote: "If a product is intended to be applied to a person’s body to make the person more attractive, it’s a cosmetic under the law. Here are some examples of fragrance products that are regulated as cosmetics: Perfume Cologne Aftershave"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Drug claim examples"
  value: "Helping people sleep"
  quote: "Here are some examples of labeling statements that will cause a product containing fragrances to be treated as a drug: Easing muscle aches Soothing headaches Helping people sleep Treating colic"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "No definition for essential oils; plant ingredients same"
  value: "essential oils"
  quote: "There is no regulatory definition for “essential oils,”"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "The law treats Ingredients from plants the same as those from any other source."
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Massage oil cosmetic vs drug"
  value: "massage oil"
  quote: "a massage oil intended to lubricate the skin is a cosmetic. But if claims are made that a massage oil relieves aches or relaxes muscles, apart from the action of the massage itself, it’s a drug, or possibly both a cosmetic and a drug"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Not applied to body -> CPSC"
  value: "Consumer Product Safety Commission"
  quote: "Many other products that may contain fragrance ingredients, but are not applied to the body, are regulated by the Consumer Product Safety Commission ."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "Laundry detergents Fabric softeners Dryer sheets Room fresheners"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
