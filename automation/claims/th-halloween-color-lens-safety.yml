- claim: "เลนส์แฟชั่นเป็นเครื่องมือแพทย์"
  value: "เครื่องมือแพทย์"
  quote: "Did you know that these decorative contact lenses are actually medical devices?"
  source: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
- claim: "ความเสี่ยง และแหล่งซื้อที่ควรเลี่ยง"
  value: "ติดเชื้อ"
  quote: "These risks include: A cut or scratch on the top layer of your eyeball (Corneal Abrasion) Allergic reactions like itchy, watery red eyes Decreased vision Infection Blindness"
  source: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
  quote2: "Never buy contact lenses from a street vendor, a beauty supply store, flea market, novelty store or Halloween store, or from unknown online distributors as they may be contaminated and/or counterfeit and therefore not safe to use."
  source2: https://www.fda.gov/medical-devices/contact-lenses/decorative-contact-lenses-halloween-and-more
