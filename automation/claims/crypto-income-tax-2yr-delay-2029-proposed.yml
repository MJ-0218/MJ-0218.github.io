- claim: "11월 5일 브리핑, 내년 시행 예정 과세 2년 유예 국회 협의 추진"
  value: "5일, 11월 5일, 2년"
  value_note: "원문 그대로"
  quote: "이형일 부총리 겸 재정경제부 장관이 5일 정부서울청사에서 가상자산 소득과세 관련 브리핑을 열고, 내년부터 시행 예정인 가상자산 소득과세를 2년간 유예하는 방안을 국회와 협의해 추진하겠다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975124"
