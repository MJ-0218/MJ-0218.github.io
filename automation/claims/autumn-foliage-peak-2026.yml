- claim: "관광공사·국립수목원 2026 단풍지도, 대한민국 구석구석"
  value: "2026 단풍지도"
  quote: "한국관광공사는 산림청 국립수목원과 함께 전국 지역별 단풍 절정 시기와 가을 여행지를 담은 ‘2026 단풍지도’를 ‘대한민국 구석구석’ 누리집에 공개했다고 8일 밝혔다."
  source: https://www.wikitree.co.kr/articles/1164708
  quote2: "한국관광공사가 산림청 국립수목원과 함께 전국의 단풍 절정 시기와 주요 명소를 담은 '2026 단풍지도'를 '대한민국 구석구석' 누리집에 공개했다고 8일 밝혔다."
  source2: https://www.fnnews.com/news/202610080943468392
- claim: "6개 권역, 36곳"
  value: "6개 권역, 36곳"
  quote: "단풍지도에는 전국을 6개 권역으로 나눠 권역별 단풍 절정 시기를 안내하고, 가을철 여행지로 추천하는 전국 명소 36곳을 소개했다."
  source: https://www.fnnews.com/news/202610080943468392
  quote2: "이번 지도에는 전국 6개 권역의 단풍 절정 예상 시기와 함께 가을 정취를 즐길 수 있는 여행지 36곳이 담겼다."
  source2: https://www.wikitree.co.kr/articles/1164708
