- claim: "Often contain formaldehyde aka formalin, methylene glycol"
  value: "formaldehyde, formalin, methylene glycol"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "These products often contain formaldehyde, also known as formalin and methylene glycol."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Poor ventilation: both inhale"
  value: "ventilated, inhaling"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If the salon is not properly ventilated, both the salon professionals and their clients are at risk of inhaling the released formaldehyde."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Colorless strong-smelling gas hazard"
  value: "colorless, lungs, eyes, skin"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Formaldehyde is a colorless, strong-smelling gas that presents a health hazard when breathed into the lungs, or when it gets into the eyes or onto the skin."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Reported reactions"
  value: "eye, headaches, dizziness, throat, cough, wheezing, nausea, chest pain, vomiting, rash"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Possible reactions that have been reported include eye problems or irritation, nervous system problems (for example, headaches and dizziness), respiratory tract problems (sore or scratchy throat, cough, wheezing), nausea, chest pain, vomiting, and rash."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Repeated contact sensitization"
  value: "skin sensitization, allergic dermatitis"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Skin sensitization or allergic dermatitis can develop after repeated contact with formaldehyde-related ingredients."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Label words"
  value: "Formaldehyde, Formalin, Methylene glycol"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "To identify products containing formaldehyde-related ingredients, look for: Formaldehyde Formalin Methylene glycol"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "No list: do not buy"
  value: "do not purchase"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If it doesn't, we recommend that you do not purchase the product."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Ask salon"
  value: "salon professionals"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Ask your salon professionals if they know whether a product contains formaldehyde-related ingredients."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Report to provider and FDA"
  value: "healthcare provider, FDA"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "please report your symptoms to your healthcare provider, as well as to FDA."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
