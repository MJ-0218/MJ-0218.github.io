- claim: "중량·경량 모두 49dB 이하로 강화"
  value: "49데시벨, 49dB"
  value_note: "원문 그대로"
  quote: "다세대주택과 오피스텔 등의 층간소음 차단 기준이 중량충격음과 경량충격음 모두 49데시벨(dB) 이하로 강화된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975109"
- claim: "현행 중량 50dB, 경량 58dB"
