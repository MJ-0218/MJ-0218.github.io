  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975109"
- claim: "행정예고 11월 6일~26일"
  value: "11월 6일, 26일"
  value_note: "원문 그대로"
  quote: "'소음방지를 위한 층간 바닥충격음 차단구조기준' 일부개정안을 11월 6일부터 26일까지 행정예고한다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975109"
- claim: "건축법 대상 건축물 기준 강화(주택법 공동주택 대비 낮았음)"
  value: "건축법, 주택법"
  value_note: "원문 그대로"
  quote: "개정안은 그동안 주택법 적용 공동주택과 비교해 상대적으로 기준이 낮은 건축법 대상 건축물의 바닥충격음 차단 성능 기준을 강화하고, 완충재의 품질과 시공관리 기준을 함께 정비하는 내용을 담고 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975109"
- claim: "인정바닥구조·표준바닥구조 선택 유지"
  value: "인정바닥구조, 표준바닥구조"
  value_note: "원문 그대로"
  quote: "기준 강화에 따른 건축주 부담 등을 고려하여 인정바닥구조와 표준바닥구조 중 선택하여 적용할 수 있는 현행 체계를 유지할 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975109"
