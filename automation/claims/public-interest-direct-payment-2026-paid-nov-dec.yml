- claim: "농외소득 기준 3700만→4700만"
  value: "3700만 원, 4700만 원"
  value_note: "원문 그대로"
  quote: "기본형 공익직불금 지급을 제한하는 농업 외 종합소득금액 기준이 3700만 원에서 4700만 원으로 상향돼"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "11월 중순부터 총 2조 3788억 원"
  value: "2조 3788억, 11월 중순, 2026년"
  value_note: "원문 그대로"
  quote: "농림축산식품부는 2026년 기본형 공익직불금 지급대상과 금액을 확정하고, 11월 중순부터 총 2조 3788억 원을 순차적으로 지급한다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "129만 6000건, 작년 128만 5000건, 1만 1000건 증가"
  value: "129만 6000건, 128만 5000건, 1만 1000건"
  value_note: "원문 그대로"
  quote: "올해 지급대상은 농가, 농업인, 농업법인 등 129만 6000건으로, 지난해 128만 5000건보다 1만 1000건 증가했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "소농 54만 4000농가 7061억, 면적 75만 2000건 1조 6727억"
  value: "54만 4000, 7061억, 75만 2000, 1조 6727억"
  value_note: "원문 그대로"
  quote: "소농직불금은 54만 4000농가에 7061억 원, 면적직불금은 75만 2000건에 1조 6727억 원이 지급된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "17년 만 상향, 이달 13일 시행, 올해 등록신청자부터"
  value: "17년, 13일"
  value_note: "원문 그대로"
  quote: "해당 기준을 17년 만에 상향했다. 개정 기준은 이달 13일부터 시행되며, 올해 면적직불금 등록신청자부터 적용된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "지급면적 104만 5000→103만 2000㏊, 총액 2조 3843억보다 55억 감소"
  value: "104만 5000㏊, 103만 2000㏊, 2조 3843억, 55억"
  value_note: "원문 그대로"
  quote: "전체 지급면적은 지난해 104만 5000㏊보다 1만 3000㏊ 감소했다. 지급 총액도 지난해 2조 3843억 원보다 55억 원 줄었다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "133만 2000건 검증, 3만 6000건 제외"
  value: "133만 2000건, 3만 6000건"
  value_note: "원문 그대로"
  quote: "지난 3~5월 접수한 133만 2000건을 대상으로"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "3만 6000건 제외"
  value: "3만 6000건"
  value_note: "원문 그대로"
  quote: "그 결과 약 3만 6000건을 지급대상에서 제외했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "16개 준수사항, 1만 7255건 감액, 약 32억"
  value: "16개, 1만 7255건, 32억"
  value_note: "원문 그대로"
  quote: "16개 준수사항에 대한 이행점검도 실시했다. 준수사항 위반에 따른 감액 대상은 1만 7255건이며, 감액금액은 약 32억 원이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
- claim: "13일까지 교부, 11월 중순~12월 말 지급, 입금일 지방정부별 상이"
  value: "13일, 12월 말"
  value_note: "원문 그대로"
  quote: "농식품부는 오는 13일까지 지방정부에 지급자금을 교부할 계획이다. 이후 지방정부가 지급대상자와 계좌정보 등을 확인해 11월 중순부터 12월 말까지 직불금을 지급한다. 실제 입금일은 지방정부별 지급 일정에 따라 달라질 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975563"
