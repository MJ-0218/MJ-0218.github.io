- claim: COLA amount and reach
  value: 3.6 percent, 3.6%, 76 million
  quote: Social Security and Supplemental Security Income (SSI) benefits for 76 million Americans will increase 3.6 percent in 2027.
  value_note: 3.6 percent written as 3.6%
  source: https://www.ssa.gov/cola/
  source2: https://www.fool.com/retirement/2026/10/18/2027-social-security-cola-boost-average-benefit/
  quote2: The 2027 annual cost-of-living adjustment (COLA) is officially 3.6%
- claim: Social Security start date
  value: January 2027, nearly 72 million, 72 million
  quote: The 3.6 percent cost-of-living adjustment (COLA) will begin with benefits payable to nearly 72 million Social Security beneficiaries in January 2027.
  value_note: summarized
  source: https://www.ssa.gov/cola/
- claim: SSI start date
  value: December 31, 2026, Dec. 31, 2026, 7.3 million
  quote: Increased payments to about 7.3 million SSI recipients will begin on December 31, 2026.
  value_note: Dec. abbreviation
  source: https://www.ssa.gov/cola/
- claim: Taxable maximum
  value: $192,300
  quote: The maximum amount of earnings subject to the Social Security tax (taxable maximum) will increase to $192,300.
  source: https://www.ssa.gov/cola/
- claim: Earnings limit under FRA
  value: $25,560, $1, $2
  quote: The earnings limit for workers who are younger than full retirement age (see Full Retirement Age Chart) will increase to $25,560. (We deduct $1 from benefits for each $2 earned over $25,560.)
  value_note: summarized
  source: https://www.ssa.gov/cola/
- claim: Earnings limit in FRA year
  value: $67,920, $1, $3
  quote: The earnings limit for people reaching their full retirement age in 2027 will increase to $67,920. (We deduct $1 from benefits for each $3 earned over $67,920 until the month before the worker turns full retirement age.)
  value_note: summarized
  source: https://www.ssa.gov/cola/
- claim: No limit at FRA
  value: no limit
  quote: There is no limit on earnings for workers who are full retirement age or older for the entire year.
  source: https://www.ssa.gov/cola/
- claim: Notice timing
  value: late November 2026, November 2026
  quote: In late November 2026, Social Security COLA notices will be available online to most beneficiaries in the Message Center of their my Social Security account.
  source: https://www.ssa.gov/cola/
- claim: Account creation cutoff
  value: November 18, 2026, Nov. 18, 2026
  quote: if they created their account by November 18, 2026.
  value_note: Nov. abbreviation
  source: https://www.ssa.gov/cola/
- claim: Scam warning
  value: wire transfers or gift cards
  quote: No government agency or reputable company will solicit your personal information or request advanced fees for services in the form of wire transfers or gift cards.
  source: https://www.ssa.gov/cola/
- claim: Example raise
  value: $2,000, $72, $2,072, $1,500, $54, $1,554
  derived: $2,000 x 3.6% = $72 -> $2,072; $1,500 x 3.6% = $54 -> $1,554 (before any Medicare premium deduction)
