- claim: "No waterproof sunscreen; water resistant labels state 40 or 80 minutes"
  value: "40 minutes or 80 minutes, 40 or 80 minutes"
  quote: "Products labeled as water resistant are also required to state on their labels whether the sunscreen remains effective for 40 minutes or 80 minutes when swimming or sweating."
  source: https://www.fda.gov/drugs/understanding-over-counter-medicines/sunscreen-how-help-protect-your-skin-sun
- claim: "Broad spectrum SPF 15 or higher; SPF not related to time"
  value: "SPF 15, 15 times"
  quote: "Use broad spectrum sunscreens with sun protection factor (SPF) values of 15 or higher regularly and as directed."
