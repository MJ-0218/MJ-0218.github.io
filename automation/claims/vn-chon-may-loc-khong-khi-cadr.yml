- claim: "CADR đủ lớn; càng cao càng rộng"
  value: "CADR"
  quote: "To filter particles, choose a portable air cleaner that has a clean air delivery rate (CADR) that is large enough for the size of the room or area in which you will use it ."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
  quote2: "The higher the CADR, the more particles the air cleaner can filter and the larger the area it can serve."
  source2: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "Bảng diện tích"
  value: "100, 200, 300, 400, 65, 130, 195, 260"
  value_note: "Room area (square feet) / Minimum CADR (cfm)"
  quote: "Room area (square feet) 100 200 300 400 500 600 Minimum CADR (cfm) 65 130 195 260 325 390"
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "Trần 8 feet"
  value: "8 feet"
  value_note: "8-foot ceiling"
  quote: "The CADRs are calculated based on an 8-foot ceiling."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "Tránh ozone; HEPA"
  value: "ozone, HEPA"
  quote: "Avoid portable air cleaners and furnace/HVAC filters that intentionally produce ozone. Ozone is a lung irritant."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
  quote2: "Portable air cleaners often achieve a high CADR by using a high-efficiency particulate air (HEPA) filter."
  source2: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "Đổi ft² sang m²"
  value: "9 m², 19 m², 28 m², 37 m²"
  derived: "1 ft² = 0,0929 m²: 100→9,3; 200→18,6; 300→27,9; 400→37,2"
