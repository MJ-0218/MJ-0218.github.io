- claim: "3일 국무회의 시행령 개정안 의결"
  value: "3일, 11월 3일"
  value_note: "기사 2026.11.03 '3일 국무회의' → 11월 3일"
  quote: "보건복지부는 3일 국무회의에서 이 같은 내용의 '장애인·노인·임산부 등의 편의증진 보장에 관한 법률 시행령' 개정안이 의결됐다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974885"
- claim: "가정위탁 보호자 주차표지 발급 대상 포함"
  value: "가정위탁"
  quote: "이번 개정으로 보행상 장애가 있는 아동을 가정위탁하는 보호자도 발급 대상에 포함했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974885"
- claim: "기존엔 민법상 가족 등으로 한정"
  value: "민법상 가족"
  quote: "기존에는 장애인전용주차구역 보호자용 주차표지를 받을 수 있는 보호자가 민법상 가족 등으로 한정돼 가정위탁 장애아동을 양육하는 보호자는 제외됐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974885"
- claim: "주·야간보호 재가노인복지시설·장기요양기관 추가"
  value: "주·야간보호"
  quote: "주차표지를 발급받을 수 있는 시설에는 '노인복지법'에 따른 주·야간보호서비스 제공 재가노인복지시설과 '노인장기요양보험법'에 따른 주·야간보호서비스 제공 장기요양기관이 추가됐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974885"
- claim: "노인의료복지시설·경로당 영유아 거치대 의무 제외 가능"
  value: "경로당"
  quote: "개정안에 따라 '노인복지법'에 따른 노인의료복지시설과 경로당은 시설 특성을 고려해 거치대 설치 의무를 적용하지 않을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974885"
