- claim: "Smoothing: solution + heat; often contains formaldehyde"
  value: "heat, formaldehyde"
  quote: "A hair straightening or smoothing solution is usually applied to human hair followed by a heat treatment that seals the solution in. These products often contain formaldehyde, also known as formalin and methylene glycol."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Heated: released as gas; ventilation"
  value: "gas, ventilated"
  quote: "When the solution is heated, the formaldehyde in the products is released into the air as a gas. If the salon is not properly ventilated, both the salon professionals and their clients are at risk of inhaling the released formaldehyde."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Look for formaldehyde, formalin, methylene glycol"
  value: "formalin, methylene glycol"
  quote: "To identify products containing formaldehyde-related ingredients, look for: Formaldehyde Formalin Methylene glycol"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Ask your salon professional"
  value: "salon professional"
  quote: "Ask your salon professionals if they know whether a product contains formaldehyde-related ingredients. If they are unsure if formaldehyde is present, you may not want to use the product, especially if you have had a reaction in the past."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "OSHA requires SDS"
  value: "Safety Data Sheet"
  quote: "requires products with hazardous chemicals to have a Safety Data Sheet (SDS)"
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "NCI: >0.1 ppm effects: watery eyes, burning, coughing"
  value: "0.1 ppm, 0,1 ppm, watery eyes"
  quote: "when formaldehyde is present in the air at levels exceeding 0.1 ppm, some individuals may experience adverse effects such as watery eyes; burning sensations in the eyes, nose, and throat, coughing, wheezing, nausea, and skin irritation."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Sensitivity varies"
  value: "sensitive"
  quote: "Some people are very sensitive to formaldehyde, whereas others have no reaction to the same level of exposure."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
- claim: "Retail products must list ingredients; if not, don't buy"
  value: "ingredients, label"
  quote: "If you're purchasing a product on a retail basis, whether at a store or by mail order, including on the Internet, the product is required to have a list of the ingredients. If it doesn't, we recommend that you do not purchase the product."
  source: https://www.fda.gov/cosmetics/cosmetic-products/hair-smoothing-products-release-formaldehyde-when-heated
