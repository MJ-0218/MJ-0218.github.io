- claim: "Cyclone Arnab hit AP & Odisha coast; rain, floods, tree falls, power disruptions"
  value: "Cyclone Arnab"
  quote: "after Cyclone Arnab hit along the coast of Andhra Pradesh and Odisha. Widespread heavy rainfall, flash floods, tree falls and power infrastructure disruptions affected telecom services across parts of Andhra Pradesh, Odisha and adjoining regions."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "ICR definition"
  value: "Intra Circle Roaming"
  quote: "Intra Circle Roaming (ICR) is a telecom arrangement where a mobile subscriber connects to another operator’s (TSP’s) network within the same telecom circle (region). This allows users to access mobile services even if their own operator (TSP) has no coverage in that specific area."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "DoT instructs ICR during disasters"
  value: "DoT issues instructions"
  quote: "During the time of disaster, if mobile infrastructure is damaged in a region, DoT issues instructions to Telecom Service Providers to implement ICR."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "ICR operational irrespective of provider"
  value: "irrespective"
  quote: "Intra-Circle Roaming (ICR) remains operational across affected districts to facilitate connectivity for subscribers, irrespective of their service provider."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "Steps: automatic network selection; manual select"
  value: "Automatic Network Selection"
  quote: "Keep \"Automatic Network Selection\" enabled in your phone settings. If automatic connection fails; Go to Settings > Mobile Networks > Network Operators Manually select another available network"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "AP availability 99.18, WG 98.5, Konaseema 91.96"
  value: "99.18%, 98.5%, 91.96%"
  value_note: "원문 99.18 percent / 98.5 per cent / 91.96 per cent"
  quote: "In Andhra Pradesh, overall telecom network availability has reached 99.18 percent. Among the affected districts, network availability stands at 98.5 per cent in West Godavari, 91.96 per cent in Dr. B. R. Ambedkar Konaseema."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "Power & OFC cuts; 11 COWs"
  value: "11"
  value_note: "원문 11 Cell on Wheels (quote2)"
  quote: "Commercial power supply disruptions and localised Optical Fibre Cable (OFC) cuts are the primary factors affecting network operations."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
  quote2: "Additionally, 11 Cell on Wheels (COWs) have been deployed to strengthen emergency communication services."
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "Odisha districts improving"
  value: "Ganjam, Gajapati and Kandhamal"
  quote: "In Odisha, following Cyclone ARNAB, the telecom network situation in Ganjam, Gajapati and Kandhamal districts has been gradually improving with the easing of rainfall and receding of floodwaters."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
- claim: "DoT X handle"
  value: "DoT_India"
  quote: "https://x.com/DoT_India"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330702
