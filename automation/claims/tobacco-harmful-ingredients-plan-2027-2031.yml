- claim: "29일 확정, 제1차(2027~2031)"
  value: "29일, 2027~2031, 제1차"
  value_note: "원문 지난 29일 / 제1차 담배 유해성 관리 기본계획(2027~2031)"
  quote: "보건복지부와 식품의약품안전처는 지난 29일 담배유해성관리정책위원회 심의를 거쳐 이 같은 내용을 담은 '제1차 담배 유해성 관리 기본계획(2027~2031)'을 확정·발표했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "2025년 11월 법 시행 후 첫 5년 계획"
  value: "2025년 11월, 5년"
  value_note: "원문 2025년 11월 ... 시행 / 5년 단위"
  quote: "이번 기본계획은 2025년 11월 '담배의 유해성 관리에 관한 법률' 시행 이후 처음 수립한 5년 단위 중장기계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "70종 발암물질, 7000종 화학물질, 6만 8536명"
  value: "70종, 7000종, 6만 8536명, 2023년"
  value_note: "원문 70종 이상 / 7000종 이상 / 2023년 기준 6만 8536명"
  quote: "담배 연기에는 70종 이상의 발암물질과 7000종 이상의 화학물질이 포함돼 있다. 2023년 기준 국내에서 직접 흡연으로 인한 사망자는 6만 8536명"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "흡연율 20.3→17.9, 전체 21.6→22.1"
  value: "20.3%, 17.9%, 21.6%, 22.1%, 2019년, 2025년"
  value_note: "원문 2019년 20.3%에서 2025년 17.9% / 21.6%에서 22.1%"
  quote: "궐련 흡연율은 2019년 20.3%에서 2025년 17.9%로 감소했으나, 전자담배 등을 포함한 전체 담배제품 현재사용률은 같은 기간 21.6%에서 22.1%로 큰 변화가 없었다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "성인 사용률 남 36.3 여 8.6"
  value: "36.3%, 8.6%"
  value_note: "원문 남성 36.3%, 여성 8.6%"
  quote: "2025년 기준 성인 담배제품 현재사용률은 남성 36.3%, 여성 8.6%다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "검사 항목 44→50여, 20→30여, 2030"
  value: "44종, 50여 종, 20종, 30여 종, 2030년"
  value_note: "원문 2025년 44종에서 2030년 50여 종 / 20종에서 30여 종"
  quote: "궐련과 궐련형 전자담배의 검사 항목은 2025년 44종에서 2030년 50여 종으로, 액상형 전자담배는 20종에서 30여 종으로 늘린다. 현재 검사대상에 포함되지 않은 무연담배와 엽궐련, 물담배 등도 새롭게 검사대상에 포함한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "사용 용도 제출, 불시 점검, 첨가물 단계적 금지 검토"
  value: "사용 용도"
  quote: "앞으로는 각 성분의 사용 용도까지 제출하도록 범위를 확대한다. 제출자료에 대한 무작위 불시 현장점검을 실시해"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
  quote2: "특정 성분의 사용을 단계적으로 금지하기 위한 개선방안을 검토한다."
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "신규 제품 검사 판매 후 1개월, 최대 17개월 단축"
  value: "1개월, 17개월, 6개월"
  value_note: "원문 판매 개시일의 다음 연도 개시 후 6개월 이내 → 판매 개시 후 1개월 이내 / 최대 17개월"
  quote: "현행 규정인 판매 개시일의 다음 연도 개시 후 6개월 이내에서 판매 개시 후 1개월 이내로 변경해 검사 의뢰 시기를 최대 17개월 단축할 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
- claim: "정보공개 방안, 관리대상 2029 확대"
  value: "2029년"
  quote: "관리대상은 2026년 궐련과 궐련형·액상형 전자담배에서 2029년 무연담배와 시가 등 기타 담배까지 확대한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
  quote2: "정부는 담배 유해성분에 대한 정보공개 방안을 마련하고"
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974626"
