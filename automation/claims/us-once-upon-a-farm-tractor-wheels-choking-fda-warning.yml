- claim: "Do not buy or serve; choking hazard"
  value: "choking hazard"
  quote: "The FDA is warning consumers not to buy or serve Once Upon A Farm Tractor Wheels Organic, Toddler Soft-Baked Bars due to a potentially fatal choking hazard."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "All flavors, lots, dates"
  value: "all lot codes"
  quote: "This advice applies to all flavors, quantities, and varieties, including all lot codes and expiration dates."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Ages 1.5-2.5, airway obstruction"
  value: "1.5–2.5, 1.5 to 2.5"
  value_note: "원문 ages 1.5–2.5 years"
  quote: "The FDA has received several reports that describe toddlers (ages 1.5–2.5 years) suffering complete airway obstruction with the inability to breathe after consuming the product."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Dry sticky mass; back blows Heimlich may fail; ER"
  value: "Heimlich"
  quote: "When chewed, the product reportedly forms a dry, sticky mass that standard choking interventions — including back blows and the Heimlich maneuver — may fail to dislodge. Some reported choking incidents have required emergency response intervention and hospital observation."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Call 911; retailers should not sell"
  value: "911"
  value_note: "원문 Call 9-1-1"
  quote: "Retailers should not sell this product."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
  quote2: "Call 9-1-1 in the event that someone is choking and other first aid measures to dislodge the obstruction have failed."
  source2: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Stores"
  value: "Costco, Target, Walmart"
  value_note: "원문 Costco, Target, and Walmart"
  quote: "This product is sold nationwide online and at stores, including Costco, Target, and Walmart. This product may be sold elsewhere, such as Amazon.com and other third-party vendors."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Firm agreed to recall; update"
  value: "recall"
  quote: "The FDA has informed the firm of reports of adverse events and the firm has agreed to initiate a recall."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Symptoms contact provider; report"
  value: "health care provider"
  quote: "Consumers who have symptoms should contact their health care provider to report their symptoms and receive care."
  source: https://www.fda.gov/food/alerts-advisories-safety-information/fda-advises-consumers-not-buy-or-serve-once-upon-farm-tractor-wheels-organic-toddler-soft-baked-bars
- claim: "Date Oct 30 2026"
  value: "Oct. 30, 2026"
  value_note: "원문 Current Update October 30, 2026"
  quote: "Current Update October 30, 2026"
