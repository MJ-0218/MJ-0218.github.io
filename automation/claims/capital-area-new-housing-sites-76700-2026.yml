- claim: "6곳 7만6700호, 기존 2만7200호, 총 10만3900호"
  value: "6곳, 7만6700호, 2만7200호, 10만3900호, 3곳"
  quote: "정부가 수도권 6곳에 7만 6700호 규모의 신규택지를 추가로 조성한다. 앞서 발표한 2만 7200호를 더하면 수도권 신규 공공택지는 총 10만 3900호 규모다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
- claim: "서울 경계 5㎞, 2030년 착공, 청년·신혼부부"
  value: "5㎞, 2030년"
  quote: "서울 경계에서 약 5㎞ 이내의 입지를 중심으로 선정했으며, '공공택지 최단기 착공모델'을 적용해 2030년 안에 착공하는 것을 목표로 청년·신혼부부 등 실수요자에게 주택을 신속히 공급할 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
- claim: "10월 29일 8·13 대책 후속 발표"
  value: "10월 29일, 8·13"
  value_note: "29일, 2026.10.29"
  quote: "국토교통부는 29일 '주택 신속 공급방안(8·13 대책)' 후속조치로 수도권 신규택지 후보지 6곳, 7만 6700호를 추가 발표했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
- claim: "8·13 10만 호, 앞서 3곳"
  value: "10만 호, 서울강서, 남양주도심, 경기광주역세권2"
  quote: "정부는 8·13 대책을 통해 신규 공공주택지구 지정으로 총 10만 호 규모의 주택을 공급하겠다는 계획을 밝힌 바 있다. 이 가운데 서울강서·남양주도심·경기광주역세권2 등 3곳, 2만 7200호는 앞서 발표했으며"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
- claim: "김포아라 3만7000호, 5호선 연장"
  value: "3만7000호, 5호선"
  quote: "가장 규모가 큰 김포아라에는 3만 7000호를 공급한다. 서울 강서구와 인접하고 한강변에 위치해 주택 수요가 높은 지역으로, 인근에서는 지하철 5호선 연장사업이 추진 중이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
- claim: "구리건원 1만4600호, 잠실 30분대"
  value: "1만4600호, 30분대"
  quote: "구리건원에는 1만 4600호를 공급한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
  quote2: "수도권 제1순환고속도로와 인접하고 잠실역까지 30분대 이동이 가능하다."
  source2: "https://www.korea.kr/news/policyNewsView.do?newsId=148974548"
