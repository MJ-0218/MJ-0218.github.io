- claim: "Source control and ventilation first; filtration supplement"
  value: "ventilate"
  quote: "The most effective ways to improve your indoor air are to reduce or remove the sources of pollutants and to ventilate with clean outdoor air."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "Filters for particles or gases; activated carbon"
  value: "activated carbon"
  quote: "Note that most filters are designed to filter either particles or gases."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
  quote2: "To filter gases, choose a portable air cleaner with an activated carbon filter or other filter designed to remove gases ."
  source2: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "CADR particles only; carbon needs large amount"
  value: "CADR"
  quote: "The CADR rating system is for particles only. Activated carbon filters can be effective, provided that there is a large amount of material used in the filter."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
- claim: "HEPA; avoid ozone"
  value: "HEPA, ozone"
  quote: "Portable air cleaners often achieve a high CADR by using a high-efficiency particulate air (HEPA) filter."
  source: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
  quote2: "Avoid portable air cleaners and furnace/HVAC filters that intentionally produce ozone. Ozone is a lung irritant."
  source2: https://www.epa.gov/indoor-air-quality-iaq/guide-air-cleaners-home
