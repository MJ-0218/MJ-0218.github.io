- claim: "5th campaign, 2000 cities/districts, Nov 1-30, 2026"
  value: "1 से 30 नवंबर 2026, 2000, 5वां, 1–30 नवंबर, 5.0"
  value_note: "원문 5 th Nation-wide ... in 2000 cities/ Districts ... from November 1-30, 2026 (제목 Campaign 5)"
  quote: "will be conducting the 5 th Nation-wide Digital Life Certificate campaign in 2000 cities/ Districts across India from November 1-30, 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "O.M. dated 13 August 2026"
  value: "13 अगस्त 2026"
  value_note: "원문 O.M. dated 13 th August, 2026"
  quote: "The department has notified the guidelines through O.M. dated 13 th August, 2026."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Biggest ever"
  value: "biggest-ever"
  value_note: "본문 सबसे बड़ा"
  quote: "This is the biggest-ever DLC Campaign undertaken."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Partners"
  value: "Pension Disbursing Banks"
  quote: "coordination with Pension Disbursing Banks, India Post Payments Bank, Pensioners’ Welfare Associations, CGDA, DoT, Railways, EPFO, State Governments, UIDAI & MeitY with the objective of reaching pensioners in the remotest corners of the country"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Face authentication focus; MeitY/UIDAI support"
  value: "Face Authentication"
  quote: "The focus is majorly on promoting Face Authentication Technology. Ministry of Electronics and Information Technology and UIDAI will provide technical support during this Campaign."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Android and iOS"
  value: "Android as well as iOS"
  quote: "Face Authentication for Digital Life Certificate is a seamless and fast mode for DLC generation which can be used on Android as well as iOS, making it easy and convenient for elderly Pensioners."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Utsav mode, health check-ups, Aadhaar, doorstep"
  value: "Utsav"
  quote: "The Campaign will be conducted in an ‘Utsav’ mode by offering a bouquet of services such as such as Health Check-ups, Aadhar updation for pensioners. Doorstep services will be provided to pensioners where required."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Grievance officers"
  value: "Grievance officers"
  quote: "Grievance officers will handle grievances regarding DLCs with an immediate resolution approach."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "Mega camps with senior officials"
  value: "Mega Camps"
  quote: "Mega Camps will be held by stakeholders in areas having high concentration of pensioners and these Mega Camps will be attended by Senior officials from DPPW."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
- claim: "DD, AIR, PIB; #DLCCampaign5"
  value: "#DLCCampaign5"
  quote: "DD, AIR and PIB teams are actively geared up to provide full support to this campaign for Audio, Visual and Print publicity. Outreach efforts will be further complemented by SMSs, tweets (#DLCCampaign5)"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330361
