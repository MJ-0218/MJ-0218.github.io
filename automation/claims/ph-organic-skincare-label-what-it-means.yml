- claim: "FDA has no definition of organic"
  value: "organic"
  quote: "The term “organic” is not defined in either of these laws or the regulations that FDA enforces under their authority."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
- claim: "USDA National Organic Program defines and certifies; % labeling"
  value: "National Organic Program"
  quote: "The Agricultural Marketing Service of the U.S. Department of Agriculture (USDA) oversees the National Organic Program (NOP)."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
  quote2: "They also include labeling standards based on the percentage of organic ingredients in a product."
  source2: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
- claim: "Organic cosmetics must meet both USDA and FDA rules"
  value: "both"
  quote: "Cosmetic products labeled with organic claims must comply with both USDA regulations for the organic claim and FDA regulations for labeling and safety requirements for cosmetics."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
- claim: "Organic not safer; plants can be toxic or allergenic"
  value: "source"
  quote: "An ingredient’s source does not determine its safety. For example, many plants, whether or not they are organically grown, contain substances that may be toxic or allergenic."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
- claim: "Same safety requirement for all"
  value: "same safety requirement"
  quote: "all cosmetic products and ingredients are subject to the same safety requirement: They must be safe for consumers under labeled or customary conditions of use"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/organic-cosmetics
