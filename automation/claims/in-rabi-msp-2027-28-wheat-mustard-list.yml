- claim: "Approved 30 Sep 2026 for RMS 2027-28"
  value: "30 September 2026, 2027-28"
  value_note: "원문 Marketing Season 2027-28 on 30 September 2026"
  quote: "The government approved an increase in the Minimum Support Prices (MSP) for all mandated Rabi Crops for Marketing Season 2027-28 on 30 September 2026."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "MSP table"
  value: "2,610, 2,585, 25, 2,286, 2,150, 136, 5,958, 5,875, 83, 7,390, 7,000, 390, 6,613, 6,200, 413, 7,215, 6,540, 675"
  value_note: "원문 표 (MSP 2027-28, MSP 2026-27, Increase)"
  quote: "1 Wheat 2,610 1,264 106 2,585 25 2 Barley 2,286 1,447 58 2,150 136 3 Gram 5,958 3,751 59 5,875 83 4 Lentil (Masur) 7,390 3,854 92 7,000 390 5 Rapeseed & Mustard 6,613 3,367 96 6,200 413 6 Safflower 7,215 4,810 50 6,540 675"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "Margins"
  value: "106%, 96%, 92%, 59%, 58%, 50%"
  value_note: "원문 표 Margin Over Cost (%) 열: 106, 58, 59, 92, 96, 50"
  quote: "In terms of returns over the cost of production, wheat records the highest estimated margin at 106%, followed by rapeseed and mustard at 96%, lentil (masur) at 92%, and gram at 59%."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "Highest increases"
  value: "₹675, ₹413, ₹390, ₹136"
  value_note: "원문 ₹ 675 / ₹ 413 / ₹ 390 / ₹ 136 per quintal"
  quote: "The highest absolute increase in MSP has been announced for safflower at ₹ 675 per quintal . This is followed by rapeseed & mustard at ₹ 413 per quintal , lentil (masur) at ₹ 390 per quintal, and barley at ₹ 136 per quintal ."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "Card rupee wheat"
  value: "₹2,610, ₹25, ₹2,585, ₹6,613, ₹7,390"
  value_note: "원문 표 Wheat 2,610 / 2,585 / 25, Mustard 6,613, Masur 7,390"
  quote: "1 Wheat 2,610 1,264 106 2,585 25"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "50% minimum margin"
  value: "50%"
  value_note: "원문 50 percent"
  quote: "The MSP decisions for Rabi Marketing Season (RMS) 2027-28 continue to provide for a minimum margin of 50 percent over the cost of production."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "₹90,962 crore, 324 LMT"
  value: "₹90,962 crore, 324 lakh"
  value_note: "원문 ₹ 90,962 crore / 324 lakh metric tonnes"
  quote: "During the Rabi Marketing Season (RMS) 2027-28, an estimated ₹ 90,962 crore is expected to be paid to farmers for 324 lakh metric tonnes (MT) of produce."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "FCI; PSS PM-AASHA NAFED NCCF"
  value: "FCI, NAFED, NCCF"
  value_note: "원문 문장"
  quote: "Procurement of pulses, oilseeds and copra is undertaken under the Price Support Scheme (PSS) of the Pradhan Mantri Annadata Aay Sanrakshan Abhiyan (PM-AASHA). State Governments may request procurement when prevailing market prices fall below the announced MSP."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "Registration details, centre, date"
  value: "Aadhaar, land records, bank account"
  value_note: "원문 문장"
  quote: "Farmers register by providing details such as Aadhaar, land records, bank account information, and crop particulars. Registered farmers can select their nearest procurement centre, following which the portal schedules their visit for a specified date."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "Biometric mandatory 2025-26"
  value: "2025-26"
  quote: "biometric authentication of farmers became mandatory under PSS from the 2025–26 season. Authentication is conducted through Aadhaar-enabled Point of Sale (PoS) machines or facial authentication before procurement."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
- claim: "FAQ standards and publicised centres"
  value: "Fair Average Quality"
  quote: "State Governments and procurement agencies publicising procurement schedules, centre locations and Fair Average Quality (FAQ) specifications for eligible produce."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329868
