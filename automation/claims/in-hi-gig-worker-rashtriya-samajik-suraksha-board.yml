- claim: "Ministry notified constitution of the Board"
  value: "अधिसूचना"
  value_note: "원문 has notified the official constitution"
  quote: "the Ministry of Labour & Employment has notified the official constitution of the National Social Security Board"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Release date 30 Oct 2026"
  value: "30 अक्टूबर 2026"
  value_note: "원문 Posted On: 30 OCT 2026"
  quote: "30 OCT 2026 10:29AM by PIB Delhi"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Under the Code on Social Security"
  value: "Code on Social Security"
  quote: "Established under the statutory framework of the Code on Social Security"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Chaired by Union Labour Minister; members"
  value: "Union Minister for Labour & Employment"
  value_note: "본문 केंद्रीय श्रम एवं रोज़गार मंत्री"
  quote: "The Boards will be presided over by the Union Minister for Labour & Employment and comprise representatives from Central and State Governments, prominent aggregator companies, employers, civil society organizations, workers' unions and gig"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Meets at least thrice a year"
  value: "at least thrice a year"
  value_note: "본문 साल में कम से कम तीन बार"
  quote: "shall meet at least thrice a year and shall observe rules of procedure relating to the transaction of business at its meetings, as prescribed by the Central Government"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Recommend schemes"
  value: "recommend"
  quote: "recommend to the Central Government for framing suitable schemes for different sections of unorganised workers, gig workers and platform workers"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Monitor schemes"
  value: "monitor"
  quote: "monitor such social welfare schemes for unorganised workers, gig workers and platform workers as are administered by the Central Government"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Review record keeping"
  value: "record keeping"
  quote: "review the record keeping functions performed at the State level"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
- claim: "Review expenditure"
  value: "fund and account"
  quote: "review the expenditure from the fund and account"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330299
