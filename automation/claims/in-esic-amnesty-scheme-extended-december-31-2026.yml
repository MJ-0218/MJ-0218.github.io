- claim: "Original period, 3-month extension to 31.12.2026, same terms"
  value: "1 October 2025, 30 September 2026, three months, 1 October 2026, 31 December 2026, same"
  value_note: "원문 01.10.2025 to 30.09.2026 / three months i.e from 01.10.2026 to 31.12.2026, on existing terms and conditions"
  quote: "has extended the ‘New Amnesty Scheme, 2025’ which ran from 01.10.2025 to 30.09.2026, for a further period of three months i.e from 01.10.2026 to 31.12.2026, on existing terms and conditions."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "Card 31 Dec 2026, 3 months"
  value: "31 Dec 2026, 3 months, 31.03.2025"
  value_note: "원문 31.12.2026 / three months / 31.03.2025"
  quote: "Court cases filed up to 31.03.2025 are eligible under this scheme."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "One-time, backlog, erstwhile ESI Act"
  value: "one-time"
  quote: "The ‘New Amnesty Scheme 2025’ is a one-time dispute resolution initiative aimed at reducing the backlog of court cases and promoting compliance under the erstwhile ESI Act."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "Ad-hoc: no damages"
  value: "no damages"
  quote: "Settlement of ad-hoc assessments by paying actual contributions and interest—no damages will be levied."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "10% of disputed damages"
  value: "10%"
  quote: "Withdrawal of cases where employers have already paid dues, subject to payment of 10% of disputed damages."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "Records/delay cases withdrawn with court permission"
  value: "court permission"
  quote: "Cases filed by ESIC for non-submission of records or delayed payments, which were later complied with, will also be withdrawn with court permission."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "Employers and IPs additional time; closes 31.12.2026"
  value: "31 December 2026"
  value_note: "원문 31.12.2026"
  quote: "All concerned stakeholders are encouraged to make use of the extended window before it closes on 31.12.2026."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
- claim: "Representations reviewed"
  value: "representations"
  quote: "Post review of representations from various stakeholders"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329854
