- claim: "Recall date, units, recall number"
  value: "Oct. 22, 2026, 3,332, 27-040"
  value_note: "October 22, 2026; About 3,332"
  quote: "Recall Date: October 22, 2026 Units: About 3,332"
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
  quote2: "Recall number: 27-040"
  source2: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "Hazard: no passive restraint, slip through, entrapped or fall"
  value: "passive restraint"
  quote: "they do not contain a passive restraint system and a child can slip through the opening between the feeding tray and seat and become entrapped or fall, posing a risk of serious injury or death"
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "Description and colors, no tracking info"
  value: "purple and white"
  quote: "This recall involves Costway high chairs designed to convert into a table and chair set. They were available in several color combinations, including purple and white, red and white, blue and white, and brown and white. There is no tracking information located on the products."
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "Sold at, dates, price"
  value: "May 2023, July 2026, $84, $100"
  quote: "Sold At: Walmart and Target stores nationwide and online at Costway.com from May 2023 through July 2026 for between $84 and $100."
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "Remedy: free replacement, receipt/photo, prepaid label"
  value: "free replacement"
  quote: "Consumers should immediately stop using the recalled high chairs and contact Costway for a free replacement high chair. Consumers will be asked to provide a receipt or a photo of the product and will receive a prepaid label to return the recalled product to Costway."
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
  quote2: "Incidents/Injuries: None reported"
  source2: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "Contact"
  value: "844-242-1885, 9 a.m., 5 p.m."
  quote: "Contact Costway toll-free at 844-242-1885 from 9 a.m. to 5 p.m. PT Monday through Friday, email at recall@costway.com"
  source: https://www.cpsc.gov/Recalls/2027/Costway-Recalls-Convertible-High-Chairs-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapment-and-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "bbluv warning"
  value: "bblüv Grow"
  quote: "The high chairs violate the mandatory safety standard for high chairs because the restraint systems were not preassembled to the products, posing deadly fall and entrapment hazards. CPSC urges consumers to stop using the high chairs immediately and dispose of them."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-bbluv-High-Chairs-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapmentand-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
  quote2: "bblüv Group has not agreed to an acceptable corrective action plan for these high chairs."
  source2: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-bbluv-High-Chairs-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapmentand-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
- claim: "bbluv description"
  value: "four wooden legs"
  quote: "The high chairs have a gray plastic molded bucket-style seat with a matching fabric seat cover, a gray plastic tray and four wooden legs."
  source: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-bbluv-High-Chairs-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapmentand-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
  quote2: "The bblüv logo is printed in white on the front edge of the tray."
  source2: https://www.cpsc.gov/Warnings/2027/CPSC-Warns-Consumers-to-Stop-Using-bbluv-High-Chairs-Immediately-Due-to-Risk-of-Serious-Injury-or-Death-from-Entrapmentand-Fall-Hazards-Violate-Mandatory-Standard-for-High-Chairs
