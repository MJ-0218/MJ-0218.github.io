- claim: "No federal definition; means what company wants"
  value: "hypoallergenic"
  quote: "There are no Federal standards or definitions that govern the use of the term \"hypoallergenic.\" The term means whatever a particular company wants it to mean."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/hypoallergenic-cosmetics
- claim: "No substantiation; dermatologists"
  value: "hypoallergenic"
  quote: "Manufacturers of cosmetics labeled as hypoallergenic are not required to submit substantiation of their hypoallergenicity claims to FDA."
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/hypoallergenic-cosmetics
  quote2: "dermatologists say it has very little meaning"
  source2: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/hypoallergenic-cosmetics
- claim: "No nonallergenic cosmetic"
  value: "nonallergenic"
  quote: "there is no such thing as a \"nonallergenic\" cosmetic--that is, a cosmetic that can be guaranteed never to produce an allergic reaction"
  source: https://www.fda.gov/cosmetics/cosmetics-labeling-claims/hypoallergenic-cosmetics
- claim: "Unscented may contain fragrance"
  value: "unscented"
  quote: "Even some products labeled “unscented” may contain fragrance ingredients. This is because the manufacturer may add just enough fragrance to mask the unpleasant smell of other ingredients"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Listed as Fragrance/Flavor; trade secrets"
  value: "Fragrance"
  quote: "fragrance and flavor ingredients can be listed simply as “Fragrance” or “Flavor.”"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "they are the kinds of cosmetic components that are most likely to be “trade secrets.”"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Contact manufacturer"
  value: "manufacturer"
  quote: "If consumers have questions, they may choose to contact the manufacturer directly."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
