- claim: "내년 1월 31일까지 2개월 연장"
  value: "1월 31일, 2개월"
  value_note: "원문 그대로"
  quote: "현재 시행 중인 수송용 유류세 인하 조치를 내년 1월 31일까지 2개월 연장한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "12월 1일~2027년 1월 31일, 휘발유 15%·경유·부탄 25%"
  value: "12월 1일, 2027년 1월 31일, 15%, 25%, 2027년"
  value_note: "원문 그대로"
  quote: "12월 1일부터 2027년 1월 31일까지 휘발유는 15%, 경유와 부탄은 각각 25%의 유류세 인하율이 적용된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "리터당 인하액 122·145·51원 (부가세 10% 포함)"
  value: "122원, 145원, 51원, 10%"
  value_note: "원문 그대로"
  quote: "부가가치세 10%를 포함한 리터(ℓ)당 유류세 인하액은 휘발유 122원, 경유 145원, 부탄 51원이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "탄력세율 820→698, 581→436, 203→152"
  value: "820원, 698원, 581원, 436원, 203원, 152원"
  value_note: "원문 그대로"
  quote: "유종별 탄력세율은 휘발유가 인하 전 820원에서 698원으로, 경유는 581원에서 436원으로, 부탄은 203원에서 152원으로 낮아진다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "경유·부탄 25% 이유"
  value: "생계형"
  value_note: "원문 그대로"
  quote: "산업·물류 활동에 필수적인 경유와 소형트럭 등 생계형 차량의 연료로 활용되는 부탄에 대해서는 상대적으로 높은 25%의 인하율을 유지해"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "시행령 개정안 국무회의 상정 등 절차 거쳐 시행 계획"
  value: "국무회의"
  value_note: "원문 그대로"
  quote: "'교통·에너지·환경세법 시행령'과 '개별소비세법 시행령' 개정안을 국무회의에 상정하는 등 관련 절차를 거쳐 시행할 계획이다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "2021년 11월 처음 시행"
  value: "2021년 11월, 2021년"
  value_note: "원문 그대로"
  quote: "유류세 인하 조치는 2021년 11월 처음 시행된 이후 국제유가와 국내 경제 여건 등을 고려해 인하율을 조정하며 연장돼 왔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975482"
- claim: "중동전쟁 불확실성·고유가"
