- claim: 구간별 지급액과 4월 시행
  value: 내년 4월, 4월, 하위 30%, 38만 원, 3만 원, 30~45%, 35만9천 원, 45~70%, 35만 원
  quote: "개편안이 시행되면 소득 하위 30%에 해당하는 노인은 현재보다 3만원 늘어난 월 38만원을 받는다. 하위 30~45% 구간에는 물가 상승분을 반영한 35만9천원이 지급되며, 하위 45~70%는 기존과 같은 35만원이 유지된다"
  source: https://www.kyeonggi.com/article/20261019580082
  quote2: "내년 4월부터 기초연금이 소득에 따라 다르게 지급된다. 보건복지부의 2027년 기초연금 개편안에 따르면 소득 하위 30%는 월 38만원, 30∼45%는 35만9000원, 45∼70%는 35만원을 받는다"
  source2: https://m.segye.com/view/20261019509137
  value_note: 35만9000원을 35만9천 원으로 표기
  secondary_ok: true
- claim: 부부 감액 완화
  value: 20%, 10%, 56만 원, 68만4천 원, 12만4천 원, 8만6천 원, 64만6천 원, 하위 45%
  quote: "현행 제도에서는 부부가 각각 연금을 수령할 경우 개인별 지급액의 20%를 일괄 감액하고 있다. 정부는 이 가운데 소득 하위 45%에 속하는 부부의 감액률을 10%로 낮추기로 했다. 이에 따라 소득 하위 30% 부부의 월 합산 수령액은 기존 56만원에서 68만4천원으로 12만4천원 증가한다. 하위 30~45% 부부 역시 현재보다 8만6천원 많은 64만6천원을 받게 될 전망이다"
  source: https://www.kyeonggi.com/article/20261019580082
  quote2: "소득 하위 30% 부부는 한 달 56만원에서 68만4000원으로 12만4000원, 30∼45% 부부는 64만6000원으로 8만6000원을 더 받게 된다. 45∼70% 부부는 지금처럼 20% 감액이 그대로 남는다"
  source2: https://m.segye.com/view/20261019509137
  value_note: 원문 수치를 천 원 단위로 표기
  secondary_ok: true
