- claim: "10일 발표, 찾아드림 서비스 도입"
  value: "10일, 11월 10일"
  value_note: "원문 그대로"
  quote: "기후에너지환경부는 '에너지바우처 찾아드림 서비스'를 새롭게 도입한다며 10일 이같이 전했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "올해 144만 가구, 5042억 원"
  value: "144만, 5042억"
  value_note: "원문 그대로"
  quote: "올해 지원 가구 수를 144만 가구로 전년보다 4만 가구 확대하고 예산도 5042억 원으로 227억 원 늘렸다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "찾아드림: 상담원 연락, 공무원 재신청 처리, 방문 불필요"
  value: "찾아드림"
  value_note: "원문 그대로"
  quote: "이 서비스는 상담원이 대상자에게 직접 연락해 담당 공무원이 재신청을 처리하게 해 수급자는 행정복지센터를 방문하지 않아도 바우처를 다시 사용할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "대상 내년 3월까지 중단 2만 5000여 가구"
  value: "2만 5000, 2만 5000가구, 3월"
  value_note: "원문 그대로"
  quote: "내년 3월까지 바우처 사용이 중단된 2만 5000여 가구를 대상으로 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "이사·세대원 변경 중단"
  value: "이사"
  value_note: "원문 그대로"
  quote: "이사나 세대원 수 변경 등으로 에너지바우처 지원이 중단됐으나"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "사전 현금 지급: 쪽방촌·고시원, 500가구 우선"
  value: "500가구"
  value_note: "원문 그대로"
  quote: "쪽방촌, 고시원 등 월세에 에너지비용이 포함돼 있어 직접 바우처 사용이 어려운 가구를 대상으로 동절기 전에 미리 난방비를 현금으로 지급한다. 이달부터 사전에 신청한 500가구를 대상으로 우선 시행한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "찾아가는 서비스: 작년 5만 9000가구 99억, 올해 최대 12만 2000가구"
  value: "5만 9000, 99억, 12만 2000, 50%"
  value_note: "원문 그대로"
  quote: "지난해 전액 미사용 가구 5만 9000가구를 방문해 99억 원의 바우처 사용을 지원했고 올해는 50% 미만 사용 가구까지 범위를 넓혀 최대 12만 2000가구를 방문한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "집배원·사회복지사 방문"
  value: "집배원"
  value_note: "원문 그대로"
  quote: "집배원과 사회복지사 등이 직접 방문해 바우처 사용을 돕는"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "등유·LPG 21만 가구 14만 7000원, 36만 7000→51만 4000"
  value: "21만, 14만 7000원, 36만 7000원, 51만 4000원"
  value_note: "원문 그대로"
  quote: "등유·액화석유가스 사용 21만 가구에 대해서는 14만 7000원 상당의 추가 바우처를 지원한다. 이에 따라 해당 가구의 에너지바우처 지원금은 평균 36만 7000원에서 51만 4000원으로 늘어난다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "다음 달 9일부터 국민행복카드 지급"
  value: "9일, 12월 9일"
  value_note: "기사일 11월 10일 기준 '다음 달 9일' = 12월 9일"
  quote: "추가 지원금은 다음 달 9일부터 국민행복카드를 통해 지급할 예정이며 기존 별도 선불카드 발급 방식을 국민행복카드로 통합해 이용 편의성도 높인다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "가스 5월까지 유예, 전기 12월~내년 2월 제한 해제"
  value: "5월, 12월, 2월"
  value_note: "원문 그대로"
  quote: "도시가스 요금을 미납하더라도 지난달부터 시작해 5월까지 공급중단을 유예하고, 12월부터 내년 2월까지 전기 사용 제한을 해제한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975389"
- claim: "작년 체납 전기요금 바우처 잔액으로 납부"
