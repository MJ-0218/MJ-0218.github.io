  value_note: "원문 '44회에서 48회로', '40회에서 45회로'"
  quote: "특히 장기요양 1·2등급 중증 어르신의 재가급여 월 한도액은 시설급여 월 최대 이용료의 100% 수준까지 오른다. 이에 따라 3시간 방문요양은 1등급 수급자가 월 최대 44회에서 48회로, 2등급 수급자가 40회에서 45회로 이용 횟수가 늘어난다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974757"
