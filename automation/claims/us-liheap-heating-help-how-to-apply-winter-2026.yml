- claim: "What LIHEAP covers"
  value: "home energy bills, energy crises, weatherization, minor energy-related home repairs"
  value_note: "원문 문장 그대로의 항목 나열"
  quote: "LIHEAP provides federally funded assistance to reduce the costs associated with home energy bills, energy crises, weatherization, and minor energy-related home repairs."
  source: "https://www.acf.hhs.gov/ocs/low-income-home-energy-assistance-program-liheap"
- claim: "Heating assistance uses"
  value: "preventing energy shutoffs, reconnecting services, repairing or replacing heating equipment"
  value_note: "원문 나열 중 일부"
  quote: "providing assistance with home heating bills, preventing energy shutoffs, reconnecting services, making homes more energy efficient, and repairing or replacing heating equipment"
  source: "https://www.acf.hhs.gov/ocs/low-income-home-energy-assistance-program-liheap"
- claim: "NEAR number"
  value: "1-866-674-6327"
  quote: "National Energy Assistance Referral (NEAR) number at 1-866-674-6327"
  source: "https://www.acf.hhs.gov/ocs/low-income-home-energy-assistance-program-liheap"
- claim: "No direct grants, no fee; fraud hotline"
  value: "1-800-447-8477"
  quote: "LIHEAP does not provide direct grants to individuals; LIHEAP does not charge a fee for receiving a benefit. If you receive a message offering you a LIHEAP grant or requesting a fee, please contact the U.S. Department of Health and Human Services (HHS) Fraud Hotline at 1-800-447-8477."
  source: "https://www.acf.hhs.gov/ocs/low-income-home-energy-assistance-program-liheap"
- claim: "Income ceiling 150% FPG or 60% SMI"
  value: "150%, 60%"
  value_note: "원문 150 percent / 60 percent 를 %로 표기"
  quote: "an amount equal to 150 percent of FPG for the state; or an amount equal to 60 percent of the SMI for the state"
  source: "https://acf.gov/ocs/policy-guidance/liheap-im2025-02-federal-poverty-guidelines-and-state-median-income-estimates"
- claim: "Floor 110% FPG; priority"
  value: "110%"
  value_note: "원문 110 percent"
  quote: "may not exclude from eligibility solely on the basis of household income which falls below 110 percent of FPG for such state — though grant recipients may give priority to those households with the highest home energy costs or needs"
  source: "https://acf.gov/ocs/policy-guidance/liheap-im2025-02-federal-poverty-guidelines-and-state-median-income-estimates"
- claim: "Income-based, state requirements, apply steps"
  value: "every state and territory has its own requirements"
  quote: "Eligibility for LIHEAP is based on your income. However, every state and territory has its own requirements."
  source: "https://www.benefits.gov/benefit/623"
- claim: "Online or in person"
  value: "online, in person"
  value_note: "원문 submit ... online / apply in person"
  quote: "In some cases, you may be able to submit your LIHEAP application online. Other LIHEAP offices may require you to apply in person."
  source: "https://www.benefits.gov/benefit/623"
- claim: "WAP TANF SSI"
  value: "TANF, SSI"
  value_note: "원문 Temporary Assistance for Needy Families (TANF), Supplemental Security Income (SSI)"
  quote: "Or you may qualify if you already receive benefits through a federal assistance program such as: Temporary Assistance for Needy Families (TANF) Supplemental Security Income (SSI)"
  source: "https://www.benefits.gov/benefit/623"
- claim: "Disconnect policies"
  value: "weather, age, disability, utility provider"
  value_note: "원문 이어지는 목록: current weather, your age, disability, utility provider"
  quote: "Each state has a different policy about when utility companies can and cannot disconnect your electricity or natural gas for non-payment. These policies may be based on: The current weather in your area Your age If you have a disability Which utility provider you have"
  source: "https://www.benefits.gov/benefit/623"
