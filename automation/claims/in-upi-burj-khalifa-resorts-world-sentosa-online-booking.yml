- claim: "UPI online bookings At the Top Burj Khalifa, first UAE attraction, NEOPAY & Emaar"
  value: "At the Top, Burj Khalifa"
  quote: "For the UAE, in partnership with NEOPAY and Emaar Entertainment, UPI acceptance is enabled for At the Top, Burj Khalifa, marking the first UAE attraction to implement UPI for e-commerce."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "Singapore FOMO Pay RWS; 1.2 million Indian visitors 2025"
  value: "1.2 million"
  quote: "For Singapore, in collaboration with FOMO Pay, a leading payment institution, UPI acceptance is expanded to Resorts World Sentosa, a significant step that follows the Singapore market welcoming 1.2 million Indian visitors in 2025."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "RWS attractions"
  value: "Universal Studios Singapore"
  quote: "iconic Resorts World Sentosa attractions, including Universal Studios Singapore, the Singapore Oceanarium and Adventure Cove Waterpark"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "NIPL dates 29 July / 9 September 2026"
  value: "29 July 2026, 9 September 2026"
  value_note: "원문 29th July 2026 and 9th September 2026"
  quote: "announced its strategic partnerships with the UAE and Singapore on 29th July 2026 and 9th September 2026 respectively"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "Ten countries list; Uzbekistan 11th, 30 Aug 2026"
  value: "ten countries, 11th, 30 August 2026, 10 countries"
  value_note: "원문 ten countries / 11th / 30th August 2026"
  quote: "UPI is accepted in ten countries Singapore, the United Arab Emirates, France, Mauritius, Nepal, Bhutan, Qatar, Sri Lanka, Cambodia and Greece, enabling Indian travellers to make seamless payments abroad through UPI. Uzbekistan is set to become the 11th on the list, following a commercial agreement announced on 30th August 2026"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "Eiffel Tower 26 January 2024"
  value: "26 January 2024"
  value_note: "원문 26th January 2024"
  quote: "The ticketing facility for the Eiffel Tower via India’s Unified Payments Interface (UPI) was launched on 26th January 2024."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
- claim: "Removes currency friction"
  value: "currency friction"
  quote: "removing currency friction and making international travel planning and experience simpler"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2330558
