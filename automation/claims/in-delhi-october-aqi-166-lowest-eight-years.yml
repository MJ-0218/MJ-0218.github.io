- claim: "October AQI by year"
  value: "166, 223, 234, 219, 210, 173, 265, 269, 2026, 2025, 2024, 2023, 2022, 2021, 2020, 2019, 2018"
  value_note: "원문 연도별 10월 평균 AQI"
  quote: "The monthly average AQI of Delhi for October in 2026 is recorded as 166, against the monthly average AQI for October as 223 in 2025, 234 in 2024, 219 in 2023, 210 in 2022, 173 in 2021, 265 in 2020, 234 in 2019 and 269 in 2018, respectively."
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "Jan-Oct AQI 167 vs 170"
  value: "167, 170, 1 January, 31 October 2026"
  value_note: "원문 01-Jan to 31-Oct"
  quote: "The average AQI of Delhi for the period 01-Jan to 31-Oct is recorded as 167, against the average AQI of 170 in 2025"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "PM2.5 69 vs 72; PM10 171 vs 166"
  value: "69 µg/m³, 72 µg/m³, 171 µg/m³, 166 µg/m³, 29 Oct"
  value_note: "원문 01-Jan to 29-Oct"
  quote: "The average PM2.5 concentrations for period 01-Jan to 29-Oct is recorded as 69 µg/m³, against the average concentration of 72 µg/m³ in 2025"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
  quote2: "The average PM10 concentrations for period 01-Jan to 29-Oct is recorded as 171 µg/m³, against the average concentration of 166 µg/m³ in 2025"
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "220 good days vs 200; 84 poor days vs 104"
  value: "220, 200, 84, 104"
  quote: "The period (January – October) in 2026 witnessed 220 'Good to Moderate' category days (daily average AQI less than 200), against the number of such days being 200 in 2025"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
  quote2: "witnessed 84 ‘Poor to Severe+’ category days (daily average AQI more than 200), against the number of such days being 104 in 2025"
  source2: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "CAQM efforts intensified"
  value: "intensified"
  quote: "CAQM is working closely with various stakeholders concerned to take effective measures for prevention, control and abatement of air pollution and to improve the air quality in Delhi-NCR. These efforts would be intensified"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "Lowest in eight years (title)"
  value: "eight years"
  quote: "Delhi Records Lowest Average AQI for October in the Last Eight Years at 166"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2331032
- claim: "Release date"
  value: "31 Oct 2026"
  quote: "31 OCT 2026 9:22PM by PIB Delhi"
