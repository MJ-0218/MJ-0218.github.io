- claim: "Color alone not freshness"
  value: "color"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "color alone is not an indicator of freshness."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Smell fresh and mild"
  value: "fishy, sour, ammonia"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Fish should smell fresh and mild, not fishy, sour, or ammonia-like."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Eyes clear and shiny"
  value: "eyes"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "A fish’s eyes should be clear and shiny."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Firm flesh red gills"
  value: "gills"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Whole fish should have firm flesh and red gills with no odor."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Flesh springs back"
  value: "spring back"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The flesh should spring back when pressed."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Shrimp clear pearl-like"
  value: "pearl-like"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Shrimp, scallop, and lobster flesh should be clear with a pearl-like color and little or no odor."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Discard cracked shells"
  value: "cracked, broken"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Throw away clams, oysters, and mussels if their shells are cracked or broken."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Tap test"
  value: "tap"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Live clams, oysters, and mussels will close when the shell is tapped. If they don’t close when tapped, do not select them."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Crab leg movement"
  value: "leg movement"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Live crabs and lobsters should show some leg movement."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Doneness signs"
  value: "opaque, shells open"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Shrimp, Scallops, Crab, and Lobster: The flesh becomes firm, pearly, and opaque Clams, Mussels, and Oysters: The shells open during cooking — throw out ones that don’t open"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
- claim: "Spoiled odors do not eat"
  value: "ammonia"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If you smell sour, rancid, or fishy odors in raw or cooked seafood, do not eat it."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-fresh-and-frozen-seafood-safely
