- claim: "왕갈비·고사리를 짬뽕에, 국물에 고기 풍미"
  value: "고사리, 왕갈비"
  value_note: "위키트리 + bnt"
  quote: "한식에서 익숙한 왕갈비와 고사리를 중식 대표 음식인 짬뽕에 접목한 것이 특징이다."
  source: "https://www.wikitree.co.kr/articles/1174063"
  quote2: "얼큰한 국물에 갈비를 함께 끓여내면서 고기의 풍미가 국물에 스며든다. 면과 건더기를 함께 먹을 수 있어 한 그릇만으로도 든든한 식사가 완성된다."
  source2: "https://www.bntnews.co.kr/article/view/bnt202611120241"
  secondary_ok: true
