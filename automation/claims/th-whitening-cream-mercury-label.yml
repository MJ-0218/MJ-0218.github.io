- claim: "FDA: avoid creams, soaps, lotions with mercury"
  value: "skin creams, soaps, lotions, mercury"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "cautions that you should avoid skin creams, beauty and antiseptic soaps, and lotions that contain mercury."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Marketed as skin lighteners / anti-aging"
  value: "skin lighteners, anti-aging, age spots, freckles"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The products are usually marketed as skin lighteners and anti-aging treatments that remove age spots, freckles, blemishes, and wrinkles."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Teens may use as acne treatments"
  value: "acne"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Adolescents may use these products as acne treatments."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Label words that mean mercury; stop using"
  value: "mercurous chloride, calomel, mercuric, mercurio, mercury"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If the words “mercurous chloride,” “calomel,” “mercuric,” “mercurio,” or “mercury” are listed on the label, mercury’ is in it—and you should stop using the product immediately."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "No label: do not assume fine"
  value: "no product label"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "If the ingredients aren’t listed and there is no product label, don’t assume it’s fine."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Family exposure: vapors, washcloths, towels"
  value: "vapors, washcloths, towels"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "When you use these products your family might breathe mercury vapors or might become exposed by using things like washcloths or towels contaminated with mercury."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Especially vulnerable groups"
  value: "pregnant women, nursing babies, young children"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Some people – including pregnant women, nursing babies and young children – are especially vulnerable to mercury toxicity."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Wash hands and body parts"
  value: "wash"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Thoroughly wash your hands and other parts of your body that have come in contact with products that contain mercury."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Signs of mercury poisoning"
  value: "irritability, tremors, vision, hearing, memory, numbness, tingling"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "irritability shyness tremors changes in vision or hearing memory problems depression numbness and tingling in hands, feet or around mouth"
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Seal before throwing out"
  value: "plastic bag, leak-proof container"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Before throwing out a product that may contain mercury, seal it in a plastic bag or leak-proof container."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
- claim: "Check local agency for disposal"
  value: "local, disposal"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Check with your local environmental, health, or solid waste agency for disposal instructions."
  source: https://www.fda.gov/consumers/consumer-updates/mercury-poisoning-linked-skin-products
