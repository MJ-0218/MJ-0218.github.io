- claim: "Unscented may contain fragrance to mask smell"
  value: "unscented"
  quote: "Even some products labeled “unscented” may contain fragrance ingredients. This is because the manufacturer may add just enough fragrance to mask the unpleasant smell of other ingredients"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Ingredient list required; fragrance listed as Fragrance/Flavor"
  value: "Fragrance"
  quote: "under U.S. regulations, fragrance and flavor ingredients can be listed simply as “Fragrance” or “Flavor.”"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "they are the kinds of cosmetic components that are most likely to be “trade secrets.”"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Fragrance in shampoos etc."
  value: "shampoos"
  quote: "Fragrance ingredients are also commonly used in other products, such as shampoos, shower gels, shaving creams, and body lotions."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
- claim: "Choose fragrance free; contact manufacturer"
  value: "fragrance free"
  quote: "if you are concerned about fragrance sensitivities, you may want to choose products that are fragrance free, and check the ingredient list carefully"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
  quote2: "If consumers have questions, they may choose to contact the manufacturer directly."
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/fragrances-cosmetics
