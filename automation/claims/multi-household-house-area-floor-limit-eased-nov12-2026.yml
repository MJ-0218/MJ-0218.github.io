- claim: "3일 국무회의 의결, 12일부터 시행"
  value: "3일, 12일, 11월 12일, 11월 3일"
  value_note: "기사 2026.11.03 — '3일 열린 국무회의' → 11월 3일, '12일부터 시행' → 11월 12일 (본문에도 '11월 12일부터')"
  quote: "국토교통부는 3일 열린 국무회의에서 건축법 시행령 일부개정안이 의결돼 12일부터 시행된다고 밝혔다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
- claim: "면적 660㎡→1000㎡(51.5%), 다가구 3층→4층"
  value: "660㎡, 1000㎡, 51.5%, 3층, 4층, 30년"
  value_note: "원문 숫자 그대로"
  quote: "1990년대 이후 30년 이상 묶여있던 다세대·다가구주택의 면적 제한은 기존 660㎡에서 1000㎡로 약 51.5% 늘어나며, 다가구주택의 층수는 기존 3층 이하에서 4층 이하로 1층 증가한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
- claim: "주민공동시설 용적률 완화"
  value: "용적률"
  quote: "다세대주택에 설치하는 주민공동시설에 대해 건축위원회를 통해 용적률을 완화할 수 있도록 규정한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
- claim: "8.13 주택 신속공급 방안"
  value: "8.13, 8월 13일"
  value_note: "원문 '(8.13)' = 8월 13일"
  quote: "이번 개정안은 '주택 신속공급 방안'(8.13)에서 발표한 다세대.다가구주택의 면적.층수 제한 등 건축기준을 합리화하는 내용을 포함하고 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
- claim: "일조권 10m 초과 17m 이하 5m 이격, 11월 12일"
  value: "10m, 17m, 5m, 11월 12일"
  value_note: "원문 숫자 그대로"
  quote: "이번 개정 건축법령 시행으로 10m 초과 17m 이하 구간에 5m 고정 이격기준이 적용됨에 따라"
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
- claim: "완화된 일조권 11월 12일"
  value: "11월 12일"
  quote: "완화된 일조권 기준도 11월 12일부터 시행된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974876"
