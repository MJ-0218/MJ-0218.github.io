- claim: "2030년 자살률 18.9명 이하, 사망자 1만 명 이하"
  value: "18.9명, 1만 명, 2030년, 2030년 18.9명 이하"
  value_note: "원문 2030년까지 ... 18.9명 이하 / 1만 명 이하"
  quote: "정부가 2030년까지 인구 10만 명당 자살률을 18.9명 이하로 낮추고 자살사망자 수를 1만 명 이하로 줄이기 위해 자살예방 안전망을 강화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "2024년 29.1명, 2025년 27.8명"
  value: "29.1명, 27.8명, 2024년, 2025년"
  value_note: "원문 2024년 29.1명 → 2025년 27.8명 (같은 기간 = 2024~2025년)"
  quote: "같은 기간 자살률도 29.1명에서 27.8명으로 낮아졌다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "12일 위원회 확정, 30일 국무조정실 첫 정례브리핑, 제6차(2026~2030)"
  value: "12일, 30일, 10월 30일, 제6차, 2026~2030"
  value_note: "원문 30일 / 지난 12일 (기사 날짜 2026.10.30)"
  quote: "국무조정실은 30일 자살예방 관련 첫 정례브리핑에서 이 같은 내용을 담은 '제6차 자살예방기본계획(2026~2030)'의 주요 내용과 향후 추진 방향을 설명했다. 제6차 자살예방기본계획은 지난 12일 한성숙 국무총리 주재로 열린 제11차 자살예방정책위원회에서 심의·확정됐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "치료비 100만→150만 원, 응급입원료 450만→600만 원, 단계적"
  value: "100만 원, 150만 원, 450만 원, 600만 원, 100만→150만 원, 450만→600만 원"
  value_note: "원문 100만 원에서 150만 원으로 / 450만 원에서 600만 원으로 (화살표로 축약)"
  quote: "자살시도자 치료비 지원 한도는 현행 100만 원에서 150만 원으로, 응급입원료 지원 상한은 450만 원에서 600만 원으로 단계적으로 높인다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "2027년 국가자살대응실, 인력 5.0→7.1명, 24시간 일시보호"
  value: "2027년, 5.0명, 7.1명, 24시간, 2026년"
  value_note: "원문 2026년 5.0명에서 2027년 7.1명 / 최대 24시간"
  quote: "2027년부터 국가자살대응실을 설치하고, 자살예방센터의 센터당 인력을 2026년 5.0명에서 2027년 7.1명으로 확충한다. 자살 위기자를 최대 24시간 보호하면서 상담과 회복을 지원하고 필요한 서비스를 안내하는 일시보호서비스도 도입한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "기존 지구대·파출소 귀가 → 상담·안내·동의 후 귀가"
  value: "지구대"
  quote: "기존에는 입원하지 않는 경우 지구대나 파출소에 머문 뒤 귀가하도록 했으나, 앞으로는 충분한 상담과 서비스 안내·동의 절차를 거쳐 귀가하도록 개선한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "정신응급 필수의료, 병상 391→2000개"
  value: "391개, 2000개, 2025년, 2030년"
  value_note: "원문 2025년 391개에서 2030년 2000개"
  quote: "정신응급 분야를 필수의료로 지정하고 관련 병상을 2025년 391개에서 2030년 2000개로 늘린다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "2027년 경찰 판단 지원·공공이송체계"
  value: "2027년"
  quote: "2027년부터 현장 출동 경찰의 판단 지원을 강화하고 공공이송체계를 도입한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "유족 원스톱 전국, 유족보호관"
  value: "유족보호관"
  quote: "자살유족을 위한 원스톱 지원을 전국으로 확대하고 유족이 참여하는 정책자문단을 운영한다. 특히 사건 발생 직후 개입해 원인 규명과 심리적 안정을 지원하는 '유족보호관'을 도입한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "2027년 기준 중위소득 6.7% 인상, 긴급생계비"
  value: "6.7%, 2027년"
  value_note: "원문 2027년 기준 중위소득을 6.7% 인상"
  quote: "빈곤으로 인한 위기를 줄이기 위해 2027년 기준 중위소득을 6.7% 인상하고 자살 고위험군에 대한 긴급생계비 지원 등 저소득층 생활보장을 강화한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148974641"
- claim: "109 24시간·비밀보장, 마들랜 24시간, 세 자리"
  value: "109, 24시간, ☎109"
  value_note: "원문 자살예방 상담전화 109(K-공감 기사 내) / 24시간 운영"
  quote: "자살예방 상담전화는 24시간 운영된다. 모든 전화는 비밀이 보장된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148954797"
- claim: "마들랜 SNS 상담 24시간"
  value: "마들랜"
  quote: "자살예방 상담전화 109 또는 SNS 상담 마들랜(마음을 들어주는 랜선친구)에서 24시간 전문가의 상담을 받을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148954797"
- claim: "109는 119처럼 기억하기 쉬운 세 자리"
  value: "세 자리"
  quote: "119처럼 기억하기 쉬운 세 자리 번호에 언제든 상담사에게 고민을 털어놓을 수 있는 상담전화가 24시간 운영되고 있다고 해서 놀랐다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148954797"
