- claim: "Storms began July 14, 2026; deadline Feb. 1, 2027"
  value: "July 14, 2026, Feb. 1, 2027"
  quote: "affected by severe storms in parts of Texas that began on July 14, 2026. These taxpayers now have until Feb. 1, 2027, to file various federal individual and business tax returns and make tax payments."
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "County list (62)"
  value: "Harris, Fort Bend, Bexar, Travis, Williamson, Galveston, Brazoria, Hays, Comal, Webb, 62"
  value_note: "원문 카운티 목록 62곳(Atascosa … Zavala) 계산"
  quote: "Atascosa, Austin, Bandera, Bastrop, Bexar, Blanco, Brazoria, Brewster, Burnet, Caldwell, Colorado, Comal, Crockett, DeWitt, Dimmit, Edwards, Fayette, Fort Bend, Frio, Galveston, Gillespie, Goliad, Gonzales, Grimes, Guadalupe, Harris, Hays, Jackson, Karnes, Kendall, Kerr, Kimble, Kinney, La Salle, Lavaca, Lee, Live Oak, Llano, Mason, Matagorda, Maverick, McMullen, Medina, Menard, Mitchell, Pecos, Real, Schleicher, Sutton, Terrell, Travis, Uvalde, Val Verde, Victoria, Waller, Washington, Webb, Wharton, Williamson, Wilson, Zapata, and Zavala counties qualify for tax relief"
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Window"
  value: "on or after July 14, 2026, before Feb. 1, 2027"
  quote: "certain deadlines falling on or after July 14, 2026, and before Feb. 1, 2027, are granted additional time to file"
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Extended 2025 returns; payments not eligible"
  value: "2025, April 15, 2026, not eligible"
  quote: "The Feb. 1, 2027, deadline applies to individuals who had a valid extension to file their 2025 individual income tax return. Because tax payments related to these 2025 returns were due on April 15, 2026, those payments are not eligible for this relief."
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Payroll/excise July 31, Nov. 2"
  value: "July 31, Nov. 2, 2026"
  quote: "quarterly payroll and certain excise tax returns normally due on July 31, 2026, and Nov. 2, 2026"
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Estimated tax postponed"
  value: "estimated tax"
  quote: "Estimated income tax payments originally due on or after July 14, 2026, are postponed through Feb. 1, 2027"
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Automatic; penalty notice; outside area 866-562-5227"
  value: "automatically, 866-562-5227"
  quote: "The IRS automatically identifies taxpayers located in the covered disaster area and applies filing and payment relief."
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Special Services number"
  value: "866-562-5227"
  quote: "should call the IRS Special Services toll-free number at 866-562-5227"
  source: "https://www.irs.gov/newsroom/irs-announces-tax-relief-for-texans-impacted-by-july-storms-various-deadlines-postponed-to-feb-1-2027"
- claim: "Penalty notice call"
  value: "penalty notice"
