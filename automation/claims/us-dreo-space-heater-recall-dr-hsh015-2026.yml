- claim: "Recall date Oct 29 2026"
  value: "Oct. 29, 2026"
  value_note: "API RecallDate 2026-10-29"
  quote: "2026-10-29"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Model, description, size, remote"
  value: "DR-HSH015, 11.5 inches, 13 inches"
  value_note: "원문 문장"
  quote: "This recall involves DREO space heaters, model number DR-HSH015. The ceramic, electric heaters are black and measure about 11.5 inches wide and 13 inches tall and include a remote control."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "April 2025 - January 2026; label underside"
  value: "April 2025, January 2026, YYYY/MM"
  value_note: "원문 문장"
  quote: "Only units manufactured from April 2025 through January 2026 are included in this recall. The manufacture date, in YYYY/MM format, and the model number are printed on a label on the heater’s underside"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Units 338,800; 36,300 Canada"
  value: "338,800, 36,300"
  quote: "About 338,800 (In addition, about 36,300 were sold in Canada)"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Hazard"
  value: "overheat, ignite"
  quote: "The recalled space heaters can overheat and ignite, posing fire and burn hazards."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Incidents 17, 3, 1"
  value: "17, Three, one"
  value_note: "원문 17 reports / three / one"
  quote: "DREO has received 17 reports of space heaters igniting, three resulting in property damage and one in a burn injury to the hand."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Retailers, dates, price"
  value: "Costco, September 2025, October 2026, $70, $110"
  value_note: "원문 between $70 and $110"
  quote: "Costco stores nationwide and online at Dreo.com, BestBuy.com, Kohls.com, Lowes.com, QVC.com, HomeDepot.com, B2BRenew.com and Costco.com from September 2025 through October 2026 for between $70 and $110."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Remedy"
  value: "free replacement, cutting the electrical cord"
  value_note: "원문 문장"
  quote: "Consumers should stop using the recalled space heaters immediately and contact DREO for a free replacement space heater. Consumers will be asked to unplug the space heater, destroy it by cutting the electrical cord and follow instructions to send a photo of the destroyed heater."
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
- claim: "Contact"
  value: "833-820-0887, 8:30 a.m., 6 p.m."
  value_note: "원문 문장"
  quote: "DREO toll-free at 833-820-0887 from 8:30 a.m. to 6 p.m. ET Monday through Friday, by email at spaceheater@realtimeresults.net"
  source: "https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=DREO"
