- claim: "Outbreak linked to Graziers raw milk cheeses; over half kids 5 or younger; long shelf life"
  value: "Graziers"
  quote: "multistate outbreak of E. coli infections linked to Graziers raw milk cheeses sold by Sierra Nevada Cheese Company. Over half of the sick people in this outbreak are children 5 years old and younger. These products have a long shelf life."
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "All Graziers recalled; varieties and sizes"
  value: "8-oz or 16-oz, 5-lb"
  quote: "medium cheddar, sharp cheddar, jalapeño jack, and Monterey jack sold at retail in 8-oz or 16-oz packages and available to food service customers or wholesalers in 5-lb loaves"
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
  quote2: "Sierra Nevada Cheese Company recalled all Graziers raw milk cheese"
  source2: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "Cases 13, states 9, hospitalizations 8, HUS 3, deaths 0, as of Sept 25"
  value: "13, 9, 8, 3"
  quote: "Cases: 13 Hospitalizations: 8 and 3 HUS Deaths: 0 States: 9"
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "Illness onset dates; true number higher"
  value: "July 7, Aug. 26, 2026"
  value_note: "July 7, 2026, to August 26, 2026"
  quote: "Illnesses started on dates ranging from July 7, 2026, to August 26, 2026."
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/investigation.html
  quote2: "many people recover without medical care and are not tested for E. coli"
  source2: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "Symptom thresholds"
  value: "102°F, 2 days"
  quote: "Diarrhea and a fever higher than 102°F Diarrhea for more than 2 days that is not improving"
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "Wash surfaces; pasteurized for kids under 5"
  value: "hot soapy water"
  quote: "Consider washing items and surfaces that may have touched the recalled cheeses using hot soapy water or a dishwasher."
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
  quote2: "Choose pasteurized milk and dairy products. This is especially important for children under 5"
  source2: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/index.html
- claim: "Case count date"
  value: "Sept. 25"
  value_note: "as of September 25, 2026"
  quote: "13 (as of September 25, 2026)"
  source: https://www.cdc.gov/ecoli/outbreaks/raw-milk-cheese-09-26/investigation.html
