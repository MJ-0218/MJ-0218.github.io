- claim: "4 tips"
  value: "read food labels"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Always read food labels. Avoid foods that you are allergic to. Learn to recognize the early symptoms of an allergic reaction, in case of accidental ingestion. Know what to do in case an allergic reaction occurs."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Symptoms list"
  value: "hives, swelling, vomiting, wheezing, dizziness"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Hives Flushed skin or rash Tingling or itchy sensation in the mouth Face, tongue, or lip swelling Vomiting and/or diarrhea Abdominal cramps Coughing or wheezing Dizziness and/or lightheadedness Swelling of the throat and vocal cords Difficulty breathing Loss of consciousness"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Symptoms minutes to hours"
  value: "few minutes, few hours"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "symptoms may appear from within a few minutes to a few hours."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Mild reaction not mild allergy"
  value: "anaphylaxis"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "a mild allergic reaction does not always mean the allergy is mild. Any allergic reaction has potential to lead to anaphylaxis."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Stop eating, evaluate emergency, seek care"
  value: "stop, medical attention"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Stop eating the food immediately Evaluate the need for emergency treatment (such as epinephrine) Seek medical attention"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "In parentheses"
  value: "lecithin (soy), flour (wheat), whey (milk)"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "In parentheses following the name of the ingredient in the ingredient list. Examples: “lecithin (soy),” “flour (wheat),” and “whey (milk)”"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
- claim: "Contains statement"
  value: "Contains Wheat, Milk, and Soy"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Immediately after or next to the list of ingredients in a “contains” statement. Example: “Contains Wheat, Milk, and Soy.”"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/food-allergies-what-you-need-know
