- claim: "No soap/detergent/produce wash"
  value: "soap, detergent, produce wash"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Washing fruits and vegetables with soap, detergent, or commercial produce wash is not recommended."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Porous; soap absorbed"
  value: "porous, absorbed"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Soap and household detergents can be absorbed by fruits and vegetables, despite thorough rinsing, and can make you sick."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Produce wash residue safety unknown"
  value: "residues, not tested"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "the safety of the residues of commercial produce washes is not known and their effectiveness has not been tested."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Wash under running water"
  value: "running water"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Wash all produce thoroughly under running water before preparing and/or eating"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Gently rub under plain running water"
  value: "plain running water"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Gently rub produce while holding under plain running water. There’s no need to use soap or a produce wash."
  source: https://www.fda.gov/consumers/consumer-updates/7-tips-cleaning-fruits-vegetables
- claim: "Scrub firm produce with brush"
  value: "melons, cucumbers, brush"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Scrub firm produce, such as melons and cucumbers, with a clean produce brush."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Dry with clean towel"
  value: "cloth, paper towel"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "After washing, dry produce with a clean cloth towel or paper towel"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Wash even if peeling"
  value: "skin, peel"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Even if you do not plan to eat the skin, it is still important to wash produce first"
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Refrigerate pre-cut"
  value: "pre-cut, packaged"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Refrigerate all produce that is purchased pre-cut or packaged."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Washing reduces not eliminates"
  value: "reduce, not eliminate"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Washing can reduce bacteria that may be present but will not eliminate it."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
- claim: "Cooking kills bacteria"
  value: "cooking"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Cooking produce thoroughly kills harmful bacteria and reduces the risk of illness."
  source: https://www.fda.gov/food/buy-store-serve-safe-food/selecting-and-serving-produce-safely
