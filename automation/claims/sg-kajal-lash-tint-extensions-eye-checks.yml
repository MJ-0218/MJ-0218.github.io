- claim: "Kohl names; unapproved in US; heavy metals antimony and lead"
  value: "antimony and lead"
  quote: "Also known as al-kahl, kajal, or surma, kohl is used in some parts of the world to enhance the appearance of the eyes, but is unapproved for cosmetic use in the United States. Kohl consists of salts of heavy metals, such as antimony and lead."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "Kohl linked to lead poisoning in children"
  value: "lead poisoning"
  quote: "there have been reports linking the use of kohl to lead poisoning in children"
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "'Kohl' may be shade name; check color additives approved for eye area"
  value: "shade"
  quote: "Some eye cosmetics may be labeled with the word \"kohl\" only to indicate the shade, not because they contain true kohl."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
  quote2: "make sure they are listed as approved for use in the area of the eye"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "Lash/brow tints caused serious injuries incl. blindness; silver nitrate professional only"
  value: "blindness"
  quote: "Permanent eyelash and eyebrow tints and dyes have been known to cause serious eye injuries, including blindness."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
  quote2: "these products are not for distribution or direct sale to consumers"
  source2: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "False lashes, extensions, adhesives are cosmetics; eyelids delicate"
  value: "adhesives"
  quote: "FDA considers false eyelashes, eyelash extensions, and their adhesives to be cosmetic products"
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
  quote2: "Check the ingredients before using these adhesives."
  source2: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
- claim: "Stop if irritation; see doctor"
  value: "irritation"
  quote: "If any eye cosmetic causes irritation, stop using it immediately. If irritation persists, see a doctor."
  source: https://www.fda.gov/cosmetics/cosmetic-products/eye-cosmetic-safety
