- claim: November 2026 Wednesdays
  value: Wed, Nov. 18, Nov. 18, Wed, Nov. 25, Nov. 25, 11th, 18th, 25th
  derived: "Nov. 1, 2026 is a Sunday, so the Wednesdays are Nov. 4, 11, 18, 25; second = 11th, third = 18th, fourth = 25th"
  quote: "Wednesday, November 18 | birthdays from the 11th to the 20th."
  source: https://tododisca.es/en/social-security-payment-calendar-november-2026/
  value_note: calendar arithmetic on the SSA rule, matches Tododisca
- claim: Nov. 3 for pre-May 1997 and dual recipients
  value: Tue, Nov. 3, Nov. 3, May 1997
  quote: "Tuesday, November 3 | beneficiaries who started receiving benefits before May 1997 and those who receive Social Security and SSI."
  source: https://tododisca.es/en/social-security-payment-calendar-november-2026/
  quote2: "People who began receiving Social Security before May 1997 generally receive their payment on the third day of the month."
  source2: https://www.usatoday.com/story/money/2026/10/19/social-security-payment-schedule-october-21-2026/92271253007/
  value_note: USA Today confirms the 3rd-of-month rule; Nov. 3, 2026 is a Tuesday
  secondary_ok: true
- claim: SSI paid Oct. 30
  value: Nov. 1, 2026, Sunday, Friday, Oct. 30, Oct. 30
  quote: "Nov. 1 is a Sunday, so recipients will receive their benefits on Oct. 30."
  source: https://www.washingtonexaminer.com/news/4749185/november-supplemental-security-direct-payment-goes-out-12-days/
  quote2: "SSI recipients will receive the November payment early, on Friday, October 30 , because November 1 falls on a Sunday."
  source2: https://tododisca.es/en/social-security-payment-calendar-november-2026/
  value_note: short date forms
  secondary_ok: true
