- claim: Nov. 10 because of Veterans Day
  value: Tuesday, Nov. 10, Nov. 10, Nov. 11, Veterans Day, 1st–10th
  quote: "receive their payments on the second Wednesday. However, in November this date coincides with Veterans Day , so payments will be moved up to Tuesday, November 10."
  source: https://www.cronista.com/en/today/the-november-holiday-that-falls-on-a-wednesday-and-advances-social-security-payments-when-it-is-and-what-it-commemorates/
  quote2: "Tuesday, November 10 | birthdays from the 1st to the 10th. It is moved from Wednesday, November 11, Veterans Day."
  source2: https://tododisca.es/en/social-security-payment-calendar-november-2026/
  value_note: November written as Nov.
  secondary_ok: true
- claim: Payment moved to prior business day
  value: federal holiday, business day before
  quote: "According to the SSA, when a payment date coincides with a Saturday, Sunday, or federal holiday, benefits are delivered on the previous b"
  source: https://www.cronista.com/en/today/the-november-holiday-that-falls-on-a-wednesday-and-advances-social-security-payments-when-it-is-and-what-it-commemorates/
  quote2: "November's schedule includes an early payment for some beneficiaries because of Veterans Day"
  source2: https://www.newsweek.com/when-are-november-2026-social-security-payments-coming-12577101
