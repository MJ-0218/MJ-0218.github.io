- claim: "Scope and defect, FMVSS 101"
  value: "2022-2024, 2022–2024, 101"
  quote: "recalling certain 2022-2024 Lexus  NX250, NX350, NX350 Hybrid, and NX450h+ vehicles. The instrument panel cluster combination meter may fail to display certain warnings or indicators."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LEXUS&model=NX&modelYear=2024"
  quote2: "Federal Motor Vehicle Safety Standard (FMVSS) number 101"
  source2: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LEXUS&model=NX&modelYear=2024"
- claim: "Consequence"
  value: "engine oil pressure"
  quote: "An instrument panel display that fails to show engine oil pressure, engine coolant temperature, or electrical charge increases the risk of a crash."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LEXUS&model=NX&modelYear=2024"
- claim: "Remedy, letters, contact, number"
  value: "Dec. 7, 2026, 1-800-331-4331, 26LA10"
  value_note: "December 7, 2026"
  quote: "Dealers will update the combination meter software, free of charge. Owner notification letters are expected to be mailed December 7, 2026. Owners may contact Toyota's customer service at 1-800-331-4331. Toyota's number for this recall is 26LA10."
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LEXUS&model=NX&modelYear=2024"
- claim: "Campaign number"
  value: "26V687000"
  quote: "\"NHTSACampaignNumber\":\"26V687000\""
  source: "https://api.nhtsa.gov/recalls/recallsByVehicle?make=LEXUS&model=NX&modelYear=2024"
