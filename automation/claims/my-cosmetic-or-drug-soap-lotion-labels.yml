- claim: "Antibacterial soaps are drugs; lotions to make attractive are cosmetics"
  value: "antibacterial"
  quote: "soaps and cleansers marketed as “antibacterial” are drugs. Lotions intended to make people more attractive are cosmetics."
  source: https://www.fda.gov/cosmetics/cosmetic-products/soaps-lotions
- claim: "Therapeutic purpose = drug"
  value: "drugs"
  quote: "if they’re intended to affect the structure or function of the body, or for a therapeutic purpose, such as treating or preventing disease, they’re drugs, or sometimes they may be both cosmetics and drugs"
  source: https://www.fda.gov/cosmetics/cosmetic-products/soaps-lotions
- claim: "Sunscreen, skin protectants, bleaches, acne/eczema/rosacea are drugs"
  value: "sunscreen"
  quote: "sunscreen products are drugs under U.S. law. So are skin protectants, skin bleaches, and treatments for skin conditions such as acne, eczema, or rosacea."
  source: https://www.fda.gov/cosmetics/cosmetic-products/soaps-lotions
- claim: "Moisturize + sun protect = both"
  value: "both"
  quote: "Some lotions are both cosmetics and drugs, and must meet the requirements for both categories. Lotions that are intended both to moisturize the skin and protect users from the sun are just one example."
  source: https://www.fda.gov/cosmetics/cosmetic-products/soaps-lotions
