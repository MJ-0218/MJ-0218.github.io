  quote: 내년 1월부터 COPD 환자의 조기 발견을 위해, 56세, 66세를 대상으로 폐기능검사가 신규 도입된다
  source: https://www.mt.co.kr/thebio/2025/12/31/2025123015070728499
  quote2: 내년부터 56세와 66세 국민들은 국가건강검진에 폐기능 검사가 추가된다
  source2: https://kormedi.com/2749899/
  value_note: MT '56세, 66세 … 내년 1월부터'(2025.12.31 기사 → 2026년 1월)
- claim: '목적: COPD 조기 발견'
