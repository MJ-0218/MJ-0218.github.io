- claim: Release date and number
  value: Oct. 16, 2026, IR-2026-123
  quote: IR-2026-123, Oct. 16, 2026
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
  source2: https://www.irs.gov/newsroom
  quote2: IR-2026-123, Oct. 16, 2026
  value_note: paraphrased from the quote
- claim: Refund count and completion
  value: more than 50,000, end of the year
  quote: The Internal Revenue Service has already begun issuing refunds to more than
    50,000 taxpayers who benefited from the adoption tax credit carryforward and expects
    the refund process for most eligible taxpayers to be complete by the end of the
    year.
  value_note: summarized
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
- claim: Who it applies to
  value: tax year 2025, 2025, 2020-2024, 2020–2024, $5,000
  quote: Under the new interpretation, for tax year 2025 only, adoption tax credit
    carryforwards from prior tax years (2020-2024) can increase the amount of the
    adoption tax credit that is refundable in 2025, subject to the $5,000 per qualifying
    child limitation.
  value_note: dash style
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
- claim: No amended return
  value: no amended return
  quote: Taxpayers should not need to file an amended return to receive the additional
    credit.
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
  value_note: paraphrased from the quote
- claim: Notice timing
  value: 30 days
  quote: Taxpayers will receive notices from the IRS, generally within 30 days of
    the adjustment, informing them of the amount and whether the adjustment resulted
    in a refund or was applied towards another tax or non-tax debt.
  value_note: summarized
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
- claim: Start and filing date rule
  value: late September, April 15, 2026, April 15
  quote: Refunds and adjustments began in late September and will continue until complete.
    Affected taxpayers generally do not need to take action. Taxpayers who filed their
    2025 return before April 15, 2026, will generally receive any applicable adjustment
    automatically.
  value_note: summarized
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
- claim: Later review cases
  value: extension, identity theft indicators, freezes, dependency conflicts, later
    in 2026
  quote: Taxpayers who filed their returns under an extension or whose accounts have
    identity theft indicators, freezes, dependency conflicts or other issues will
    be reviewed later in 2026
  value_note: summarized
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
- claim: More info page
  value: IRS.gov/AdoptionCredit, Online Account
  quote: For more information, visit IRS.gov/AdoptionCredit.
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
  value_note: paraphrased from the quote
- claim: Online account features
  value: check refund status, view notices
  quote: An IRS Online Individual Account enables taxpayers to view their tax records,
    check refund status, view notices and make payments
  value_note: summarized
  source: https://www.irs.gov/newsroom/irs-has-begun-issuing-automatic-refunds-to-individuals-who-claimed-adoption-tax-credit-carryforward-from-prior-years
