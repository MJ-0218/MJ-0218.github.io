- claim: "Clean and air-dry case"
  value: "air-dry"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "rub clean and rinse with fresh multi-purpose solution and air-dry your lens case each time lenses are removed."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "Flip, shake, dry"
  value: "flip, shake"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "You should flip your lens case over and shake out any excess solution, then dry with a fresh, clean cloth or air dry."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "No water of any kind"
  value: "tap, bottled, distilled, lake, ocean"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Do not expose your contact lenses to any water: tap, bottled, distilled, lake or ocean water."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "Replace case 3 months"
  value: "3 months"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Replace your contact lens storage case every 3 months or as directed by your eye care professional."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "No top-off, discard each use"
  value: "top-off, reuse"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Do not “top-off” the solutions in your case. Always discard all of the left over contact lens solution after each use. Never reuse any lens solution."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "Wash hands"
  value: "wash your hands"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Always wash your hands before handling contact lenses to reduce the chance of getting an infection."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
- claim: "Red/irritated: remove, consult"
  value: "red, irritated, vision"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Remove the lenses immediately and consult your eye care professional if your eyes become red, irritated, or your vision changes."
  source: https://www.fda.gov/medical-devices/contact-lenses/contact-lens-solutions-and-products
