- claim: "Defect and FMVSS 101"
  value: "101"
  value_note: "원문 FMVSS Number 101"
  quote: "The analog cluster’s tachometer and speedometer may become stuck or move erratically, providing inaccurate readings to the driver."
  quote2: "Federal Motor Vehicle Safety Standard (FMVSS) Number 101"
  source2: "https://api.nhtsa.gov/recalls/campaignNumber?campaignNumber=26V653000"
  source: "https://api.nhtsa.gov/recalls/campaignNumber?campaignNumber=26V653000"
- claim: "Consequence"
  value: "crash"
  quote: "A speedometer that fails to display accurate vehicle speed can increase the risk of a crash."
  source: "https://api.nhtsa.gov/recalls/campaignNumber?campaignNumber=26V653000"
- claim: "Remedy, letters Oct 26, December 2026"
  value: "Oct. 26, 2026, December 2026"
  value_note: "원문 October 26, 2026 / December 2026"
  quote: "Dealers will replace the instrument cluster modules, free of charge. Interim letters, notifying owners of the safety risk, are expected to be mailed in October 26, 2026. Additional letters will be sent once the remedy is available, anticipated in December 2026."
  source: "https://api.nhtsa.gov/recalls/campaignNumber?campaignNumber=26V653000"
- claim: "Phone, 26C46, VIN searchable Oct 7"
  value: "1-866-436-7332, 26C46, Oct. 7, 2026, 26V653000"
  value_note: "원문 October 7, 2026"
  quote: "Owners may contact Ford customer service at 1-866-436-7332. Ford's number for this recall is 26C46. Vehicle Identification Numbers (VINs) involved in this recall became searchable on NHTSA.gov on October 7, 2026."
  source: "https://api.nhtsa.gov/recalls/campaignNumber?campaignNumber=26V653000"
