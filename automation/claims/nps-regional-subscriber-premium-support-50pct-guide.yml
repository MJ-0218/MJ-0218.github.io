  value_note: "원문 그대로"
  quote: "생애 최대 12개월까지 무려 월 연금 보험료의 50%, 월 최대 3만 7950원을 지원한다는 것이다."
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
