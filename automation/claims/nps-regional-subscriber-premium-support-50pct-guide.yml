- claim: "보험료 50% 지원 제도"
  value: "50%"
  value_note: "원문 그대로"
  quote: "저소득 지역가입자의 경제적 부담을 덜고 노후 소득 보장을 강화하기 위해 보험료의 50%를 지원하는 제도를 말한다."
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
- claim: "올해부터 납부 재개 요건 삭제"
  value: "올해"
  value_note: "원문 그대로"
  quote: "올해부터는 납부 재개 요건이 삭제돼 소득 기준만 충족하면 계속 납부 중인 가입자도 신청할 수 있는데"
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
- claim: "조건: 80만 원 미만, 재산세 과세표준 6억 원 미만"
  value: "80만 원, 6억 원"
  value_note: "원문 그대로"
  quote: "기준소득월액 80만 원 미만의 가입자로 재산세는 과세표준 합계 6억 원 미만이어야 한다."
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
- claim: "종합소득 1680만 원 미만, 실업크레딧·농어업인 중복 불가"
  value: "1680만 원"
  value_note: "원문 그대로"
  quote: "사업, 근로소득을 제외한 종합소득 금액이 연 1680만 원 미만이라면 지원받을 수 있는데 만약 현재 실업크레딧이나 농어업인 연금 보험료를 지원받고 있다면 중복 지원은 불가하므로"
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
- claim: "세 가지 기준 모두 충족"
  value: "세 가지"
  value_note: "원문 그대로"
  quote: "지원 대상은 국민연금 지역가입자 중 아래 세 가지 기준을 모두 충족해야 한다."
  source: "https://www.korea.kr/news/reporterView.do?newsId=148975308"
- claim: "생애 최대 12개월, 50%, 월 최대 3만 7950원"
