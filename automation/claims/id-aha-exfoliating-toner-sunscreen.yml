- claim: "AHAs cause exfoliation; depends on type, concentration, pH"
  value: "exfoliation"
  quote: "AHA-containing products cause exfoliation, or shedding of the surface skin. The extent of exfoliation depends on the type and concentration of the AHA, its pH, and other ingredients in the product."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
- claim: "UV sensitivity rises; reversible after a week"
  value: "18"
  value_note: "18 persen"
  quote: "After four weeks of AHA application, volunteers' sensitivity to skin reddening produced by UV increased by 18 percent."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
  quote2: "One week after the treatments were halted, researchers found no significant differences in UV sensitivity among the various skin sites."
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
- claim: "Sunburn alert wording; sunscreen and a week afterwards"
  value: "a week afterwards"
  value_note: "seminggu sesudahnya"
  quote: "Use a sunscreen, wear protective clothing, and limit sun exposure while using this product and for a week afterwards."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
- claim: "CIR: glycolic and lactic safe at 10% or less, pH 3.5 or greater"
  value: "10, 3.5"
  value_note: "10 persen; pH 3,5"
  quote: "The AHA concentration is 10 percent or less. The final product has a pH of 3.5 or greater."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
  quote2: "concluded that products containing the AHAs glycolic and lactic acid are safe for use by consumers if"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
- claim: "Most common AHAs; salon products may lack ingredient list"
  value: "glycolic acid, lactic acid"
  quote: "The most common AHAs in cosmetic products are glycolic acid and lactic acid. Among others are citric acid, hydroxycaprylic acid, and hydroxycapric acid."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
  quote2: "because the FPLA does not apply to products used exclusively by professionals — for example, in salons — the requirement for an ingredient declaration does not apply to these products"
  source2: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids
- claim: "Skin peelers higher concentrations; serious reactions most with greatest exfoliation"
  value: "skin peelers"
  quote: "The more serious adverse reactions appear to occur most often with products that cause the greatest degree of exfoliation, such as \"skin peelers.\""
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/alpha-hydroxy-acids

