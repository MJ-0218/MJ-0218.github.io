- claim: "2027학년도 수능 전자기기 반입 금지, AI 안경 착용 시 다음 해 응시 자격 박탈"
  value: "2027학년도, 다음 해"
  value_note: "원문 그대로"
  quote: "2027학년도 대학수학능력시험(수능)에서는 인공지능(AI) 스마트안경과 휴대전화, 스마트워치, 전자담배, 블루투스 이어폰 등 모든 전자기기의 시험장 반입이 금지된다. 특히 AI 안경의 경우 시험 중 착용하면 다음 해 수능 응시 자격까지 박탈된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "교육부 19일 수능 유의 사항 안내"
  value: "19일, 11월 19일"
  value_note: "수능일 11월 19일(기존 글·교육부)"
  quote: "교육부는 19일 실시될 2027학년도 대학수학능력시험 수험생 유의 사항을 안내했다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "오전 8시 10분 입실, 모바일 신분증 불가"
  value: "8시 10분, 오전 8시 10분"
  value_note: "원문 그대로"
  quote: "수험표와 사진이 부착된 유효기간 내 신분증 (모바일 신분증은 불가) 을 지참하고 오전 8시 10분까지 지정된 시험실에 입실해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "수험표 분실 시 사진 1장·신분증, 오전 8시까지 시험 관리본부"
  value: "1장, 8시, 오전 8시"
  value_note: "원문 그대로"
  quote: "응시원서에 붙인 사진과 동일한 사진 1장과 신분증을 지참해 시험 당일 오전 8시까지 시험장 내 시험 관리본부로 찾아가면 수험표를 다시 발급받을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "사진 없으면 임시 수험표"
  value: "임시 수험표"
  value_note: "원문 그대로"
  quote: "사진이 없는 경우에도 시험 관리본부에 신고하면 임시 수험표를 발급받을 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "1교시 전 제출, 종료 후 반환, 미제출 적발 시 부정행위·무효"
  value: "1교시"
  value_note: "원문 그대로"
  quote: "전자기기를 시험장에 가지고 온 경우 1교시 시작 전 반입금지 물품 수거 시간에 감독관 지시에 따라 전자기기를 제출해야 하며, 시험 종료 이후 돌려받는다. 제출하지 않고 계속 가지고 있다가 적발되는 경우 부정행위로 처리되며 당해 시험은 무효가 된다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "아날로그 시계만"
  value: "아날로그"
  value_note: "원문 그대로"
  quote: "시계의 경우 결제·통신 기능 또는 전자식 화면 표시기(LCD, LED 등)가 모두 없는 아날로그 시계만 휴대할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "보청기·돋보기·연속혈당측정기 점검 후 휴대"
  value: "보청기"
  value_note: "원문 그대로"
  quote: "보청기, 돋보기, 연속혈당측정기 등 개인의 신체조건 또는 의료상 특별한 이유로 휴대가 필요한 물품은 매 교시 감독관의 사전 점검을 거친 후 휴대할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "스마트안경 고의 부정행위 형사처벌 대응, 감독관 확인 협조"
  value: "형사처벌"
  value_note: "원문 그대로"
  quote: "스마트안경 등을 활용한 계획적·고의적 부정행위는 시험 무효 등 제재뿐 아니라, 형사처벌까지 이루어질 수 있도록 고발·수사 의뢰 등 법적 대응을 적극 추진할 예정이다. 아울러, 수험생은 시험 감독관의 스마트안경 등 스마트기기 확인에 협조해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "4교시 한국사 필수"
  value: "4교시"
  value_note: "원문 그대로"
  quote: "4교시 한국사 영역에 응시하지 않으면 해당 시험이 무효 처리되고 성적 통지표 전체가 제공되지 않으므로, 모든 수험생은 반드시 4교시 한국사 영역에 응시해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "탐구 순서·제1선택 답안 수정 시 부정행위"
  value: "제1선택, 제2선택, 2개"
  value_note: "원문 그대로"
  quote: "4교시 탐구 영역에서 2개 과목 응시를 선택한 수험생이 제2선택 과목 시간에 이미 종료된 제1선택 과목의 답안을 수정하거나 작성할 경우, 부정행위 처리되어 해당 시험이 무효가 되므로 특히 주의해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "검은색 컴퓨터용 사인펜, 필적확인문구"
  value: "검은색"
  value_note: "원문 그대로"
  quote: "답안지에는 검은색 컴퓨터용 사인펜만 사용하는 것을 원칙으로 하며, 필적확인문구도 검은색 컴퓨터용 사인펜으로 기재해야 한다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "가채점표 매 교시 종료령 전까지"
  value: "가채점표"
  value_note: "원문 그대로"
  quote: "올해부터 수험표 뒤에 제공되는 가채점표는 매 교시 종료령 전까지 작성해야 한다. 종료령이 친 이후 문답지 회수 전에 가채점표를 작성할 경우 부정행위로 처리되므로 주의가 필요하다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
- claim: "자료집·영상 suneung.re.kr"
  value: "suneung.re.kr"
  value_note: "원문 그대로"
  quote: "유의 사항 자료집과 동영상은 대학수학능력시험 누리집(www.suneung.re.kr) 을 통해 확인할 수 있다."
  source: "https://www.korea.kr/news/policyNewsView.do?newsId=148975290"
