- claim: Open Enrollment Period dates
  value: October 15–December 7, Oct. 15, Dec. 7, December 7
  quote: Open Enrollment Period October 15-December 7
  value_note: same dates, written with a dash or as Oct. 15 / Dec. 7
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: This year's period
  value: "2026, Oct. 15–Dec. 7, 2026, December 7, 2026"
  derived: the annual Oct 15–Dec 7 window in calendar year 2026 (info_as_of 2026-10-19)
- claim: What you can change during OEP
  value: join, drop, or switch
  quote: Join, drop, or switch to another Medicare Advantage Plan with or without drug coverage (or add or drop drug coverage). Switch from Original Medicare to a Medicare Advantage Plan or from a Medicare Advantage Plan to Original Medicare. Join, drop, or switch to another Medicare drug plan if you’re in Original Medicare.
  value_note: summarized
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: Coverage start
  value: January 1, Jan. 1
  quote: January 1 of the next year (the plan must get your request to join by December 7)
  value_note: Jan. 1 abbreviation
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: Coverage start year
  value: "January 1, 2027, Jan. 1, 2027, 2027"
  derived: next year after the 2026 Open Enrollment Period
- claim: Medicare Advantage Open Enrollment Period
  value: January 1–March 31, Jan. 1–March 31, March 31
  quote: Medicare Advantage Open Enrollment Period (only if you’re already in a Medicare Advantage Plan) January 1-March 31
  value_note: dash style
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: What MA OEP allows
  value: switch MA plan, return to Original Medicare, join a separate drug plan
  quote: Switch to another Medicare Advantage Plan with or without drug coverage. Drop your Medicare Advantage Plan and return to Original Medicare. You'll also be able to join a separate Medicare drug plan.
  value_note: summarized
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: MA OEP year
  value: "2027, Jan. 1–March 31, 2027, March 31, 2027"
  derived: the Jan 1–Mar 31 window after the 2026 Open Enrollment Period falls in 2027
- claim: How to join
  value: call the plan, plan website, paper form
  quote: Contact the plan to join. You can call them, or visit their website. You can also ask for a paper form to fill out and mail back to the plan, but they must get it before your enrollment period ends.
  value_note: summarized
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: Plan finder
  value: Medicare.gov/plan-compare
  quote: the plan you want to join at Medicare.gov/plan-compare
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: Phone numbers
  value: 1-800-MEDICARE (1-800-633-4227), 1-877-486-2048
  quote: Call us at 1-800-MEDICARE (1-800-633-4227). TTY users can call 1-877-486-2048.
  value_note: same numbers
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
- claim: Initial Enrollment Period length
  value: 7 months
  quote: It lasts for 7 months, starting 3 months before you turn 65, and ending 3 months after the month you turn 65.
  value_note: summarized
  source: https://www.medicare.gov/basics/get-started-with-medicare/get-more-coverage/joining-a-plan
