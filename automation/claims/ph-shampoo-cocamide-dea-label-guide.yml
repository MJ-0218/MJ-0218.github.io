- claim: "Emulsifiers, foaming, pH"
  value: "foaming agents"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "DEA and DEA-related ingredients function as emulsifiers or foaming agents in cosmetics, or to adjust a product's pH (acidity)."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "1998 NTP animal study"
  value: "1998"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The NTP completed a study in 1998 that found an association between the topical application of DEA and certain DEA-related ingredients and cancer in laboratory animals."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "No human link established"
  value: "humans"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "The NTP study did not establish a link between DEA and the risk of cancer in humans."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "No reason to be alarmed"
  value: "alarmed"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "FDA believes that at the present time there is no reason for consumers to be alarmed based on the use of these substances in cosmetics."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "Used much less frequently"
  value: "much less frequently"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "it appears that DEA and DEA-related ingredients are used much less frequently in cosmetic products than they were when the NTP completed its study."
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "Avoid via ingredient statement on outer label"
  value: "outer container label"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "consumers wishing to avoid cosmetics containing DEA or DEA-related ingredients may do so by reviewing the ingredient statement that is required to appear on the outer container label"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
- claim: "Ingredient names"
  value: "Cocamide DEA, Triethanolamine"
  value_note: "원문 문장 속 항목을 요약한 키워드"
  quote: "Cocamide DEA Cocamide MEA DEA-Cetyl Phosphate DEA Oleth-3 Phosphate Lauramide DEA Linoleamide MEA Myristamide DEA Oleamide DEA Stearamide MEA TEA-Lauryl Sulfate Triethanolamine"
  source: https://www.fda.gov/cosmetics/cosmetic-ingredients/diethanolamine
