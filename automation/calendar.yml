# 반복 수요 캘린더 — 매년·매달·매주 같은 시기에 검색이 몰리는 주제
#
# ⚠ months / day 값은 "보통 이 시기"라는 일정 감각일 뿐 사실이 아니다.
#    글에 쓰는 날짜·금액은 매 주기 official 의 원문에서 다시 확인해 claims 로 남긴다.
#
# recurrence: yearly(기본) | monthly | weekly
# phases[].months   : 검색이 몰리는 달 (yearly)
# phases[].lead_days: 그 시기 시작 며칠 전부터 글을 준비할지
# phases[].queries  : 사람들이 실제로 치는 검색어 — 제목·소제목에 반영
# 같은 주기(cycle)에 이미 쓴 글이 있으면 건너뛴다. cycle = <id>-<phase>-<연도|연월|주차>

