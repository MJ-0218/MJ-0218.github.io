# 자동화 설정 — 트렌드 레이더(GitHub Actions)와 글쓰기 세션(Claude)이 함께 읽는다
timezone: Asia/Seoul
site_url: https://mj-0218.github.io      # 개인 도메인 연결 후 변경

channels:
  naver: primary       # 네이버 블로그 — 국내 검색 점유율 1위. _drafts/<slug>.md
  tistory: secondary   # 티스토리 — 다음·구글 유입. automation/variants/<slug>.tistory.md (네이버판과 다른 문장으로)
  semter: tools        # 셈터(Jekyll) — 계산기 허브. 글은 선택

publish:
  spacing_minutes: 90  # 발행 대기함이 추천하는 글 사이 간격 (한꺼번에 몰아 올리지 않기)
  hours: [7, 23]       # 추천 발행 시간대 (KST)
  outbox_days: 21      # 정보 기준일이 이보다 오래된 초안은 대기함에서 내림

images:
  per_post: [1, 4]          # 글 하나에 넣을 이미지 수 (최소, 최대)
  openai_model: gpt-image-2 # OpenAI 이미지 모델 (OPENAI_API_KEY 필요). 오류가 나면 계정에서 쓸 수 있는 모델명으로 바꾸기
  openai_size: 1536x1024
  openai_quality: medium    # low / medium / high — 높을수록 비쌈

writer:
  max_posts_per_run: 0      # 0 = 제한 없음. 기준을 통과한 후보는 전부 쓴다
  min_score: 35             # 레이더 점수가 이 값 이상인 후보만 검토
  style_min_score: 80       # style_check 점수 하한
  review_passes: 2          # 초안 이후 재검수 횟수 (1: 문체, 2: 독자·사실)

radar:
  # 레이더가 Google 뉴스에서 '최근 24시간 기사 수'를 세는 감시 키워드 (주기적 정부 발표·생활 수요)
  watch_keywords:
    - 청년 특별공급
    - 청약 일정
    - 무순위 청약
    - 행복주택 모집
    - 신혼희망타운
    - 근로장려금
    - 자녀장려금
    - 청년월세 지원
    - 청년도약계좌
    - 에너지바우처
    - 기초연금 인상
    - 부모급여
    - 민생지원금
    - 연말정산 간소화
    - 종합소득세 신고
    - 최저임금 결정
    - 사전투표소
    - 재보궐선거
    - 생생정보 맛집
    - 생방송 투데이 맛집
    - 국가장학금
    - 연말정산 미리보기
    - 실업급여
    - 청년내일저축계좌
    - 문화누리카드
    - 고향사랑기부제
    - 자동차세 연납
    - 국가건강검진
    - 수능 시간표
    - 복지급여 지급일
  # 방송 맛집 — 프로그램 이름으로 최근 3일 가게 정보 기사를 모은다 (tv_food)
  tv_programs: [생생정보, 생방송 투데이, 생방송 오늘저녁, 6시 내고향, 생활의 달인, 백반기행, 동네 한 바퀴, 맛있는 녀석들, 토요일은 밥이 좋아, 줄서는 식당]
  evidence_topics: 25      # 원문 수집본을 받아 둘 후보 수 (Actions)
  evidence_per_topic: 4    # 후보 하나당 기사 수
  korea_kr_home: https://www.korea.kr/   # 정책브리핑 RSS 는 2026-07-01 중단 → 첫 화면 실시간 인기뉴스 사용
  # applyhome.endpoint 를 바꾸면 청약홈 API 주소를 덮어쓴다 (DATA_GO_KR_KEY 필요)

# ── 미국 (Google Blogger) ─────────────────────────────────────────────
# 같은 방식(캘린더 + 실시간 레이더 + 원문 대조)으로 미국 독자용 영어 글을 만든다. 번역이 아니라 미국 주제.
radar_us:
  geo: US
  news_locale: { hl: en-US, gl: US, ceid: "US:en" }
  sources: [calendar, google_trends, google_news]
  fetch_calendar_official: true               # .gov 는 작성 세션에서 막혀 있어 Actions 가 미리 받아 둔다
  fetch_requests: automation/global/fetch_requests.txt
  evidence_topics: 20
  evidence_per_topic: 4
  watch_keywords:
    - social security payment
    - social security COLA
    - SSI payment
    - SNAP benefits
    - IRS refund
    - tax deadline
    - medicare open enrollment
    - ACA open enrollment
    - FAFSA
    - student loan
    - minimum wage increase
    - daylight saving time
    - election day
    - early voting
    - REAL ID
    - product recall
    - car recall
    - LIHEAP
    - federal holiday
    - stimulus check
  categories:
    Benefits: [social security, ssi, snap, food stamps, cola, stimulus, liheap, wic, benefit, payment schedule, unemployment]
    Taxes: [irs, tax, refund, w-2, 1099, deduction, credit, filing]
    Health Insurance: [medicare, medicaid, aca, obamacare, marketplace, open enrollment, health insurance]
    Student Aid: [fafsa, pell, student loan, student aid]
    Elections: [election, vote, voting, ballot, polling]
    Recalls: [recall, nhtsa, cpsc, fda]
    Holidays: [holiday, daylight saving, thanksgiving, veterans day, christmas]
    Housing: [rent, mortgage, hud, housing]
us_publish:
  timezone_offset: -5                          # (참고용) 실제 계산은 America/New_York 시간대로 서머타임 반영
  hours: [6, 22]                               # ET 기준 추천 발행 시간대
  spacing_minutes: 120

# ── Blogger 블로그 목록 (blogger-publish.yml 이 차례로 돈다) ───────────────────
# secret: 블로그 ID 가 들어 있는 GitHub Secret 이름 (OAuth 3개는 모든 블로그가 같이 씀 — 같은 구글 계정)
# per_day: 그 나라 날짜 기준 하루 최대 발행 편수 (0 = 제한 없음). 작성 세션도 이 수만큼만 쓴다
# hours/spacing_minutes: 그 나라 시간 기준 추천 발행 시간대와 간격
# kind: news(이슈·생활 정보, 애드센스형) | shop(뷰티·생활 큐레이션 + 쇼피·제휴 링크)
blogs:
  us: { secret: BLOGGER_BLOG_ID,    kind: news, lang: en, tz: America/New_York,  hours: [6, 22], spacing_minutes: 120, per_day: 0,
        drafts: automation/global/drafts, state: automation/state/blogger_scheduled.json, label: "미국" }
  in: { secret: BLOGGER_BLOG_ID_IN, kind: news, lang: en, tz: Asia/Kolkata,      hours: [7, 23], spacing_minutes: 180, per_day: 5,
        drafts: automation/blogs/in/drafts, state: automation/state/blogger_scheduled_in.json, label: "인도" }
  ph: { secret: BLOGGER_BLOG_ID_PH, kind: shop, lang: en, tz: Asia/Manila,       hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/ph/drafts, state: automation/state/blogger_scheduled_ph.json, label: "필리핀" }
  sg: { secret: BLOGGER_BLOG_ID_SG, kind: shop, lang: en, tz: Asia/Singapore,    hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/sg/drafts, state: automation/state/blogger_scheduled_sg.json, label: "싱가포르" }
  my: { secret: BLOGGER_BLOG_ID_MY, kind: shop, lang: en, tz: Asia/Kuala_Lumpur, hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/my/drafts, state: automation/state/blogger_scheduled_my.json, label: "말레이시아" }
  vn: { secret: BLOGGER_BLOG_ID_VN, kind: shop, lang: vi, tz: Asia/Ho_Chi_Minh,  hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/vn/drafts, state: automation/state/blogger_scheduled_vn.json, label: "베트남" }
  id: { secret: BLOGGER_BLOG_ID_ID, kind: shop, lang: id, tz: Asia/Jakarta,      hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/id/drafts, state: automation/state/blogger_scheduled_id.json, label: "인도네시아" }
  th: { secret: BLOGGER_BLOG_ID_TH, kind: shop, lang: th, tz: Asia/Bangkok,      hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/th/drafts, state: automation/state/blogger_scheduled_th.json, label: "태국" }
  tw: { secret: BLOGGER_BLOG_ID_TW, kind: shop, lang: zh-Hant, tz: Asia/Taipei,  hours: [8, 23], spacing_minutes: 210, per_day: 4,
        drafts: automation/blogs/tw/drafts, state: automation/state/blogger_scheduled_tw.json, label: "대만" }
blogger_run:
  max_new_per_run: 8      # 한 번 실행에서 새로 만드는 글 수 (429 방지). 남은 글은 다음 시간에
  pause_seconds: 20       # 글 사이 쉬는 시간

