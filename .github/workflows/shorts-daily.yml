# 쇼츠 하루치 제작 + 예약 업로드. 매일 새벽 5시(KST)에 돌고, 비밀값이 없으면 그 단계만 건너뛴다.
name: shorts-daily
on:
  schedule:
    - cron: "7 20 * * *"   # 05:07 KST
  push:
    branches: [main]
    paths: ["shorts/sources.yml"]   # 대기판에서 허가한 영상이 들어오면 바로 제작(하루 편수 상한 안에서)
  workflow_dispatch:
    inputs:
      limit: { description: "만들 편수(비우면 config 의 daily_count)", required: false }
concurrency: { group: shorts-daily, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 도구 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip > /dev/null
          pip install -q anthropic pydantic pyyaml yt-dlp
      - name: 글꼴 받기 (OFL)
        run: |
          mkdir -p shorts/assets/fonts && cd shorts/assets/fonts
          curl -sSLo BlackHanSans-Regular.ttf https://github.com/google/fonts/raw/main/ofl/blackhansans/BlackHanSans-Regular.ttf
          curl -sSLo p.zip https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -qjo p.zip '*static/Pretendard-Black.otf' && rm p.zip && ls
      - name: 제작 + 예약 업로드
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 shorts/run.py daily ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: 완성본을 릴리스에 올리기 (휴대폰에서 바로 받기용, 14일 보관)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: python3 shorts/run.py release
      - name: 완성본 보관 (14일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: shorts/out/**/*.mp4
          retention-days: 14
          if-no-files-found: ignore
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "semter-shorts"
          git config user.email "shorts@users.noreply.github.com"
          if [ -n "$(git status --porcelain --untracked-files=all shorts/state/ shorts/sources.yml)" ]; then
            git add shorts/state/ shorts/sources.yml
            git commit -m "shorts: 제작·예약 기록"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
