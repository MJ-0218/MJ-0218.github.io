# 해외 글 → Google Blogger 예약 발행 (공식 Blogger API v3). 비밀값이 없으면 계획만 출력한다.
name: blogger-publish
on:
  push:
    branches: [main]
    paths: ["automation/global/drafts/**", "automation/state/published.json"]
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
concurrency: { group: blogger-publish, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyyaml markdown
      - name: 예약 발행
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python3 automation/scripts/blogger_publish.py
      - name: 예약 기록 저장
        if: always()
        run: |
          git config user.name "semter-blogger"
          git config user.email "blogger@users.noreply.github.com"
          if ! git diff --quiet -- automation/state/blogger_scheduled.json 2>/dev/null || [ -n "$(git status --porcelain automation/state/blogger_scheduled.json)" ]; then
            git add automation/state/blogger_scheduled.json
            git commit -m "blogger: 예약 발행 기록"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
