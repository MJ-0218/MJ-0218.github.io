# 해외 글(미국·인도·쇼피 국가별) → Google Blogger 예약 발행 (공식 Blogger API v3). 비밀값이 없으면 계획만 출력한다.
name: blogger-publish
on:
  push:
    branches: [main]
    paths: ["automation/global/drafts/**", "automation/blogs/*/drafts/**", "automation/state/published.json"]
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
concurrency: { group: blogger-publish, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 예약 기록(blogger_scheduled.json)이 들어간 최신 main 기준 — 중복 발행 방지
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pyyaml markdown
      - name: 최신 예약 기록 받기
        run: git pull -q --ff-only origin main
      - name: 예약 발행
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_BLOG_ID_IN: ${{ secrets.BLOGGER_BLOG_ID_IN }}
          BLOGGER_BLOG_ID_PH: ${{ secrets.BLOGGER_BLOG_ID_PH }}
          BLOGGER_BLOG_ID_SG: ${{ secrets.BLOGGER_BLOG_ID_SG }}
          BLOGGER_BLOG_ID_MY: ${{ secrets.BLOGGER_BLOG_ID_MY }}
          BLOGGER_BLOG_ID_VN: ${{ secrets.BLOGGER_BLOG_ID_VN }}
          BLOGGER_BLOG_ID_ID: ${{ secrets.BLOGGER_BLOG_ID_ID }}
          BLOGGER_BLOG_ID_TH: ${{ secrets.BLOGGER_BLOG_ID_TH }}
          BLOGGER_BLOG_ID_TW: ${{ secrets.BLOGGER_BLOG_ID_TW }}
        run: python3 automation/scripts/blogger_publish.py
      - name: 예약 기록 저장
        if: always()
        run: |
          git config user.name "semter-blogger"
          git config user.email "blogger@users.noreply.github.com"
          if [ -n "$(git status --porcelain automation/state/)" ]; then
            git add automation/state/
            git commit -m "blogger: 예약 발행 기록"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
