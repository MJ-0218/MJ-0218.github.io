# 초안 PR마다: 출처 원문을 실제로 내려받아 인용문 대조 + 문체 검사 + 계산기 테스트 + 사이트 빌드
name: fact-check
on:
  push:
    branches: [main]
    paths: ["_drafts/**", "automation/variants/**", "automation/claims/**"]
  pull_request:
    paths: ["_drafts/**", "_posts/**", "automation/**", "tools/**", "assets/**", "_layouts/**"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml markdown && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: 바뀐 글 찾기
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"
          git cat-file -e "$base" 2>/dev/null || base=HEAD~1
          files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- '_drafts/*.md' '_posts/*.md' 'automation/variants/*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "검사 대상: ${files:-없음}"
      - name: 사실 검증 (출처 원문 대조)
        if: steps.changed.outputs.files != ''
        run: python3 automation/scripts/verify_claims.py ${{ steps.changed.outputs.files }} --fetch --summary "$GITHUB_STEP_SUMMARY"
      - name: 문체 검사
        if: steps.changed.outputs.files != ''
        run: python3 automation/scripts/style_check.py ${{ steps.changed.outputs.files }}
      - name: 네이버판·티스토리판 유사도
        if: steps.changed.outputs.files != ''
        run: |
          rc=0
          for v in automation/variants/*.tistory.md; do
            [ -e "$v" ] || continue
            d="_drafts/$(basename "$v" .tistory.md).md"
            [ -e "$d" ] && { echo "== $d"; python3 automation/scripts/similarity_check.py "$d" "$v" || rc=1; }
          done
          exit $rc
      - name: 검사기·계산기 테스트
        run: |
          python3 automation/scripts/test_verify.py
          node automation/scripts/test_tools.js
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true }
      - name: 사이트 빌드
        run: bundle exec jekyll build --drafts 2>/dev/null
