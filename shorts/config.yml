# 쇼츠 자동화 설정. 값만 바꾸면 되고 코드는 건드리지 않아도 된다.
channel:
  name: "내 채널 이름"
  language: ko
  # 업로드 시각(한국 시간). 경쟁 채널: 숏싹숏싹 08:00·17:00, 신기+템 19:00~21:00 (vidIQ 업로드 기록 기준).
  slots_kst: ["07:30", "09:00", "11:30", "13:00", "17:00", "19:00", "20:30", "22:00"]
  daily_count: 8          # 하루 편수 (7~10 권장)
  category_id: "24"       # 24 = 엔터테인먼트, 26 = 노하우/스타일
  made_for_kids: false

claude:
  model: claude-opus-5-5
  effort: medium
  max_frames: 24          # 장면 분석에 보낼 프레임 수 (많을수록 정확, 비용↑)

tts:
  provider: elevenlabs    # elevenlabs | google | edge(미리보기용) | silent(테스트용)
  speed: 1.12             # 경쟁 채널은 빠르고 높은 톤의 여성 음성
  elevenlabs:
    voice_id: QPFsEL6IBxlT15xfiD6C   # Hana Lee - Natural & Cheerful (높고 빠른 여성 톤, 보이스 라이브러리). Secret ELEVENLABS_VOICE_ID 가 있으면 그게 우선
    model_id: eleven_multilingual_v2
    stability: 0.4
    similarity_boost: 0.8
    style: 0.35
  google:
    voice: ko-KR-Chirp3-HD-Aoede
  edge:
    voice: ko-KR-SunHiNeural

stt:
  model_id: scribe_v1     # ElevenLabs 받아쓰기(원본 대사 → 따옴표 자막·번역)

# 인기작 50편 분석(research/top50-notes.md)으로 나눈 두 틀. Claude 가 클립을 보고 고른다.
templates:
  story:                  # 숏싹숏싹형: 해외 클립 + 처음부터 끝까지 나레이션, 보상은 끝부분
    min_sec: 35
    max_sec: 56
    line1_color: "FFFFFF"
    line2_color: "FFE14D"
    original_audio: 0.22
  clip:                   # 신기+템형: 원테이크 클립 + 첫 줄만 나레이션, 원본 소리·대사 자막이 주인공
    min_sec: 9
    max_sec: 30
    line1_color: "FFFFFF"
    line2_color: "B6FF3B" # 형광연두 (25편 중 18편)
    original_audio: 0.95

video:
  min_sec: 9
  max_sec: 56
  original_audio: 0.22    # 원본 소리 볼륨(나레이션 아래로 깔기)
  bgm_volume: 0.10
  sfx_volume: 0.55

style:
  banner_height: 300
  banner_color: "000000"
  line1_color: "FFFFFF"
  line2_color: "FFE14D"   # 둘째 줄 강조색
  accent_bar: ""          # 배너 밑 얇은 강조선 (두 채널 모두 없음 → 끔)
  font: "Black Han Sans"
  sub_font: "Pretendard Black"
  narr_size: 74
  aside_size: 66
  banner_size: 88

scout:
  # 원본 클립 자동 탐색. CC BY 영상만 자동 등록, 일반 영상은 허가 대기 후보(state/candidates.json → 쇼츠 대기판)만 만든다.
  queries:
    - satisfying cleaning
    - weird beauty product
    - makeup transformation
    - life hack
    - Japanese convenience store gadget
    - restoration
    - funny pet
    - 신기한 물건
    - 꿀팁
    - 메이크업 변신
  min_sec: 8
  max_sec: 90
  min_views: 50000
  max_age_days: 365
  permission_candidates: true
  permission_queries: 4   # 일반 영상 검색에 쓸 검색어 수(검색 1번 = 할당량 100)

social:
  # 인스타·틱톡 급상승 클립 탐색(vidIQ, 검색 1번 = 5크레딧, 하루 10번 = 50크레딧). 매시간 세션이 하루 한 번 돈다.
  # 신기+템 인기작 원본은 국내 인스타·틱톡 클립(학교 14 · 가족 5 · 알바·직장 2), 숏싹숏싹은 해외 패션·뷰티 꿀팁.
  # 해외 7 : 국내 3 — 숏싹숏싹 인기작 25편은 전부 해외 클립(번역·나레이션이 우리 몫이 커서 재사용 판정에도 유리).
  daily_queries:
    - {q: "husband wife couple prank funny reaction family real moment", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "wholesome heartwarming real moment strangers kindness surprise reaction", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "high school students teacher prank classroom funny moment", lang: en, max_sec: 45, min_views: 1000000}
    - {q: "cheap vs expensive comparison tried it rating every item", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "experiment does it work satisfying result DIY test reveal", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "culture shock foreigner trying weird habit why Americans do this", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "fashion beauty hacks women clothing makeup trick before after", lang: en, max_sec: 60, min_views: 1000000}
    - {q: "한국 고등학교 교실 학생들 웃긴 상황 선생님 반응", lang: ko, max_sec: 40, min_views: 300000}
    - {q: "가족 일상 아빠 엄마 아이 웃긴 반응 실제 상황", lang: ko, max_sec: 40, min_views: 300000}
    - {q: "알바생 손님 직장인 회사 웃긴 실제 상황 공감", lang: ko, max_sec: 40, min_views: 300000}
  days_back: 60
  per_platform: 10

upload:
  # YouTube Data API 업로드. 감사(audit) 안 받은 API 프로젝트는 '비공개'로만 올라간다(Google 공식 문서).
  enabled: false   # 지금은 대기판에서 복사해 직접 업로드. API 감사 통과 후 true 로 바꾸면 자동 예약
  privacy_until_publish: private
  contains_synthetic_media: false   # 실존 인물·실제 사건처럼 보이는 합성물이면 true
