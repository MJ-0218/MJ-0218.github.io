# ─────────────────────────────────────────────
#  셈터 — 생활 계산기 + 오늘의 정보
# ─────────────────────────────────────────────
title: 셈터
tagline: 검색하던 그 숫자, 여기서 바로 셈합니다
description: >-
  평수, 퇴직금, 연차처럼 매번 검색하게 되는 생활 숫자를 바로 계산해 주는 도구와,
  출처를 확인한 생활 정보 글을 모아 둔 곳.
lang: ko
author: MJ-0218
url: "https://mj-0218.github.io"   # 개인 도메인 연결 후 이 값을 바꾸세요
baseurl: ""
github_username: MJ-0218
timezone: Asia/Seoul

# ── 수익화 설정 ──────────────────────────────
# 애드센스 승인 후 ca-pub-XXXXXXXXXXXXXXXX 값을 넣으면 광고가 켜집니다.
# 비워 두면 광고 코드는 출력되지 않습니다.
adsense_client: ""
adsense_slots:
  top: ""
  inline: ""
  bottom: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed

permalink: /:year/:month/:day/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "tools" }
    values: { layout: tool }

exclude:
  - automation/
  - exports/
  - vendor/
  - .bundle/
  - .claude/
  - README.md
  - Gemfile
  - Gemfile.lock
